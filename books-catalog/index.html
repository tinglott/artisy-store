<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThemeSheet — AI Printable Generator with Realistic Images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
:root {
  --ink: #2a1a12; --paper: #fff8ec; --marigold: #f2a03d; --coral: #e8613f;
  --teal: #1f7a72; --line: #e4d4b8; --card: #ffffff; --muted: #6b5844;
}
html, body { margin: 0; padding: 0; }
#printables-root {
  font-family: 'Nunito', -apple-system, sans-serif; color: var(--ink);
  background: radial-gradient(circle at 15% 0%, #fff3d9 0%, var(--paper) 45%);
  min-height: 100vh; padding: 28px 18px 80px; box-sizing: border-box;
}
#printables-root * { box-sizing: border-box; }
h1, h2, h3 { font-family: 'Fredoka', sans-serif; margin: 0; }
.pr-header { text-align: center; margin-bottom: 26px; }
.pr-eyebrow {
  display: inline-block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--coral); font-weight: 800; background: #fff1e2; border: 1px solid #ffd9ad;
  padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
}
.pr-title { font-size: 34px; font-weight: 700; line-height: 1.15; }
.pr-title span { color: var(--coral); }
.pr-sub { margin-top: 8px; font-size: 15px; color: var(--muted); max-width: 520px; margin-left: auto; margin-right: auto; }
.pr-form {
  background: var(--card); border: 1px solid var(--line); border-radius: 22px;
  padding: 22px; max-width: 560px; margin: 0 auto 24px;
  box-shadow: 0 12px 36px -16px rgba(60,40,10,.28);
}
.pr-label {
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  color: #8a7455; display: block; margin: 14px 0 7px;
}
.pr-label:first-child { margin-top: 0; }
#printables-root input[type=text], #printables-root select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  font-size: 15px; font-family: inherit; background: #fffdf8; color: var(--ink);
}
#printables-root input[type=text]:focus, #printables-root select:focus {
  outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(232,97,63,.15);
}
.pr-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pr-chip {
  border: 1.5px solid var(--line); background: #fffdf8; color: var(--ink);
  padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .15s ease; font-family: inherit;
}
.pr-chip:hover { border-color: var(--marigold); transform: translateY(-1px); }
.pr-chip.active { background: var(--ink); border-color: var(--ink); color: #fff9ec; }
.pr-audience-row { display: flex; gap: 8px; }
.pr-audience-row .pr-chip { flex: 1; text-align: center; }
.pr-row { display: flex; gap: 12px; }
.pr-row > * { flex: 1; }
.pr-generate {
  width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--coral), var(--marigold)); color: #fff;
  font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: .02em;
  cursor: pointer; box-shadow: 0 8px 20px -8px rgba(232,97,63,.55);
  transition: transform .12s, box-shadow .12s;
}
.pr-generate:hover:not(:disabled) { transform: translateY(-1px); }
.pr-generate:disabled { opacity: .55; cursor: default; }
.pr-error {
  max-width: 560px; margin: 0 auto 16px; background: #fdeceb; border: 1px solid #f3b8b0;
  color: #93342a; padding: 12px 16px; border-radius: 12px; font-size: 14px; text-align: center;
}
.pr-loading { text-align: center; padding: 48px 16px; color: #8a7455; font-weight: 700; }
.pr-loading .pr-spin {
  width: 40px; height: 40px; margin: 0 auto 16px; border-radius: 50%;
  border: 4px solid var(--line); border-top-color: var(--coral); animation: pr-spin .75s linear infinite;
}
@keyframes pr-spin { to { transform: rotate(360deg); } }
.pr-loading-hint { font-size: 13px; font-weight: 600; opacity: .8; margin-top: 8px; }
.pr-sheet {
  max-width: 720px; margin: 0 auto; background: var(--card); border-radius: 24px;
  border: 1px solid var(--line); box-shadow: 0 18px 48px -22px rgba(60,40,10,.38); overflow: hidden;
}
.pr-sheet-hero {
  position: relative; height: 220px; overflow: hidden;
  background: linear-gradient(120deg, var(--coral), var(--marigold));
}
.pr-sheet-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pr-sheet-hero::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 50%, transparent 100%);
}
.pr-sheet-band {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 18px 24px 20px; color: #fff; z-index: 2;
}
.pr-sheet-band .pr-tag { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .92; font-weight: 800; }
.pr-sheet-band h2 { font-size: 26px; margin-top: 4px; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
.pr-sheet-band .pr-tagline { font-size: 14px; opacity: .95; margin-top: 5px; text-shadow: 0 1px 4px rgba(0,0,0,.3); }
.pr-sheet-body { padding: 20px 24px 10px; }
.pr-item {
  display: grid; grid-template-columns: auto 1fr; gap: 12px 14px;
  border-bottom: 1px dashed var(--line); padding: 16px 0; align-items: start;
}
.pr-item:last-child { border-bottom: none; }
.pr-item-img {
  width: 72px; height: 72px; border-radius: 12px; object-fit: cover;
  border: 1px solid var(--line); background: #f8f0e0; flex-shrink: 0;
}
.pr-item-num {
  display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
  background: var(--teal); color: #fff; border-radius: 8px; font-size: 12px; font-weight: 800; margin-right: 8px;
}
.pr-item-title { font-weight: 800; font-size: 15.5px; display: inline; }
.pr-item-body { margin-top: 5px; font-size: 14px; line-height: 1.5; color: #4a3a2a; }
.pr-item-blank { display: inline-block; border-bottom: 1.5px solid var(--ink); min-width: 100px; margin: 0 3px; }
.pr-checkbox {
  display: inline-block; width: 16px; height: 16px; border: 1.5px solid var(--ink);
  border-radius: 4px; margin-right: 8px; vertical-align: -2px;
}
.pr-footer-note {
  text-align: center; font-size: 12.5px; color: #a08e6f; padding: 14px 20px 22px; font-style: italic;
}
.pr-actions { max-width: 720px; margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 10px; }
.pr-actions button {
  flex: 1; min-width: 120px; padding: 12px; border-radius: 12px;
  font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px;
  cursor: pointer; border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
}
.pr-actions button.pr-primary { background: var(--ink); color: #fff9ec; }
@media print {
  #printables-root { background: #fff !important; padding: 0; }
  .pr-header, .pr-form, .pr-actions, .pr-error, .pr-loading { display: none !important; }
  .pr-sheet { box-shadow: none; border: none; max-width: 100%; border-radius: 0; }
  .pr-sheet-hero { height: 180px; }
  .pr-item-img { width: 56px; height: 56px; }
}
@media (max-width: 520px) {
  .pr-title { font-size: 26px; }
  .pr-audience-row { flex-wrap: wrap; }
  .pr-item { grid-template-columns: 1fr; }
  .pr-item-img { width: 100%; height: 140px; }
  .pr-row { flex-direction: column; }
}
</style>
</head>
<body>
<div id="printables-root">
<div class="pr-header">
<div class="pr-eyebrow">Print & Play · Powered by Pollinations AI (Flux)</div>
<div class="pr-title">Theme<span>Sheet</span></div>
<div class="pr-sub">Type any theme — party, road trip, classroom unit, holiday — and get a beautiful printable handout with realistic AI illustrations in seconds. Fully free, no API keys needed.</div>
</div>

<div class="pr-form" id="pr-form">
<label class="pr-label">What's the theme?</label>
<input type="text" id="pr-theme" placeholder="e.g. Under-the-sea birthday, Fall harvest picnic, Space camp adventure" maxlength="120" />

<label class="pr-label">Handout type</label>
<div class="pr-chip-row" id="pr-types">
  <button class="pr-chip active" data-type="scavenger hunt">Scavenger Hunt</button>
  <button class="pr-chip" data-type="trivia quiz">Trivia Quiz</button>
  <button class="pr-chip" data-type="checklist / packing list">Checklist</button>
  <button class="pr-chip" data-type="word search clues">Word Search Clues</button>
  <button class="pr-chip" data-type="bingo call sheet">Bingo Call Sheet</button>
  <button class="pr-chip" data-type="fun-fact cheat sheet">Fun-Fact Sheet</button>
  <button class="pr-chip" data-type="story starters">Story Starters</button>
  <button class="pr-chip" data-type="discussion prompts">Discussion Prompts</button>
</div>

<label class="pr-label">Who's it for?</label>
<div class="pr-audience-row" id="pr-audience">
  <button class="pr-chip active" data-aud="kids">Kids</button>
  <button class="pr-chip" data-aud="teens">Teens</button>
  <button class="pr-chip" data-aud="adults">Adults</button>
  <button class="pr-chip" data-aud="family">All ages</button>
</div>

<div class="pr-row" style="margin-top:14px;">
  <div>
    <label class="pr-label">Items</label>
    <select id="pr-count">
      <option value="6">6 items</option>
      <option value="8" selected>8 items</option>
      <option value="10">10 items</option>
      <option value="12">12 items</option>
    </select>
  </div>
  <div>
    <label class="pr-label">Image style</label>
    <select id="pr-style">
      <option value="realistic" selected>Photorealistic</option>
      <option value="illustration">Warm illustration</option>
      <option value="watercolor">Watercolor</option>
    </select>
  </div>
</div>

<button class="pr-generate" id="pr-go">✨ Generate handout with AI images</button>
</div>

<div id="pr-error-slot"></div>
<div id="pr-result-slot"></div>
</div>

<script>
(function () {
  const themeInput = document.getElementById('pr-theme');
  const typeButtons = document.querySelectorAll('#pr-types .pr-chip');
  const audButtons = document.querySelectorAll('#pr-audience .pr-chip');
  const goBtn = document.getElementById('pr-go');
  const errorSlot = document.getElementById('pr-error-slot');
  const resultSlot = document.getElementById('pr-result-slot');
  const countSelect = document.getElementById('pr-count');
  const styleSelect = document.getElementById('pr-style');

  let selectedType = 'scavenger hunt';
  let selectedAud = 'kids';

  typeButtons.forEach(btn => btn.addEventListener('click', () => {
    typeButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
  }));
  audButtons.forEach(btn => btn.addEventListener('click', () => {
    audButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedAud = btn.dataset.aud;
  }));

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, s => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[s]));
  }

  function buildImageUrl(prompt, opts = {}) {
    const { width = 1024, height = 576, model = 'flux', seed = Math.floor(Math.random() * 1e6) } = opts;
    const encoded = encodeURIComponent(String(prompt).trim().slice(0, 280));
    return `https://image.pollinations.ai/prompt/${encoded}?width=${width}&height=${height}&model=${model}&seed=${seed}&nologo=true&enhance=true`;
  }

  function cleanJson(text) {
    let cleaned = String(text).trim();
    cleaned = cleaned.replace(/^`json\s*/i, '').replace(/^`\s*/i, '').replace(/\s*```$/i, '');
    const start = cleaned.indexOf('{');
    const end = cleaned.lastIndexOf('}');
    if (start !== -1 && end > start) cleaned = cleaned.slice(start, end + 1);
    return cleaned;
  }

  async function callTextAI(systemPrompt, userPrompt) {
    // Prefer backend if available
    try {
      const r = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          theme: themeInput.value.trim(),
          type: selectedType,
          audience: selectedAud,
          itemCount: countSelect.value,
          style: styleSelect.value,
        }),
      });
      if (r.ok) return await r.json();
    } catch (_) {}

    // Direct Pollinations fallback (works without backend)
    const body = {
      model: 'openai',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt },
      ],
      temperature: 0.85,
      max_tokens: 1400,
    };
    const res = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Text generation failed (' + res.status + ')');
    const data = await res.json();
    const content = data?.choices?.[0]?.message?.content;
    if (!content) throw new Error('Empty AI response');
    const parsed = JSON.parse(cleanJson(content));
    const style = styleSelect.value;
    const visualHint = style === 'watercolor' ? 'soft watercolor painting style' :
      style === 'illustration' ? 'warm digital illustration, storybook' : 'photorealistic, cinematic lighting, high detail';

    const headerImage = buildImageUrl(
      (parsed.header_image_prompt || `${visualHint} of ${themeInput.value}`) + ', no text',
      { width: 1200, height: 480 }
    );
    const items = (parsed.items || []).map((it, i) => ({
      title: it.title || `Item ${i + 1}`,
      body: it.body || '',
      image: it.image_prompt ? buildImageUrl(it.image_prompt + ', ' + visualHint, { width: 256, height: 256 }) : null,
    }));
    return {
      title: parsed.title || themeInput.value,
      tagline: parsed.tagline || '',
      item_style: parsed.item_style || 'checkbox',
      items,
      footer: parsed.footer || 'Have fun & make memories!',
      headerImage,
      type: selectedType,
      audience: selectedAud,
    };
  }

  function renderSheet(data) {
    const style = data.item_style || 'checkbox';
    const itemsHtml = (data.items || []).map((it, i) => {
      let bodyHtml = '';
      if (style === 'checkbox') bodyHtml = `<span class="pr-checkbox"></span>${escapeHtml(it.body || '')}`;
      else if (style === 'fill_blank') bodyHtml = `${escapeHtml(it.body || '')} <span class="pr-item-blank">&nbsp;</span>`;
      else bodyHtml = escapeHtml(it.body || '');

      const imgHtml = it.image
        ? `<img class="pr-item-img" src="${escapeHtml(it.image)}" alt="" loading="lazy" crossorigin="anonymous" />`
        : '';

      return `<div class="pr-item">${imgHtml}<div>
        <span class="pr-item-num">${i + 1}</span>
        <span class="pr-item-title">${escapeHtml(it.title || '')}</span>
        <div class="pr-item-body">${bodyHtml}</div>
      </div></div>`;
    }).join('');

    const heroImg = data.headerImage
      ? `<img src="${escapeHtml(data.headerImage)}" alt="${escapeHtml(data.title)}" crossorigin="anonymous" />`
      : '';

    resultSlot.innerHTML = `
      <div class="pr-sheet" id="pr-sheet">
        <div class="pr-sheet-hero">${heroImg}
          <div class="pr-sheet-band">
            <div class="pr-tag">${escapeHtml(data.type || selectedType)}</div>
            <h2>${escapeHtml(data.title || '')}</h2>
            <div class="pr-tagline">${escapeHtml(data.tagline || '')}</div>
          </div>
        </div>
        <div class="pr-sheet-body">${itemsHtml}</div>
        <div class="pr-footer-note">${escapeHtml(data.footer || 'Have fun!')}</div>
      </div>
      <div class="pr-actions">
        <button id="pr-print">🖨️ Print</button>
        <button id="pr-pdf">📄 Download PDF</button>
        <button class="pr-primary" id="pr-again">✨ Make another</button>
      </div>`;

    document.getElementById('pr-print').onclick = () => window.print();
    document.getElementById('pr-again').onclick = () => {
      resultSlot.innerHTML = ''; errorSlot.innerHTML = '';
      document.getElementById('pr-form').style.display = 'block';
      themeInput.focus();
    };
    document.getElementById('pr-pdf').onclick = () => {
      const el = document.getElementById('pr-sheet');
      if (!el || typeof html2pdf === 'undefined') return window.print();
      html2pdf().set({
        margin: 0.35,
        filename: (data.title || 'themesheet').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.pdf',
        image: { type: 'jpeg', quality: 0.92 },
        html2canvas: { scale: 2, useCORS: true, allowTaint: true },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      }).from(el).save();
    };
  }

  async function generate() {
    const theme = themeInput.value.trim();
    errorSlot.innerHTML = '';
    if (!theme) {
      errorSlot.innerHTML = `<div class="pr-error">Type a theme first — try "pirate treasure hunt", "cozy autumn evening", or "dinosaur museum day".</div>`;
      return;
    }

    goBtn.disabled = true;
    goBtn.textContent = 'Generating…';
    resultSlot.innerHTML = `<div class="pr-loading"><div class="pr-spin"></div>
      Creating your ${escapeHtml(selectedType)}…
      <div class="pr-loading-hint">Writing content + generating realistic AI images (Flux via Pollinations)</div></div>`;

    const count = countSelect.value;
    const style = styleSelect.value;
    const visualHint = style === 'watercolor' ? 'soft watercolor' : style === 'illustration' ? 'warm illustration' : 'photorealistic cinematic';

    const systemPrompt = `You create world-class printable party/activity handouts. Respond with ONLY valid JSON, no markdown fences, no preamble.

Schema:
{
  "title": "short punchy handout title (max 7 words)",
  "tagline": "one playful, inviting sentence under the title",
  "item_style": "checkbox" | "fill_blank" | "plain",
  "items": [ { "title": "short label (3-6 words)", "body": "1-2 sentence instruction, question, fact, or list entry", "image_prompt": "detailed visual description for a small illustration of the item" } ],
  "footer": "one short closing line",
  "header_image_prompt": "detailed prompt for a beautiful wide header banner of the theme, no text"
}

Rules:
- Exactly ${count} items.
- item_style: "checkbox" for scavenger hunts/checklists/bingo; "fill_blank" for trivia; "plain" for facts/story starters/discussion.
- Match tone & vocabulary to audience "${selectedAud}".
- Fully original, wholesome, no copyrighted characters/brands/lyrics/public figures.
- Concise for one printed page.
- image prompts: ${visualHint}, joyful, clear subjects.`;

    const userPrompt = `Theme: "${theme}"\nHandout type: ${selectedType}\nAudience: ${selectedAud}\nItems: ${count}`;

    try {
      const data = await callTextAI(systemPrompt, userPrompt);
      renderSheet(data);
      document.getElementById('pr-form').style.display = 'none';
    } catch (err) {
      console.error(err);
      resultSlot.innerHTML = '';
      errorSlot.innerHTML = `<div class="pr-error">Something went wrong: ${escapeHtml(err.message)}. Try again or rephrase the theme.</div>`;
    } finally {
      goBtn.disabled = false;
      goBtn.textContent = '✨ Generate handout with AI images';
    }
  }

  goBtn.addEventListener('click', generate);
  themeInput.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
})();
</script>
</body>
</html>
