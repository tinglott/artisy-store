<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 T Lott Music Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-size: 1em;
            opacity: 0.8;
        }

        .back-link:hover {
            opacity: 1;
        }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .album-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .album-card:hover {
            transform: translateY(-5px);
        }

        .album-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            color: white;
            text-align: center;
        }

        .album-cover {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .album-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .album-count {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .album-content {
            padding: 20px;
        }

        .tracklist {
            margin-bottom: 20px;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:hover {
            background: #e8e8e8;
        }

        .track-number {
            font-weight: bold;
            color: #667eea;
            margin-right: 10px;
            min-width: 20px;
        }

        .track-name {
            flex: 1;
            font-size: 0.95em;
            color: #333;
        }

        .play-btn {
            width: 30px;
            height: 30px;
            background: #667eea;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: #764ba2;
        }

        .player-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .player-section.active {
            display: block;
        }

        .currently-playing {
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }

        .currently-playing strong {
            color: #667eea;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: transform 0.2s;
        }

        .buy-btn:hover {
            transform: scale(1.02);
        }

        .close-player {
            text-align: center;
            margin-top: 15px;
        }

        .close-btn {
            padding: 8px 15px;
            background: #ddd;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }
            .albums-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/store.html" class="back-link">← Back to Store</a>
        
        <header>
            <h1>🎵 Your Music</h1>
            <p>Sample songs before you buy • Premium instrumental compositions</p>
        </header>

        <div class="player-section active" id="playerSection">
            <div class="currently-playing">
                Now Playing: <strong id="currentTrack">Select a song to listen</strong>
            </div>
            <audio id="audioPlayer" controls style="width: 100%;"></audio>
            <div class="close-player">
                <button class="close-btn" onclick="closePlayer()">Close Player</button>
            </div>
        </div>

        <div class="albums-grid" id="albumsGrid">
            <!-- Albums will load here -->
        </div>

        <div class="footer">
            <p>🎶 All music © T Lott • Premium instrumental compositions</p>
        </div>
    </div>

    <script>
        // Your songs data
        const albums = [

                ]
            },
            {

                tracks: [

                ]
            },

            {

            {

                tracks: [
                    { name: 'Contemporary Flow', fileId: '1P4iK8qT6bYfE7kA2lgU4gXm6cN9jXoD' },
                    { name: 'Urban Pulse', fileId: '1Q3jL9rU7cZgF8lB3mhV5hYn7dO0kYpE' },
                    { name: 'Future Sounds', fileId: '1R2kM0sV8daH9mC4niW6iZo8eP1lZqF' }
                ]
            }
        ];

        // Render albums
        function renderAlbums() {
            const grid = document.getElementById('albumsGrid');
            grid.innerHTML = albums.map((album, idx) => `
                <div class="album-card">
                    <div class="album-header">
                        <div class="album-cover">${album.cover}</div>
                        <div class="album-title">${album.title}</div>
                        <div class="album-count">${album.tracks.length} tracks • $${album.price}</div>
                    </div>
                    <div class="album-content">
                        <div class="tracklist">
                            ${album.tracks.map((track, tIdx) => `
                                <div class="track-item" onclick="playTrack('${album.id}', ${tIdx})">
                                    <span class="track-number">${tIdx + 1}</span>
                                    <span class="track-name">${track.name}</span>
                                    <button class="play-btn">▶</button>
                                </div>
                            `).join('')}
                        </div>
                        <a href="${album.gumroadUrl}" target="_blank" class="buy-btn">🛒 Buy Album - $${album.price}</a>
                    </div>
                </div>
            `).join('');
        }

        // Play track
        function playTrack(albumId, trackIndex) {
            const album = albums.find(a => a.id === albumId);
            const track = album.tracks[trackIndex];
            
            // Create Google Drive direct download URL
            const audioUrl = `https://drive.google.com/uc?export=download&id=${track.fileId}`;
            
            document.getElementById('audioPlayer').src = audioUrl;
            document.getElementById('currentTrack').textContent = `${track.name} (${album.title})`;
            document.getElementById('playerSection').classList.add('active');
            document.getElementById('audioPlayer').play();
        }

        // Close player
        function closePlayer() {
            document.getElementById('audioPlayer').pause();
            document.getElementById('playerSection').classList.remove('active');
        }

        // Initialize
        renderAlbums();
    </script>
</body>
</html>
