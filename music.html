<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Lott Music Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2em;
            color: #aaa;
        }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .album-card:hover {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            transform: translateY(-5px);
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #2c1a4d, #d4af37);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
            overflow: hidden;
        }

        .album-info {
            padding: 20px;
        }

        .album-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .album-description {
            font-size: 0.9em;
            color: #bbb;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .album-songs {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
        }

        .album-price {
            font-size: 1.3em;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .buy-btn {
            flex: 1;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .listen-btn {
            flex: 1;
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .listen-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
        }

        .song-list {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: none;
        }

        .song-list.active {
            display: block;
        }

        .song-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-item:last-child {
            border-bottom: none;
        }

        .song-name {
            font-size: 1em;
        }

        .song-number {
            color: #d4af37;
            font-weight: bold;
            margin-right: 15px;
        }

        .back-btn {
            display: none;
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .back-btn.active {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .albums-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="goBackToAlbums()">← Back to Albums</button>

        <div class="header" id="headerSection">
            <h1>🎵 T Lott Music</h1>
            <p>Professional Instrumental & Orchestral Compositions</p>
        </div>

        <!-- Albums Grid -->
        <div class="albums-grid" id="albumsGrid"></div>

        <!-- Song List -->
        <div class="song-list" id="songList"></div>
    </div>

    <script>
        // Album data
        const albums = [
            {
                id: 'classical_epics_vol1',
                name: 'Classical Epics Vol 1',
                emoji: '🎼',
                price: '$4.99',
                description: 'Modern orchestral masterpieces inspired by the greatest classical composers',
                songs_count: 6,
                gumroad_link: 'https://tlott12.gumroad.com/l/classical-epics-v-1',
                cover_color: '#2c1a4d',
                songs: [
                    'Sugar Plums',
                    'Out of Control',
                    'The Chosen One',
                    'Back to the Green',
                    'Unstoppable',
                    'Lightning in a Bottle'
                ]
            },
            {
                id: 'classical_epics_vol2',
                name: 'Classical Epics Vol 2',
                emoji: '🎭',
                price: '$4.99',
                description: 'Powerful symphonic compositions inspired by classical grandeur',
                songs_count: 6,
                gumroad_link: 'https://tlott12.gumroad.com/l/classical-epics-v-2',
                cover_color: '#1a1a2e',
                songs: [
                    'Orchestral Triumph',
                    'Cathedral of the Mind',
                    'Twenty-Four',
                    'Until the Dawn',
                    'Come Back to Me',
                    'Into the Storm'
                ]
            },
            {
                id: 'serene_sanctuary',
                name: 'Serene Sanctuary',
                emoji: '🧘',
                price: '$4.99',
                description: 'Peaceful instrumental music for meditation, relaxation & healing',
                songs_count: 6,
                gumroad_link: 'https://tlott12.gumroad.com/l/serene-sanctuary',
                cover_color: '#0f4c5c',
                songs: [
                    'Celestial Echoes',
                    'Velvet Counterpoint',
                    'Brouillard Bleu',
                    'Still Water Room',
                    'Open the Gates',
                    'Unbroken Beauty Angel'
                ]
            },
            {
                id: 'spiritual_uplift',
                name: 'Spiritual Uplift',
                emoji: '✨',
                price: '$4.99',
                description: 'Inspirational melodies for your soul journey',
                songs_count: 3,
                gumroad_link: 'https://tlott12.gumroad.com/l/spiritual-uplift',
                cover_color: '#6b4c9a',
                songs: [
                    'Higher Love',
                    'Glass Tide',
                    'Not A Place For Angels'
                ]
            },
            {
                id: 'modern_vibes',
                name: 'Modern Vibes',
                emoji: '🎵',
                price: '$4.99',
                description: 'Contemporary instrumental & vocal tracks',
                songs_count: 3,
                gumroad_link: 'https://tlott12.gumroad.com/l/modern-vibes',
                cover_color: '#1a1a1a',
                songs: [
                    'The Neon in My Head',
                    'Mad About You',
                    'Zoom Zoom Zoom'
                ]
            }
        ];

        let currentAlbum = null;

        // Render albums grid
        function renderAlbums() {
            const grid = document.getElementById('albumsGrid');
            grid.innerHTML = albums.map(album => `
                <div class="album-card">
                    <div class="album-cover" style="background: linear-gradient(135deg, ${album.cover_color}, #d4af37);">
                        ${album.emoji}
                    </div>
                    <div class="album-info">
                        <div class="album-name">${album.name}</div>
                        <div class="album-description">${album.description}</div>
                        <div class="album-songs">${album.songs_count} Tracks</div>
                        <div class="album-price">${album.price}</div>
                        <div class="button-group">
                            <a href="${album.gumroad_link}" target="_blank" style="text-decoration: none; flex: 1;">
                                <button class="buy-btn">🛒 Buy</button>
                            </a>
                            <button class="listen-btn" onclick="viewSongs('${album.id}')">📋 See Tracks</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // View songs in album
        function viewSongs(albumId) {
            currentAlbum = albums.find(a => a.id === albumId);
            
            if (!currentAlbum) return;

            // Hide albums, show song list
            document.getElementById('albumsGrid').style.display = 'none';
            document.getElementById('headerSection').style.display = 'none';
            document.querySelector('.back-btn').classList.add('active');

            // Render song list
            const songListDiv = document.getElementById('songList');
            songListDiv.innerHTML = `
                <h2 style="margin-bottom: 20px;">${currentAlbum.emoji} ${currentAlbum.name}</h2>
                <div style="margin-bottom: 20px; font-size: 0.9em; color: #bbb;">
                    ${currentAlbum.songs_count} tracks • $4.99 on Gumroad
                </div>
                ${currentAlbum.songs.map((song, index) => `
                    <div class="song-item">
                        <span><span class="song-number">${index + 1}.</span><span class="song-name">${song}</span></span>
                        <span style="color: #888;">🎵</span>
                    </div>
                `).join('')}
                <div style="margin-top: 30px; text-align: center;">
                    <a href="${currentAlbum.gumroad_link}" target="_blank" style="text-decoration: none;">
                        <button class="buy-btn" style="width: 100%; max-width: 300px;">🛒 Buy Album - ${currentAlbum.price}</button>
                    </a>
                </div>
            `;
            songListDiv.classList.add('active');

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Go back to albums
        function goBackToAlbums() {
            currentAlbum = null;
            document.getElementById('albumsGrid').style.display = 'grid';
            document.getElementById('headerSection').style.display = 'block';
            document.getElementById('songList').classList.remove('active');
            document.querySelector('.back-btn').classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize
        renderAlbums();
    </script>
</body>
</html>
