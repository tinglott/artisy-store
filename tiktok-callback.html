<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Connection | ARTISY</title>
<meta name="robots" content="noindex">
<style>
body{font-family:Georgia,serif;max-width:720px;margin:0 auto;padding:40px 20px;line-height:1.6;color:#22302c;background:#fdfcf9}
code{display:block;background:#eef4f1;border:1px solid #cfe0d8;border-radius:8px;padding:14px;word-break:break-all;font-size:.95rem}
.err{color:#9c2b2b}
</style>
</head>
<body>
<h1>TikTok connection</h1>
<div id="out"><p>Waiting for TikTok…</p></div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var err = p.get('error');
  if (err) {
    out.innerHTML = '<p class="err">TikTok returned an error: ' + err + (p.get('error_description') ? ' — ' + p.get('error_description') : '') + '</p><p>Please tell Ziggy what it says above.</p>';
    return;
  }
  var code = p.get('code');
  if (code) {
    out.innerHTML = '<p>Connected. Your one-time authorization code is:</p><code>' + code + '</code><p>Give this code to Ziggy right away — it expires within minutes and can be used only once.</p>';
  } else {
    out.innerHTML = '<p>No authorization code arrived. Please tell Ziggy.</p>';
  }
})();
</script>
</body>
</html>
