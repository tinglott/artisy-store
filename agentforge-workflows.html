<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentForge Workflows v2 - Franchise Automation Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            height: 100vh;
            gap: 0;
        }

        /* Sidebar */
        .sidebar {
            background: #1a1a2e;
            border-right: 2px solid #d4af37;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
            text-align: center;
        }

        .sidebar h3 {
            color: #d4af37;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .agent-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .agent-btn {
            background: #2a2a3e;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: all 0.3s;
        }

        .agent-btn:hover {
            background: #d4af37;
            color: #0f0f0f;
            border-color: #d4af37;
        }

        .agent-btn.active {
            background: #d4af37;
            color: #0f0f0f;
        }

        /* Main Canvas */
        .canvas-area {
            background: #0f0f0f;
            position: relative;
            overflow: auto;
        }

        .canvas {
            position: relative;
            width: 2000px;
            height: 1500px;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 49px, #333 49px, #333 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, #333 49px, #333 50px);
        }

        .canvas-toolbar {
            background: #1a1a2e;
            border-bottom: 2px solid #d4af37;
            padding: 12px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .canvas-toolbar button {
            background: #2a2a3e;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .canvas-toolbar button:hover {
            background: #d4af37;
            color: #0f0f0f;
        }

        .agent-node {
            position: absolute;
            background: #2a2a3e;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            width: 160px;
            cursor: move;
            user-select: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: all 0.3s;
        }

        .agent-node:hover {
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
        }

        .agent-node.selected {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .node-title {
            font-size: 12px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            text-align: center;
        }

        .node-ports {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .port {
            width: 12px;
            height: 12px;
            background: #d4af37;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .port:hover {
            transform: scale(1.5);
        }

        .port.input {
            margin-right: auto;
        }

        .port.output {
            margin-left: auto;
        }

        /* Right Panel */
        .properties {
            background: #1a1a2e;
            border-left: 2px solid #d4af37;
            padding: 20px;
            overflow-y: auto;
            max-width: 300px;
        }

        .properties h3 {
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .property-group {
            margin-bottom: 20px;
        }

        .property-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .property-value {
            background: #0f0f0f;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            width: 100%;
        }

        .property-value:focus {
            outline: none;
            border-color: #d4af37;
        }

        .workflow-templates {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 15px;
        }

        .template-btn {
            display: block;
            width: 100%;
            background: #2a2a3e;
            border: 1px solid #d4af37;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }

        .template-btn:hover {
            background: #d4af37;
            color: #0f0f0f;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            color: #e0e0e0;
        }

        .modal-content h2 {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0f0f0f;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            background: #2a2a3e;
            border: 1px solid #d4af37;
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .modal-buttons button:hover {
            background: #d4af37;
            color: #0f0f0f;
        }

        .modal-buttons button.cancel {
            border-color: #666;
            color: #999;
        }

        .modal-buttons button.cancel:hover {
            background: #666;
            color: #e0e0e0;
        }

        .execution-log {
            background: #0f0f0f;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .execution-log .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
        }

        .execution-log .error {
            color: #ff4444;
        }

        .execution-log .success {
            color: #44ff44;
        }

        .execution-log .info {
            color: #88ccff;
        }

        svg.connection-line {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .agent-description {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
            line-height: 1.3;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar,
            .properties {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar: Agents -->
        <div class="sidebar">
            <div class="logo">🤖 AgentForge v2</div>
            
            <div>
                <h3>Core Operations (6)</h3>
                <div class="agent-list">
                    <button class="agent-btn" data-agent="content-creator">📝 Content Creator</button>
                    <button class="agent-btn" data-agent="data-analyzer">📊 Data Analyzer</button>
                    <button class="agent-btn" data-agent="email-sender">📧 Email Sender</button>
                    <button class="agent-btn" data-agent="social-poster">📱 Social Poster</button>
                    <button class="agent-btn" data-agent="lead-nurture">🎯 Lead Nurture</button>
                    <button class="agent-btn" data-agent="product-builder">🏗️ Product Builder</button>
                </div>
            </div>

            <div>
                <h3>Finance & Analytics (3)</h3>
                <div class="agent-list">
                    <button class="agent-btn" data-agent="financial-analytics">💰 Financial Analytics</button>
                    <button class="agent-btn" data-agent="performance-dashboard">📈 Performance Dashboard</button>
                    <button class="agent-btn" data-agent="reporting">📋 Reporting</button>
                </div>
            </div>

            <div>
                <h3>Operations (3)</h3>
                <div class="agent-list">
                    <button class="agent-btn" data-agent="inventory-manager">📦 Inventory Manager</button>
                    <button class="agent-btn" data-agent="vendor-management">🤝 Vendor Management</button>
                    <button class="agent-btn" data-agent="multi-location">🌐 Multi-Location Coord.</button>
                </div>
            </div>

            <div>
                <h3>Support & Growth (3)</h3>
                <div class="agent-list">
                    <button class="agent-btn" data-agent="customer-feedback">⭐ Customer Feedback</button>
                    <button class="agent-btn" data-agent="compliance-legal">⚖️ Compliance & Legal</button>
                    <button class="agent-btn" data-agent="training-onboarding">🎓 Training & Onboarding</button>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-area">
            <div class="canvas-toolbar">
                <button onclick="addAgentToCanvas('content-creator')">Add Content Creator</button>
                <button onclick="addAgentToCanvas('lead-nurture')">Add Lead Nurture</button>
                <button onclick="addAgentToCanvas('financial-analytics')">Add Financial Analytics</button>
                <button onclick="clearCanvas()">Clear Canvas</button>
                <button onclick="loadTemplate('lead-gen')">📋 Lead Gen Workflow</button>
                <button onclick="loadTemplate('franchise-ops')">🏢 Franchise Ops</button>
                <button onclick="executeWorkflow()">▶️ Execute Workflow</button>
            </div>
            <div class="canvas" id="canvas"></div>
            <svg class="connection-line" id="connectionSvg"></svg>
        </div>

        <!-- Right Panel: Properties -->
        <div class="properties">
            <h3>Workflow Properties</h3>
            
            <div class="property-group">
                <label class="property-label">Workflow Name</label>
                <input type="text" class="property-value" id="workflowName" placeholder="e.g., Daily Lead Generation">
            </div>

            <div class="property-group">
                <label class="property-label">Trigger Type</label>
                <select class="property-value" id="triggerType">
                    <option>Manual</option>
                    <option>Webhook</option>
                    <option>Schedule (6 hours)</option>
                    <option>Schedule (Daily)</option>
                    <option>Schedule (Weekly)</option>
                </select>
            </div>

            <div class="property-group">
                <label class="property-label">API Keys Required</label>
                <div style="font-size: 11px; color: #999; background: #0f0f0f; padding: 8px; border-radius: 4px; margin-top: 5px;">
                    ✅ Grok API Key<br>
                    ✅ Supabase Project URL<br>
                    ✅ Supabase API Key
                </div>
            </div>

            <div class="property-group">
                <label class="property-label">Settings</label>
                <button class="property-value" style="background: #2a2a3e; cursor: pointer;" onclick="showSettings()">⚙️ Configure API Keys</button>
            </div>

            <div class="execution-log" id="executionLog"></div>

            <div class="workflow-templates">
                <h3>Franchise Templates</h3>
                <button class="template-btn" onclick="loadTemplate('daily-standup')">📅 Daily Operations Standup</button>
                <button class="template-btn" onclick="loadTemplate('lead-follow-up')">🔄 Lead Follow-up Sequence</button>
                <button class="template-btn" onclick="loadTemplate('customer-retention')">❤️ Customer Retention Flow</button>
                <button class="template-btn" onclick="loadTemplate('revenue-reporting')">💹 Revenue & Reporting</button>
                <button class="template-btn" onclick="loadTemplate('inventory-alert')">⚠️ Inventory Alert System</button>
                <button class="template-btn" onclick="loadTemplate('compliance-audit')">🔍 Compliance Audit Trail</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>⚙️ Configure API Keys</h2>
            <div class="form-group">
                <label>Grok API Key</label>
                <input type="password" id="grokKey" placeholder="xai-...">
            </div>
            <div class="form-group">
                <label>Supabase Project URL</label>
                <input type="text" id="supabaseUrl" placeholder="https://...supabase.co">
            </div>
            <div class="form-group">
                <label>Supabase API Key</label>
                <input type="password" id="supabaseKey" placeholder="eyJ...">
            </div>
            <div class="form-group">
                <label>Emailit API Key (optional)</label>
                <input type="password" id="emailitKey" placeholder="email_...">
            </div>
            <div class="modal-buttons">
                <button class="cancel" onclick="closeSettings()">Cancel</button>
                <button onclick="saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // Agent Definitions
        const agents = {
            'content-creator': {
                name: 'Content Creator',
                icon: '📝',
                color: '#ff6b6b',
                description: 'Generates blog posts, social media content, email campaigns',
                skills: ['Writing', 'SEO', 'Brand Voice', 'Copywriting']
            },
            'data-analyzer': {
                name: 'Data Analyzer',
                icon: '📊',
                color: '#4ecdc4',
                description: 'Analyzes sales, customer, financial data for insights',
                skills: ['Analytics', 'Reporting', 'Trend Analysis', 'Forecasting']
            },
            'email-sender': {
                name: 'Email Sender',
                icon: '📧',
                color: '#95e1d3',
                description: 'Sends targeted emails, sequences, follow-ups via Emailit',
                skills: ['Email Marketing', 'Segmentation', 'Automation']
            },
            'social-poster': {
                name: 'Social Poster',
                icon: '📱',
                color: '#f38181',
                description: 'Posts to Bluesky, TikTok, Instagram with scheduling',
                skills: ['Social Media', 'Engagement', 'Content Distribution']
            },
            'lead-nurture': {
                name: 'Lead Nurture',
                icon: '🎯',
                color: '#aa96da',
                description: 'Scores leads, creates sequences, triggers follow-ups',
                skills: ['Lead Scoring', 'CRM', 'Conversion Optimization']
            },
            'product-builder': {
                name: 'Product Builder',
                icon: '🏗️',
                color: '#fcbad3',
                description: 'Creates products, updates catalogs, manages inventory info',
                skills: ['Product Design', 'Catalog Management', 'Pricing']
            },
            'financial-analytics': {
                name: 'Financial Analytics',
                icon: '💰',
                color: '#a8d8ea',
                description: 'Forecasts revenue, analyzes expenses, tracks ROI',
                skills: ['Financial Forecasting', 'Budget Analysis', 'KPI Tracking']
            },
            'inventory-manager': {
                name: 'Inventory Manager',
                icon: '📦',
                color: '#aa96da',
                description: 'Monitors stock levels, alerts on low inventory, reorders',
                skills: ['Stock Management', 'Supply Chain', 'Vendor Coordination']
            },
            'customer-feedback': {
                name: 'Customer Feedback',
                icon: '⭐',
                color: '#ffd93d',
                description: 'Collects reviews, sentiment analysis, improvement suggestions',
                skills: ['Feedback Collection', 'Sentiment Analysis', 'Quality Assurance']
            },
            'compliance-legal': {
                name: 'Compliance & Legal',
                icon: '⚖️',
                color: '#ff9a9e',
                description: 'Tracks compliance, audit logs, regulatory updates',
                skills: ['Compliance', 'Legal Review', 'Risk Management']
            },
            'performance-dashboard': {
                name: 'Performance Dashboard',
                icon: '📈',
                color: '#6bcf7f',
                description: 'Real-time KPI tracking, franchise health metrics',
                skills: ['Dashboard Design', 'Real-time Monitoring', 'Data Visualization']
            },
            'multi-location': {
                name: 'Multi-Location Coordinator',
                icon: '🌐',
                color: '#4d96ff',
                description: 'Syncs operations across multiple franchise locations',
                skills: ['Multi-location Management', 'Centralized Control', 'Reporting']
            },
            'training-onboarding': {
                name: 'Training & Onboarding',
                icon: '🎓',
                color: '#90ee90',
                description: 'New franchisee training, certifications, SOPs',
                skills: ['Training Programs', 'Certification', 'SOP Management']
            },
            'vendor-management': {
                name: 'Vendor Management',
                icon: '🤝',
                color: '#dda15e',
                description: 'Supplier relationships, contracts, quality assurance',
                skills: ['Vendor Relations', 'Contract Negotiation', 'QA']
            },
            'reporting': {
                name: 'Reporting',
                icon: '📋',
                color: '#bc6c25',
                description: 'Generates compliance, franchise, and performance reports',
                skills: ['Report Generation', 'Data Compilation', 'Documentation']
            }
        };

        let canvasNodes = [];
        let selectedNode = null;
        let settings = {
            grokKey: localStorage.getItem('agentforge_grok_key') || '',
            supabaseUrl: localStorage.getItem('agentforge_supabase_url') || '',
            supabaseKey: localStorage.getItem('agentforge_supabase_key') || ''
        };

        // Add agent to canvas
        function addAgentToCanvas(agentId) {
            const agent = agents[agentId];
            if (!agent) return;

            const node = {
                id: `node_${Date.now()}`,
                agentId: agentId,
                x: Math.random() * 800 + 100,
                y: Math.random() * 800 + 100,
                inputs: [],
                outputs: []
            };

            canvasNodes.push(node);
            renderCanvas();
        }

        // Render canvas
        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';

            canvasNodes.forEach(node => {
                const agent = agents[node.agentId];
                const nodeEl = document.createElement('div');
                nodeEl.className = 'agent-node';
                nodeEl.style.left = node.x + 'px';
                nodeEl.style.top = node.y + 'px';
                nodeEl.innerHTML = `
                    <div class="node-title">${agent.icon} ${agent.name}</div>
                    <div class="agent-description">${agent.description}</div>
                    <div class="node-ports">
                        <div class="port input"></div>
                        <div class="port output"></div>
                    </div>
                `;
                
                nodeEl.addEventListener('click', () => selectNode(node));
                nodeEl.addEventListener('mousedown', (e) => dragNode(e, node));
                canvas.appendChild(nodeEl);
            });
        }

        function selectNode(node) {
            selectedNode = node;
            document.querySelectorAll('.agent-node').forEach(el => el.classList.remove('selected'));
            const selectedEl = document.querySelectorAll('.agent-node')[canvasNodes.indexOf(node)];
            if (selectedEl) selectedEl.classList.add('selected');
        }

        function dragNode(e, node) {
            e.preventDefault();
            const startX = e.clientX;
            const startY = e.clientY;
            const startNodeX = node.x;
            const startNodeY = node.y;

            const moveFn = (movE) => {
                node.x = startNodeX + (movE.clientX - startX);
                node.y = startNodeY + (movE.clientY - startY);
                renderCanvas();
            };

            const upFn = () => {
                document.removeEventListener('mousemove', moveFn);
                document.removeEventListener('mouseup', upFn);
            };

            document.addEventListener('mousemove', moveFn);
            document.addEventListener('mouseup', upFn);
        }

        function clearCanvas() {
            if (confirm('Clear all nodes from canvas?')) {
                canvasNodes = [];
                selectedNode = null;
                renderCanvas();
            }
        }

        // Workflow Templates
        function loadTemplate(templateId) {
            const templates = {
                'lead-gen': [
                    { agentId: 'lead-nurture', x: 100, y: 100 },
                    { agentId: 'email-sender', x: 300, y: 100 },
                    { agentId: 'data-analyzer', x: 500, y: 100 }
                ],
                'franchise-ops': [
                    { agentId: 'performance-dashboard', x: 100, y: 100 },
                    { agentId: 'inventory-manager', x: 300, y: 100 },
                    { agentId: 'financial-analytics', x: 500, y: 100 },
                    { agentId: 'reporting', x: 700, y: 100 },
                    { agentId: 'multi-location', x: 900, y: 100 }
                ],
                'daily-standup': [
                    { agentId: 'performance-dashboard', x: 100, y: 100 },
                    { agentId: 'data-analyzer', x: 300, y: 100 },
                    { agentId: 'content-creator', x: 500, y: 100 },
                    { agentId: 'email-sender', x: 700, y: 100 }
                ],
                'lead-follow-up': [
                    { agentId: 'lead-nurture', x: 100, y: 100 },
                    { agentId: 'email-sender', x: 300, y: 100 },
                    { agentId: 'social-poster', x: 500, y: 100 },
                    { agentId: 'data-analyzer', x: 700, y: 100 }
                ],
                'customer-retention': [
                    { agentId: 'customer-feedback', x: 100, y: 100 },
                    { agentId: 'data-analyzer', x: 300, y: 100 },
                    { agentId: 'content-creator', x: 500, y: 100 },
                    { agentId: 'email-sender', x: 700, y: 100 }
                ],
                'revenue-reporting': [
                    { agentId: 'financial-analytics', x: 100, y: 100 },
                    { agentId: 'data-analyzer', x: 300, y: 100 },
                    { agentId: 'reporting', x: 500, y: 100 },
                    { agentId: 'email-sender', x: 700, y: 100 }
                ],
                'inventory-alert': [
                    { agentId: 'inventory-manager', x: 100, y: 100 },
                    { agentId: 'vendor-management', x: 300, y: 100 },
                    { agentId: 'email-sender', x: 500, y: 100 }
                ],
                'compliance-audit': [
                    { agentId: 'compliance-legal', x: 100, y: 100 },
                    { agentId: 'reporting', x: 300, y: 100 },
                    { agentId: 'data-analyzer', x: 500, y: 100 }
                ]
            };

            const template = templates[templateId];
            if (!template) return;

            canvasNodes = template.map((item, idx) => ({
                id: `node_${Date.now()}_${idx}`,
                agentId: item.agentId,
                x: item.x,
                y: item.y,
                inputs: [],
                outputs: []
            }));

            renderCanvas();
            logExecution(`info`, `Loaded "${templateId}" template with ${canvasNodes.length} agents`);
        }

        // Settings Modal
        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('grokKey').value = settings.grokKey;
            document.getElementById('supabaseUrl').value = settings.supabaseUrl;
            document.getElementById('supabaseKey').value = settings.supabaseKey;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            settings.grokKey = document.getElementById('grokKey').value;
            settings.supabaseUrl = document.getElementById('supabaseUrl').value;
            settings.supabaseKey = document.getElementById('supabaseKey').value;

            localStorage.setItem('agentforge_grok_key', settings.grokKey);
            localStorage.setItem('agentforge_supabase_url', settings.supabaseUrl);
            localStorage.setItem('agentforge_supabase_key', settings.supabaseKey);

            logExecution('success', 'Settings saved securely in browser');
            closeSettings();
        }

        // Execute Workflow
        async function executeWorkflow() {
            if (canvasNodes.length === 0) {
                logExecution('error', 'Add agents to canvas first');
                return;
            }

            if (!settings.grokKey || !settings.supabaseUrl) {
                logExecution('error', 'Configure API keys first');
                showSettings();
                return;
            }

            logExecution('info', `Executing workflow with ${canvasNodes.length} agents...`);

            for (let i = 0; i < canvasNodes.length; i++) {
                const node = canvasNodes[i];
                const agent = agents[node.agentId];
                logExecution('info', `Executing ${agent.name}...`);
                
                // Simulate agent execution
                await new Promise(resolve => setTimeout(resolve, 800));
                logExecution('success', `✓ ${agent.name} completed`);
            }

            logExecution('success', 'Workflow execution complete!');
        }

        function logExecution(type, message) {
            const log = document.getElementById('executionLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // Agent Buttons in Sidebar
        document.querySelectorAll('.agent-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const agentId = btn.dataset.agent;
                addAgentToCanvas(agentId);
                logExecution('info', `Added ${agents[agentId].name} to canvas`);
            });
        });

        // Initial render
        renderCanvas();
    </script>
</body>
</html>
