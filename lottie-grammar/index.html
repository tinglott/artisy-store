<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lottie's Grammar World</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
  <!-- HOME SCREEN -->
  <div id="home" class="screen active">
    <div class="header">
      <div id="lottie-owl" class="owl-container"></div>
      <h1>Lottie's Grammar World</h1>
      <p class="subtitle">Your friendly owl coach from ARTISY</p>
    </div>
    <div class="topics-grid" id="topics-grid"></div>
    <div class="footer-stats">
      <span>Score: <strong id="total-score">0</strong></span>
      <span>Streak: <strong id="total-streak">0</strong></span>
    </div>
    <button class="dashboard-btn" onclick="openDashboard()">📊 Parent Dashboard</button>
  </div>

  <!-- LESSON SCREEN -->
  <div id="lesson" class="screen">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="lesson-header">
      <div id="lottie-lesson" class="owl-small"></div>
      <h2 id="lesson-title"></h2>
    </div>
    <div class="rule-card">
      <div class="rule-label">📚 The Rule</div>
      <p id="rule-text"></p>
      <p class="source" id="rule-source"></p>
    </div>
    <div class="coach-says">
      <strong>🦉 Lottie says:</strong>
      <p id="coach-text"></p>
    </div>
    <button class="primary-btn" onclick="startPractice()">Start Practice ▶</button>
  </div>

  <!-- PRACTICE SCREEN -->
  <div id="practice" class="screen">
    <div class="practice-top">
      <button class="back-btn" onclick="goHome()">←</button>
      <div class="round-info">
        Round <span id="round-num">1</span> · Score <span id="practice-score">0</span>
        <span class="fire">🔥 <span id="practice-streak">0</span></span>
      </div>
    </div>
    <div class="question-card">
      <p class="question-label">🦉 Lottie asks:</p>
      <h3 id="question-text"></h3>
    </div>
    
    <!-- Multiple choice buttons -->
    <div id="options-area" class="options-area hidden"></div>
    
    <!-- Text + Voice input -->
    <div id="text-input-area" class="answer-area">
      <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off" />
      <div class="input-buttons">
        <button class="voice-btn" id="voice-btn" onclick="startVoice()">🎤 Speak</button>
        <button class="primary-btn" id="check-btn" onclick="checkAnswer()">Check</button>
      </div>
    </div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="progress-bar">
      <div id="progress-fill"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result" class="screen">
    <div id="lottie-result" class="owl-container"></div>
    <h2 id="result-title">Great job!</h2>
    <p id="result-message"></p>
    <div class="result-stats">
      <div>Score: <strong id="final-score">0</strong></div>
      <div>Streak: <strong id="final-streak">0</strong></div>
    </div>
    <button class="primary-btn" onclick="goHome()">Back to Topics</button>
    <button class="secondary-btn" onclick="restartPractice()">Try Again</button>
  </div>

  <!-- PARENT DASHBOARD -->
  <div id="dashboard" class="screen">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <h2>📊 Parent Dashboard</h2>
    <div class="dash-card">
      <h3>Overall Progress</h3>
      <p>Total Score: <strong id="dash-score">0</strong></p>
      <p>Best Streak: <strong id="dash-streak">0</strong></p>
      <p>Topics Practiced: <strong id="dash-topics">0</strong></p>
    </div>
    <div class="dash-card">
      <h3>Progress by Topic</h3>
      <div id="topic-progress-list"></div>
    </div>
    <button class="secondary-btn" onclick="resetProgress()">Reset Progress</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
