<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Private Free Invoice Variance Detection Tool - PO vs Invoice Comparison">
    <title>Invoice Variance AI — Free Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 1200px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; color: #60a5fa; }
        .header p { font-size: 1.1em; color: #cbd5e1; }
        .access-gate {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto 40px;
            text-align: center;
        }
        .access-gate h2 { margin-bottom: 20px; color: #a78bfa; }
        .access-gate input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1em;
        }
        .access-gate button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .access-gate button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(96, 165, 250, 0.3); }
        .app-container { display: none; }
        .app-container.visible { display: block; }
        .upload-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .upload-zone {
            border: 2px dashed rgba(96, 165, 250, 0.5);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-zone:hover { border-color: #60a5fa; background: rgba(96, 165, 250, 0.05); }
        .upload-zone input { display: none; }
        .results { margin-top: 40px; }
        .variance-item {
            background: rgba(30, 41, 59, 0.6);
            border-left: 4px solid #ef4444;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Invoice Variance AI</h1>
            <p>Detect discrepancies between Purchase Orders and Invoices</p>
        </div>

        <!-- Access Gate -->
        <div class="access-gate" id="accessGate">
            <h2>Private Access</h2>
            <p style="margin-bottom: 20px; color: #94a3b8;">Enter your access code</p>
            <input type="password" id="accessCode" placeholder="Access code" />
            <button onclick="verifyAccess()">Access Tool</button>
        </div>

        <!-- App (Hidden Until Access Verified) -->
        <div class="app-container" id="appContainer">
            <div class="upload-section">
                <h2 style="margin-bottom: 20px;">📎 Upload Files</h2>
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <p style="color: #94a3b8;">Click to upload or drag files</p>
                    <p style="font-size: 0.9em; color: #64748b; margin-top: 10px;">CSV, PDF, JPG, PNG</p>
                    <input type="file" id="fileInput" multiple onchange="handleFiles()" />
                </div>
                <button onclick="analyzeVariances()" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #60a5fa, #a78bfa); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Analyze Variances</button>
            </div>

            <div class="results" id="results"></div>
        </div>
    </div>

    <script>
        // Access codes
        const ACCESS_CODES = {
            'invoice-free-2026': true,
            'ting-unlimited': true,
            'business-access': true
        };

        function verifyAccess() {
            const code = document.getElementById('accessCode').value;
            if (ACCESS_CODES[code]) {
                document.getElementById('accessGate').style.display = 'none';
                document.getElementById('appContainer').classList.add('visible');
            } else {
                alert('Invalid access code');
            }
        }

        function handleFiles() {
            // File handling logic
            alert('Upload received');
        }

        function analyzeVariances() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2 style="margin-bottom: 20px;">Analysis Results</h2><div class="variance-item"><strong>✓ Analysis complete</strong></div>';
        }

        // Allow Enter key on access code
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('accessCode').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') verifyAccess();
            });
        });
    </script>
</body>
</html>
