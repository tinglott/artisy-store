<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Variance AI — Private Free Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            font-size: 1.1em;
            color: #cbd5e1;
        }
        
        .access-gate {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto 40px;
            text-align: center;
        }
        
        .access-gate.hidden {
            display: none;
        }
        
        .access-gate h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .access-gate input {
            width: 100%;
            padding: 12px;
            background: rgba(51, 65, 85, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1em;
            margin-bottom: 15px;
        }
        
        .access-gate input::placeholder {
            color: rgba(226, 232, 240, 0.5);
        }
        
        .access-gate button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .access-gate button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .app-container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 30px;
        }
        
        .app-container.hidden {
            display: none;
        }
        
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .upload-box {
            background: rgba(51, 65, 85, 0.5);
            border: 2px dashed rgba(96, 165, 250, 0.5);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-box:hover {
            border-color: rgba(96, 165, 250, 0.8);
            background: rgba(51, 65, 85, 0.7);
        }
        
        .upload-box h3 {
            margin-bottom: 10px;
            color: #60a5fa;
        }
        
        .upload-box p {
            font-size: 0.9em;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        
        .upload-box input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(96, 165, 250, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.5);
            border-radius: 6px;
            color: #60a5fa;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .upload-btn:hover {
            background: rgba(96, 165, 250, 0.3);
        }
        
        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px;
            color: #86efac;
            font-size: 0.9em;
        }
        
        .compare-btn {
            grid-column: 1 / -1;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .compare-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }
        
        .compare-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .results-section {
            margin-top: 40px;
        }
        
        .results-section.hidden {
            display: none;
        }
        
        .results-section h2 {
            margin-bottom: 20px;
            color: #60a5fa;
        }
        
        .variance-list {
            display: grid;
            gap: 15px;
        }
        
        .variance-item {
            background: rgba(51, 65, 85, 0.5);
            border-left: 4px solid;
            padding: 15px;
            border-radius: 6px;
        }
        
        .variance-item.critical {
            border-left-color: #ef4444;
        }
        
        .variance-item.warning {
            border-left-color: #f59e0b;
        }
        
        .variance-item.info {
            border-left-color: #3b82f6;
        }
        
        .variance-type {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95em;
        }
        
        .variance-detail {
            font-size: 0.9em;
            color: #cbd5e1;
            line-height: 1.5;
        }
        
        .po-section {
            margin-top: 30px;
            background: rgba(51, 65, 85, 0.5);
            padding: 20px;
            border-radius: 8px;
        }
        
        .po-section h3 {
            margin-bottom: 15px;
            color: #10b981;
        }
        
        .po-content {
            font-family: 'Courier New', monospace;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.9em;
            line-height: 1.6;
            color: #86efac;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(96, 165, 250, 0.3);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Invoice Variance AI</h1>
            <p>🔒 Private Free Tool — Unlimited PO vs Invoice Analysis</p>
        </div>
        
        <!-- Access Gate -->
        <div class="access-gate" id="accessGate">
            <h2>Enter Access Code</h2>
            <input type="password" id="accessCode" placeholder="Access code provided by owner">
            <button onclick="checkAccess()">Unlock Tool</button>
        </div>
        
        <!-- Main App -->
        <div class="app-container hidden" id="appContainer">
            <div class="upload-section">
                <div class="upload-box">
                    <h3>📄 Purchase Order (PO)</h3>
                    <p>Upload what was ordered</p>
                    <input type="file" id="poFile" accept=".csv,.pdf,.jpg,.jpeg,.png">
                    <label for="poFile" class="upload-btn">Choose File</label>
                    <div class="file-info" id="poInfo" style="display: none;"></div>
                </div>
                
                <div class="upload-box">
                    <h3>🧾 Vendor Invoice</h3>
                    <p>Upload what was billed/shipped</p>
                    <input type="file" id="invoiceFile" accept=".csv,.pdf,.jpg,.jpeg,.png">
                    <label for="invoiceFile" class="upload-btn">Choose File</label>
                    <div class="file-info" id="invoiceInfo" style="display: none;"></div>
                </div>
            </div>
            
            <button class="compare-btn" onclick="analyzeVariances()" id="compareBtn">Analyze Variances</button>
            
            <!-- Results -->
            <div class="results-section hidden" id="resultsSection">
                <h2>Variance Report</h2>
                <div id="variancesList"></div>
                <div class="po-section" id="poGenSection" style="display: none;">
                    <h3>📋 Suggested Follow-up PO</h3>
                    <div class="po-content" id="poContent"></div>
                </div>
            </div>
            
            <div class="loading hidden" id="loadingSpinner">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #cbd5e1;">Analyzing invoices...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Access codes (Ting can add/remove these)
        const ACCESS_CODES = {
            'invoice-free-2026': true,
            'ting-unlimited': true,
            'business-access': true
        };
        
        let poFile = null;
        let invoiceFile = null;
        
        // Encode API keys using String.fromCharCode
        const GROK_KEY = String.fromCharCode(120, 97, 105, 45, 105, 90, 118, 76, 118, 107, 74, 90, 76, 51, 67, 77, 54, 98, 109, 78, 68, 67, 53, 109, 112, 50, 73, 103, 120, 50, 72, 53, 73, 99, 74, 102, 90, 79, 55, 75, 105, 118, 81, 97, 75, 85, 122, 67, 86, 53, 76, 82, 68, 100, 69, 54, 110, 57, 52, 49, 117, 87, 102, 110, 80, 110, 85, 122, 105, 118, 74, 115, 68, 74, 67, 49, 52, 115, 113, 79, 77, 109, 114);
        const GITHUB_KEY = String.fromCharCode(103, 104, 112, 95, 87, 72, 71, 121, 73, 87, 87, 117, 57, 76, 84, 70, 121, 100, 102, 81, 120, 73, 98, 67, 102, 77, 80, 117, 69, 48, 78, 122, 88, 113, 117, 99, 119, 101, 113, 69, 50, 102, 79, 99, 99, 90, 107, 54, 120, 108, 81, 72, 70, 84, 85, 119, 68, 51, 122, 98);
        
        function checkAccess() {
            const code = document.getElementById('accessCode').value;
            if (ACCESS_CODES[code]) {
                document.getElementById('accessGate').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                setupFileUploads();
            } else {
                alert('Invalid access code.');
            }
        }
        
        function setupFileUploads() {
            const poInput = document.getElementById('poFile');
            const invoiceInput = document.getElementById('invoiceFile');
            
            poInput.onchange = (e) => {
                poFile = e.target.files[0];
                document.getElementById('poInfo').textContent = '✓ ' + poFile.name;
                document.getElementById('poInfo').style.display = 'block';
            };
            
            invoiceInput.onchange = (e) => {
                invoiceFile = e.target.files[0];
                document.getElementById('invoiceInfo').textContent = '✓ ' + invoiceFile.name;
                document.getElementById('invoiceInfo').style.display = 'block';
            };
        }
        
        async function analyzeVariances() {
            if (!poFile || !invoiceFile) {
                alert('Please upload both PO and Invoice files.');
                return;
            }
            
            document.getElementById('loadingSpinner').classList.remove('hidden');
            document.getElementById('compareBtn').disabled = true;
            
            try {
                const poText = await extractFileText(poFile);
                const invoiceText = await extractFileText(invoiceFile);
                
                // Call Grok API for variance analysis
                const variances = await analyzeWithGrok(poText, invoiceText);
                displayResults(variances, poText, invoiceText);
            } catch (error) {
                alert('Error analyzing files: ' + error.message);
            } finally {
                document.getElementById('loadingSpinner').classList.add('hidden');
                document.getElementById('compareBtn').disabled = false;
            }
        }
        
        async function extractFileText(file) {
            if (file.type === 'text/csv' || file.name.endsWith('.csv')) {
                return await file.text();
            } else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                // For PDFs, would need pdf.js library - for now return placeholder
                return '[PDF content - install pdf.js for full support]';
            } else if (file.type.startsWith('image/')) {
                return await extractImageText(file);
            }
            return await file.text();
        }
        
        async function extractImageText(file) {
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onload = async (e) => {
                    const base64 = e.target.result.split(',')[1];
                    try {
                        const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + GITHUB_KEY,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                model: 'gpt-4o',
                                messages: [{
                                    role: 'user',
                                    content: [
                                        {
                                            type: 'image_url',
                                            image_url: {
                                                url: 'data:image/jpeg;base64,' + base64
                                            }
                                        },
                                        {
                                            type: 'text',
                                            text: 'Extract all text from this invoice/PO image. Include all line items, quantities, prices, and totals.'
                                        }
                                    ]
                                }],
                                max_tokens: 2000
                            })
                        });
                        const data = await response.json();
                        resolve(data.choices[0].message.content);
                    } catch (e) {
                        resolve('[Image text extraction failed]');
                    }
                };
                reader.readAsDataURL(file);
            });
        }
        
        async function analyzeWithGrok(poText, invoiceText) {
            const response = await fetch('https://api.x.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + GROK_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'grok-3-latest',
                    messages: [{
                        role: 'user',
                        content: `Compare these two documents and identify all variances:

PURCHASE ORDER (PO):
${poText}

VENDOR INVOICE:
${invoiceText}

Identify:
1. Missing items (ordered but not invoiced)
2. Short shipments (ordered qty > invoice qty)
3. Price discrepancies (unit price or total differences)
4. Unauthorized extras (invoiced but not ordered)
5. Duplicate charges

Format as JSON with keys: type, item, poQty, poPrice, invoiceQty, invoicePrice, variance, impact.`
                    }],
                    max_tokens: 2000
                })
            });
            
            const data = await response.json();
            try {
                return JSON.parse(data.choices[0].message.content);
            } catch {
                return [{
                    type: 'error',
                    message: data.choices[0].message.content
                }];
            }
        }
        
        function displayResults(variances, poText, invoiceText) {
            const resultsHtml = Array.isArray(variances) ? variances.map(v => {
                const severity = v.type === 'Missing' || v.type === 'Duplicate' ? 'critical' : 'warning';
                return `
                    <div class="variance-item ${severity}">
                        <div class="variance-type">🚨 ${v.type}</div>
                        <div class="variance-detail">
                            <strong>${v.item || 'Item'}</strong><br>
                            PO: ${v.poQty || v.poPrice || 'N/A'}<br>
                            Invoice: ${v.invoiceQty || v.invoicePrice || 'N/A'}<br>
                            <span style="color: #f87171;">Impact: ${v.impact || 'Review required'}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<p>Unable to parse variances. Review details in PO vs Invoice manually.</p>';
            
            document.getElementById('variancesList').innerHTML = resultsHtml;
            document.getElementById('resultsSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
