<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorWell Studio - Therapeutic Coloring Pages</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: 600;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .button-group button {
            flex: 1;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
        }
        
        .info {
            background: #e3f2fd;
            color: #1565c0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #1565c0;
        }
        
        .preview-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .preview-item {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .preview-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .preview-item-label {
            padding: 10px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 ColorWell Studio</h1>
            <p>Generate Therapeutic Coloring Pages with AI</p>
        </div>
        
        <div class="content">
            <!-- API Key Input -->
            <div class="section">
                <h2>⚙️ Setup</h2>
                <div id="apiMessage"></div>
                <div class="form-group">
                    <label for="hfToken">HuggingFace Token *</label>
                    <input type="password" id="hfToken" placeholder="Your HF token (hf_...)" value="">
                    <small style="color: #999; margin-top: 5px; display: block;">Get free at https://huggingface.co/settings/tokens</small>
                </div>
                <button onclick="testConnection()">✅ Test Connection</button>
            </div>
            
            <!-- Generation Settings -->
            <div class="section">
                <h2>📋 Page Settings</h2>
                
                <div class="form-group">
                    <label for="numPages">Number of Pages</label>
                    <input type="number" id="numPages" value="5" min="1" max="50">
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label for="theme">Therapeutic Theme</label>
                        <select id="theme">
                            <option value="mandala">Mandala & Sacred Geometry</option>
                            <option value="nature">Nature & Botanical</option>
                            <option value="abstract">Abstract & Zentangle</option>
                            <option value="animals">Animals & Wildlife</option>
                            <option value="ocean">Ocean & Water</option>
                            <option value="celestial">Celestial & Stars</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="style">Art Style</label>
                        <select id="style">
                            <option value="line">Intricate Line Art</option>
                            <option value="geometric">Geometric Patterns</option>
                            <option value="floral">Floral & Botanical</option>
                            <option value="detailed">Highly Detailed</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Additional Details (Optional)</label>
                    <textarea id="description" rows="3" placeholder="e.g., Include crystals, focus on calming patterns, etc."></textarea>
                </div>
            </div>
            
            <!-- Generate Button -->
            <div class="section">
                <button onclick="generatePages()" style="width: 100%; padding: 18px; font-size: 1.2em;">
                    🎨 Generate Coloring Pages
                </button>
            </div>
            
            <!-- Preview & Export -->
            <div class="preview-section" id="previewSection" style="display: none;">
                <h2>👁️ Preview & Export</h2>
                <div id="statusMessage"></div>
                <div id="generatedPages"></div>
                <div style="margin-top: 20px; text-align: center;" id="exportButtons"></div>
            </div>
        </div>
    </div>

    <script>
        const HF_API = 'https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev';
        let generatedImages = [];
        
        async function testConnection() {
            const token = document.getElementById('hfToken').value;
            const msg = document.getElementById('apiMessage');
            
            if (!token || !token.startsWith('hf_')) {
                msg.innerHTML = '<div class="error">❌ Invalid HuggingFace token. Must start with "hf_"</div>';
                return;
            }
            
            msg.innerHTML = '<div class="loading"><div class="spinner"></div><p>Testing connection...</p></div>';
            
            try {
                const response = await fetch(HF_API, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        inputs: 'test image generation',
                    }),
                });
                
                if (response.status === 200 || response.status === 503) {
                    msg.innerHTML = '<div class="success">✅ Connection successful! Ready to generate.</div>';
                } else if (response.status === 401) {
                    msg.innerHTML = '<div class="error">❌ Invalid token. Please check your HuggingFace token.</div>';
                } else {
                    msg.innerHTML = '<div class="info">⏳ Connection verified. Generate to create images.</div>';
                }
            } catch (error) {
                msg.innerHTML = '<div class="error">❌ Connection failed: ' + error.message + '</div>';
            }
        }
        
        async function generatePages() {
            const numPages = parseInt(document.getElementById('numPages').value);
            const theme = document.getElementById('theme').value;
            const style = document.getElementById('style').value;
            const description = document.getElementById('description').value;
            const token = document.getElementById('hfToken').value;
            
            if (!token || !token.startsWith('hf_')) {
                alert('Please enter a valid HuggingFace token');
                return;
            }
            
            const previewSection = document.getElementById('previewSection');
            const statusMsg = document.getElementById('statusMessage');
            const pagesContainer = document.getElementById('generatedPages');
            
            previewSection.style.display = 'block';
            statusMsg.innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating ' + numPages + ' therapeutic coloring pages...</p></div>';
            pagesContainer.innerHTML = '';
            generatedImages = [];
            
            // Create therapy-focused prompts
            const themePrompts = {
                mandala: 'Intricate mandala coloring page, sacred geometry, therapeutic, detailed line art, black and white',
                nature: 'Botanical coloring page with flowers, leaves, plants, therapeutic, detailed line art, calming, black and white',
                abstract: 'Abstract zentangle coloring page, intricate patterns, therapeutic, mindfulness, detailed line art, black and white',
                animals: 'Wildlife coloring page with animals in natural settings, therapeutic, detailed line art, black and white',
                ocean: 'Ocean and water coloring page with waves, shells, fish, therapeutic, detailed line art, black and white',
                celestial: 'Celestial coloring page with stars, moons, cosmic patterns, therapeutic, detailed line art, black and white'
            };
            
            const basePrompt = themePrompts[theme] || themePrompts.mandala;
            const fullPrompt = description ? `${basePrompt}. Additional details: ${description}` : basePrompt;
            
            let successCount = 0;
            
            for (let i = 0; i < numPages; i++) {
                try {
                    const response = await fetch(HF_API, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            inputs: `${fullPrompt}. Page ${i + 1} of ${numPages}`,
                        }),
                    });
                    
                    if (response.ok) {
                        const blob = await response.blob();
                        const url = URL.createObjectURL(blob);
                        generatedImages.push(url);
                        successCount++;
                        
                        // Add preview
                        const previewItem = document.createElement('div');
                        previewItem.className = 'preview-item';
                        previewItem.innerHTML = `
                            <img src="${url}" alt="Page ${i + 1}">
                            <div class="preview-item-label">Page ${i + 1}</div>
                        `;
                        pagesContainer.appendChild(previewItem);
                    } else {
                        // Queue retry or wait
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    }
                } catch (error) {
                    console.error(`Error generating page ${i + 1}:`, error);
                }
                
                // Update status
                statusMsg.innerHTML = `<div class="info">Generated ${successCount}/${numPages} pages...</div>`;
            }
            
            if (successCount > 0) {
                statusMsg.innerHTML = `<div class="success">✅ Generated ${successCount} coloring pages!</div>`;
                showExportButtons();
            } else {
                statusMsg.innerHTML = '<div class="error">❌ Failed to generate images. Please check your token and try again.</div>';
            }
        }
        
        function showExportButtons() {
            const exportDiv = document.getElementById('exportButtons');
            exportDiv.innerHTML = `
                <button onclick="downloadPDF()">📥 Download as PDF</button>
                <button onclick="downloadZip()">📦 Download as ZIP</button>
            `;
        }
        
        async function downloadPDF() {
            if (generatedImages.length === 0) {
                alert('No images to download');
                return;
            }
            
            const pdf = new html2pdf();
            
            for (const imageUrl of generatedImages) {
                const img = new Image();
                img.src = imageUrl;
                
                const div = document.createElement('div');
                div.style.pageBreakAfter = 'always';
                div.appendChild(img);
                
                pdf.addHtml(div);
            }
            
            pdf.save('therapeutic-coloring-book.pdf');
        }
        
        async function downloadZip() {
            if (generatedImages.length === 0) {
                alert('No images to download');
                return;
            }
            
            alert('📌 Right-click each image to save individually, or use a tool like 7-Zip to create a ZIP file from the downloaded images.');
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(() => testConnection(), 500);
        });
    </script>
</body>
</html>
