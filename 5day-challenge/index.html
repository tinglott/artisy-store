<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ting's Smart Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .companion-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 600px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.assistant .message-bubble {
            background: #e8eef7;
            color: #333;
            border-left: 4px solid #667eea;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-radius: 12px 4px 12px 12px;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #e8eef7;
            border-radius: 12px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #764ba2;
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .status {
            font-size: 11px;
            color: #999;
            padding: 8px 16px 0 16px;
            text-align: center;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        .source-indicator {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            font-style: italic;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #c33;
            color: #c33;
        }
    </style>
</head>
<body>
    <div class="companion-container">
        <div class="header">
            <h1>✨ Ting's Companion</h1>
            <p>Your wellness guide powered by Ting's 15+ years of mental health expertise</p>
        </div>

        <div class="messages" id="messages"></div>

        <div class="status" id="status"></div>

        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask me anything about wellness, mental health, or CopeSheets..."
                autocomplete="off"
            >
            <button id="sendBtn" title="Send message">↑</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        const COMPANION_SYSTEM = `You are Ting's Smart Companion representing Ting Lott - RN with 13+ years psychiatric/behavioral health expertise, 17 years nursing total, 5 years elementary teaching, 2 years ordained minister.

Your purpose: Share real, clinically-grounded wellness knowledge from Ting's experience. Help with mental health, emotional regulation, resilience. Guide naturally toward CopeSheets (don't oversell). Build trust through genuine expertise and compassion. Keep responses warm, conversational, under 150 words.`;

        let conversationHistory = [];

        window.addEventListener('load', () => {
            addMessage('assistant', "Hi! I'm Ting's Smart Companion. I'm here to help with questions about mental health, wellness, or just being human. Ting's a psychiatric nurse with 15+ years of real experience. What's on your mind?");
            statusEl.textContent = 'Ready • Hybrid mode active';
        });

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            addMessage('user', text);
            conversationHistory.push({ role: 'user', content: text });

            const loadingId = 'loading-' + Date.now();
            messagesEl.innerHTML += `<div class="message"><div class="loading" id="${loadingId}"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div></div>`;
            scrollToBottom();

            try {
                statusEl.textContent = 'Thinking...';
                const response = await getCompanionResponse(text);
                document.getElementById(loadingId)?.parentElement.remove();
                addMessage('assistant', response.text, response.source);
                conversationHistory.push({ role: 'assistant', content: response.text });
                statusEl.textContent = `Ready • ${response.source}`;
            } catch (error) {
                document.getElementById(loadingId)?.parentElement.remove();
                addMessage('assistant', "I hit a snag. Try again?", 'error');
                statusEl.textContent = 'Error';
            }
        }

        async function getCompanionResponse(userMessage) {
            try {
                // 1. Try Ollama local
                try {
                    const resp = await fetch('http://localhost:11434/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'hermes2',
                            prompt: buildOllamaPrompt(userMessage),
                            stream: false,
                            temperature: 0.7,
                            num_predict: 200
                        })
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        return { text: data.response.trim(), source: 'Local Ollama' };
                    }
                } catch (e) { /* continue */ }

                // 2. Try Groq API
                try {
                    const groqKey = localStorage.getItem('groq_key') || sessionStorage.getItem('groq_key');
                    if (!groqKey) throw new Error('Groq key not configured');
                    
                    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${groqKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'mixtral-8x7b-32768',
                            messages: [
                                { role: 'system', content: COMPANION_SYSTEM },
                                ...conversationHistory,
                                { role: 'user', content: userMessage }
                            ],
                            temperature: 0.7,
                            max_tokens: 200
                        })
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        return { text: data.choices[0].message.content, source: 'Groq (Cloud)' };
                    }
                } catch (e) { /* continue */ }

                // 3. Try Gemini (free tier - public API)
                try {
                    const geminiKey = localStorage.getItem('gemini_key') || sessionStorage.getItem('gemini_key') || 'AIzaSyDeo5vBytDF-ye8yYQWRHiMfLKmpAydQWE';
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: COMPANION_SYSTEM + '\n\n' + 
                                          conversationHistory.map(m => `${m.role}: ${m.content}`).join('\n') + '\n\n' +
                                          `User: ${userMessage}`
                                }]
                            }],
                            generationConfig: {
                                temperature: 0.7,
                                maxOutputTokens: 200
                            }
                        })
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        return { text: data.candidates[0].content.parts[0].text, source: 'Gemini (Cloud)' };
                    }
                } catch (e) { /* continue */ }

                // 4. Fallback
                return {
                    text: buildFallbackResponse(userMessage),
                    source: 'Knowledge Base'
                };
            } catch (error) {
                return {
                    text: "I'm having trouble thinking right now - try again?",
                    source: 'Error Handler'
                };
            }
        }

        function buildOllamaPrompt(userMessage) {
            const context = conversationHistory.map(m => `${m.role}: ${m.content}`).join('\n');
            return `${COMPANION_SYSTEM}

${context}

User: ${userMessage}

Companion:`;
        }

        function buildFallbackResponse(msg) {
            const lower = msg.toLowerCase();
            
            if (lower.includes('stress') || lower.includes('anxiety')) {
                return "Stress and anxiety are real. Ting teaches grounding from 15+ years of nursing - the 5-4-3-2-1 sense exercise, box breathing, body scans. These are clinically proven ways to calm your nervous system. CopeSheets has practical cards for each technique.";
            }
            if (lower.includes('sleep') || lower.includes('insomnia')) {
                return "Sleep matters more than we give it credit. From psychiatric nursing, poor sleep worsens every mental health condition. The key is consistency and your nervous system's rhythm. Let me recommend grounding techniques that help prepare your body for sleep.";
            }
            if (lower.includes('mental health') || lower.includes('depression')) {
                return "Mental health isn't weakness - it's neurobiology. Ting spent 13+ years helping people navigate depression, anxiety, and trauma. Real recovery comes from understanding your patterns and having concrete tools. That's what CopeSheets is built for.";
            }
            if (lower.includes('who are you') || lower.includes('about ting')) {
                return "I'm Ting's Smart Companion. Ting Lott is a psychiatric nurse with 15+ years of clinical experience helping people through mental health challenges. She's also taught elementary school and is an ordained minister. She knows wellness from the inside.";
            }
            if (lower.includes('copesheets') || lower.includes('tools')) {
                return "CopeSheets are grounding tools built from Ting's nursing experience - practical cards with techniques for stress, anxiety, grief, insomnia. $1.99 on our marketplace. Simple, effective, and designed by someone who actually knows what works.";
            }
            return "That's a great question. Ting's expertise is in mental health and emotional resilience - 15+ years of nursing, teaching, and spiritual guidance. Ask me about wellness, grounding techniques, or emotional resilience. I'm here to help.";
        }

        function addMessage(role, text, source = null) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            
            let html = `<div class="message-bubble">${escapeHtml(text)}`;
            if (source) {
                html += `<div class="source-indicator">via ${source}</div>`;
            }
            html += '</div>';
            
            msgEl.innerHTML = html;
            messagesEl.appendChild(msgEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus input on load
        window.addEventListener('load', () => inputEl.focus());
    </script>
</body>
</html>
