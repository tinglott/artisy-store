<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golpo Canvas Studio — AI Whiteboard Explainer Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Bricolage+Grotesque:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/rough.js/4.6.6/rough.min.js"></script>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0a07;
      --surface: #141209;
      --surface2: #1e1a10;
      --border: #2e2818;
      --amber: #f59e0b;
      --amber-light: #fcd34d;
      --coral: #fb7185;
      --teal: #2dd4bf;
      --text: #f5f0e8;
      --muted: #8a7d65;
    }
    body {
      font-family: 'Bricolage Grotesque', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .logo-wrap { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-icon { font-size: 2rem; }
    .logo-text { font-family: 'Playfair Display'; font-size: 1.4rem; font-weight: 800; }
    .logo-text span { color: var(--amber); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text); text-decoration: none; transition: color 0.3s; }
    .nav-links a:hover { color: var(--amber); }
    .nav-right { display: flex; gap: 16px; }
    .btn-ghost { background: none; color: var(--text); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
    .btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
    .btn-primary { background: linear-gradient(135deg, var(--amber), #e07b00); color: #0c0a07; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .hero { padding: 80px 48px; text-align: center; }
    .badge { display: inline-block; background: rgba(245, 158, 11, 0.1); border: 1px solid var(--amber); color: var(--amber); padding: 8px 16px; border-radius: 999px; margin-bottom: 24px; font-size: 0.85rem; }
    .hero h1 { font-family: 'Playfair Display'; font-size: 3.5rem; margin-bottom: 24px; line-height: 1.2; }
    .hero-sub { font-size: 1.2rem; color: var(--muted); margin-bottom: 40px; max-width: 700px; margin-left: auto; margin-right: auto; }
    .hero-ctas { display: flex; gap: 16px; justify-content: center; margin-bottom: 60px; }
    .btn-hero { padding: 16px 40px; background: linear-gradient(135deg, var(--amber), #e07b00); color: #0c0a07; border: none; border-radius: 8px; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
    .btn-hero:hover { transform: translateY(-2px); }
    .video-preview { margin-top: 60px; }
    .video-frame { position: relative; background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 900px; margin: 0 auto; }
    .sketch-canvas { width: 100%; height: 420px; background: #1e1a10; border-radius: 12px; position: relative; overflow: hidden; }
    canvas { width: 100% !important; height: 100% !important; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; }
    .feature-card { padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; text-align: left; transition: all 0.3s; }
    .feature-card:hover { border-color: var(--amber); transform: translateY(-4px); }
    .feature-card > div:first-child { font-size: 3rem; margin-bottom: 16px; }
    .feature-card h3 { margin-bottom: 12px; color: var(--amber-light); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 95%; max-width: 1100px; max-height: 95vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { display: flex; gap: 24px; padding: 28px; flex: 1; overflow: hidden; }
    .scene-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .scene-item { padding: 12px; background: var(--surface2); border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .scene-item:hover { background: var(--border); }
    .scene-item button { background: var(--amber); color: #0c0a07; border: none; padding: 4px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .demo-controls { display: flex; gap: 12px; }
    .demo-controls button { flex: 1; padding: 12px; background: var(--amber); color: #0c0a07; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .demo-controls button:hover { background: var(--amber-light); }
    .demo-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea, input { color: var(--text); }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    h4 { margin-bottom: 12px; }
    #demoStatus { padding: 12px; background: rgba(45, 212, 191, 0.1); border: 1px solid var(--teal); border-radius: 8px; color: var(--teal); }
</style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo-wrap">
      <span class="logo-icon">✨</span>
      <span class="logo-text">Golpo <span>Canvas</span></span>
    </a>
    <div class="nav-right">
      <button class="btn-ghost" onclick="location.href='index.html'">← Back</button>
    </div>
  </nav>

<!-- DEMO MODAL - FULLY FUNCTIONAL -->
<div id="demoModal" class="modal" style="display: flex;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🚀 AI Whiteboard Explainer Studio</h3>
      <button onclick="location.href='index.html'" style="font-size:2rem;background:none;border:none;color:var(--muted);cursor:pointer;">×</button>
    </div>
    <div class="modal-body" style="display:flex;gap:24px;padding:28px;flex:1;overflow:hidden;">
      <!-- Left: Controls -->
      <div style="flex:1;display:flex;flex-direction:column;gap:20px;overflow-y:auto;">
        <div>
          <h4>Topic or Script</h4>
          <textarea id="promptInput" rows="5" style="width:100%;background:var(--surface2);border:1px solid var(--border);padding:16px;border-radius:8px;color:var(--text);" placeholder="Explain photosynthesis for high school students..."></textarea>
        </div>
        
        <div id="keySection">
          <label>Grok API Key <span style="color:var(--muted);font-size:0.8rem;">— Using free tier by default</span></label>
          <input id="groqKey" type="password" placeholder="xai-..." style="width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;">
          <p style="margin-top:8px;font-size:0.9rem;color:var(--muted);">Get your own free key at <a href="https://console.x.ai" target="_blank" style="color:var(--amber);">console.x.ai</a></p>
        </div>

        <button onclick="generateVideoDemo()" style="padding:16px;background:linear-gradient(135deg,var(--amber),#e07b00);color:#0c0a07;border:none;border-radius:8px;font-weight:700;font-size:1.1rem;cursor:pointer;">Generate Scenes & Animate</button>
        
        <div id="demoStatus" style="min-height:60px;font-size:0.95rem;"></div>

        <!-- Scene List -->
        <div>
          <h4>Scenes <button onclick="addNewScene()" style="font-size:0.8rem;padding:4px 12px;background:var(--border);color:var(--text);border:none;border-radius:4px;cursor:pointer;">+ Add Scene</button></h4>
          <div id="sceneList" class="scene-list"></div>
        </div>

        <div class="demo-controls">
          <button onclick="startRecording()" id="recordBtn">🎥 Record Video</button>
          <button onclick="playAllScenes()" id="playBtn">▶ Play All</button>
          <button onclick="exportProject()">💾 Save Project</button>
        </div>
      </div>

      <!-- Right: Canvas -->
      <div style="flex:1;position:relative;display:flex;flex-direction:column;">
        <canvas id="demoCanvas" width="520" height="420" style="background:#111;border:1px solid var(--border);border-radius:12px;width:100%;flex:1;"></canvas>
        <div id="recordingStatus" style="margin-top:12px;text-align:center;color:var(--muted);font-size:0.9rem;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Read Grok key from URL parameter (base64 encoded)
  function getGrokKeyFromURL() {
    const params = new URLSearchParams(window.location.search);
    const encodedKey = params.get('key');
    if (encodedKey) {
      try {
        return atob(encodedKey); // Decode from base64
      } catch(e) {
        console.error('Failed to decode key');
      }
    }
    // Default to Ting's free tier key (base64 encoded)
    return atob('eGFpLWladkx2a0paTDNDTTZibU5EQzVtcDJJZ3gySDVJY0pmWk83S2l2UWFLVXpPQ1Y1TFJEZUU2bjk0MXVXZm5QblV6aXZKc0RKQzE0c3FPTW1y');
  }

  // Initialize key field with free tier
  window.addEventListener('DOMContentLoaded', function() {
    const keyInput = document.getElementById('groqKey');
    const defaultKey = getGrokKeyFromURL();
    keyInput.value = defaultKey;
  });

  let currentProject = { scenes: [] };
  let recordingVideoChunks = [];
  let mediaRecorder = null;

  // Generate demo scenes using Grok
  async function generateVideoDemo() {
    const status = document.getElementById('demoStatus');
    const prompt = document.getElementById('promptInput').value.trim() || "Explain how photosynthesis works";
    const grokKey = document.getElementById('groqKey').value.trim();
    
    status.innerHTML = '🤖 Generating script with Grok...';
    
    let scenes = [];
    if (grokKey) {
      try {
        const res = await fetch('https://api.x.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${grokKey}`,
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({
            model: "grok-3-latest",
            messages: [{
              role: "user", 
              content: `Break this topic into 3-5 short, punchy scenes for a whiteboard explainer video. For each scene, provide just the text (max 10 words) and duration in seconds (3-5). Return as JSON array: [{text: "...", duration: N}].\n\nTopic: ${prompt}`
            }]
          })
        });
        
        if (!res.ok) {
          throw new Error(`Grok API error: ${res.status}`);
        }
        
        const data = await res.json();
        const content = data.choices[0].message.content;
        
        // Parse JSON from response
        const jsonMatch = content.match(/\[.*\]/s);
        if (jsonMatch) {
          scenes = JSON.parse(jsonMatch[0]);
          scenes = scenes.map((s, i) => ({ ...s, id: i + 1 }));
        }
      } catch(e) {
        console.error(e);
        status.innerHTML += ` <span style="color:#fb7185;display:block;margin-top:8px;">${e.message || 'Error generating scenes'} (using fallback demo)</span>`;
      }
    }
    
    if (!scenes.length) {
      scenes = [
        {id:1, text: "Sunlight + Water + CO₂", duration: 4},
        {id:2, text: "Chlorophyll captures energy", duration: 4},
        {id:3, text: "Glucose is produced", duration: 3},
        {id:4, text: "Oxygen is released", duration: 3}
      ];
    }
    
    currentProject.scenes = scenes;
    renderSceneList();
    status.innerHTML = `✅ Generated ${scenes.length} scenes! Click play to animate.`;
    
    // Draw first scene
    if (scenes.length > 0) {
      await drawScene(scenes[0]);
    }
  }

  // Render scenes list
  function renderSceneList() {
    const container = document.getElementById('sceneList');
    container.innerHTML = '';
    currentProject.scenes.forEach((scene, i) => {
      const div = document.createElement('div');
      div.className = 'scene-item';
      div.innerHTML = `
        <span><strong>Scene ${i+1}:</strong> ${scene.text.substring(0,35)}</span>
        <button onclick="editScene(${i});event.stopPropagation()">Edit</button>
      `;
      div.onclick = () => drawScene(scene);
      container.appendChild(div);
    });
  }

  // Draw scene on canvas with Rough.js
  async function drawScene(scene) {
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Create Rough.js instance
    const rc = rough.canvas(canvas);
    
    // Draw background
    rc.rectangle(10, 10, canvas.width - 20, canvas.height - 20, {
      fill: '#1e1a10',
      stroke: '#2e2818',
      strokeWidth: 2
    });
    
    // Draw text with rough style
    ctx.font = 'bold 32px Bricolage Grotesque';
    ctx.fillStyle = '#fcd34d';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(scene.text, canvas.width / 2, canvas.height / 2 - 40);
    
    // Draw decorative circles
    const circleCount = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < circleCount; i++) {
      const x = 80 + Math.random() * (canvas.width - 160);
      const y = 150 + Math.random() * (canvas.height - 280);
      const r = 30 + Math.random() * 40;
      rc.circle(x, y, r, {
        stroke: '#f59e0b',
        strokeWidth: 2,
        fill: 'transparent',
        roughness: 1.5
      });
    }
    
    // Draw duration label
    ctx.font = '14px Bricolage Grotesque';
    ctx.fillStyle = '#8a7d65';
    ctx.textAlign = 'right';
    ctx.fillText(`${scene.duration}s`, canvas.width - 30, canvas.height - 30);
  }

  // Play all scenes
  async function playAllScenes() {
    const playBtn = document.getElementById('playBtn');
    playBtn.disabled = true;
    
    for (const scene of currentProject.scenes) {
      await drawScene(scene);
      await new Promise(resolve => setTimeout(resolve, (scene.duration || 3) * 1000));
    }
    
    playBtn.disabled = false;
  }

  // Start recording
  async function startRecording() {
    const canvas = document.getElementById('demoCanvas');
    const recordBtn = document.getElementById('recordBtn');
    const statusDiv = document.getElementById('recordingStatus');
    
    recordBtn.disabled = true;
    statusDiv.innerHTML = '🔴 Recording...';
    recordingVideoChunks = [];
    
    try {
      const stream = canvas.captureStream(30); // 30 FPS
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordingVideoChunks.push(e.data);
        }
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordingVideoChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'golpo-explainer.webm';
        a.click();
        
        statusDiv.innerHTML = '✅ Video downloaded!';
        recordBtn.disabled = false;
        recordBtn.textContent = '🎥 Record Video';
      };
      
      mediaRecorder.start();
      
      // Record for duration of all scenes
      const totalDuration = currentProject.scenes.reduce((sum, s) => sum + (s.duration || 3), 0) * 1000;
      await playAllScenes();
      
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, totalDuration);
      
    } catch(e) {
      console.error(e);
      statusDiv.innerHTML = `❌ Recording failed: ${e.message}`;
      recordBtn.disabled = false;
    }
  }

  // Edit scene
  function editScene(index) {
    const scene = currentProject.scenes[index];
    const newText = prompt('Edit scene text:', scene.text);
    if (newText) {
      scene.text = newText;
      renderSceneList();
      drawScene(scene);
    }
  }

  // Add new scene
  function addNewScene() {
    const newScene = {
      id: currentProject.scenes.length + 1,
      text: 'New Scene',
      duration: 3
    };
    currentProject.scenes.push(newScene);
    renderSceneList();
    drawScene(newScene);
  }

  // Export project
  function exportProject() {
    const json = JSON.stringify(currentProject, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'golpo-project.json';
    a.click();
  }
</script>
</body>
</html>
