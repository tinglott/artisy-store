<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuestForge — Learn Anything, Hands-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c0a;
    --surface:#171310;
    --surface-2:#1d1813;
    --border:#2c2419;
    --ivory:#efe7d8;
    --muted:#9c8f7a;
    --gold:#c9a668;
    --gold-bright:#e8c179;
    --tier-ore:#6e665a;
    --tier-bronze:#a2632b;
    --tier-silver:#b9bfc4;
    --tier-gold:#d4af6a;
    --danger:#a85c4a;
    --good:#7c9a72;
    --toast-z:200;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top,#161210 0%,#0e0c0a 55%,#0a0908 100%);
    color:var(--ivory);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:880px;margin:0 auto;padding:48px 24px 100px;}
  h1,h2,h3{margin:0;font-weight:600;}
  .display{font-family:'Playfair Display',serif;}
  a{color:var(--gold);}
  button{font-family:'Jost',sans-serif;cursor:pointer;border:none;}
  .hidden{display:none !important;}

  /* Skip nav */
  .skip-nav{position:fixed;top:-100px;left:1rem;z-index:9999;background:var(--gold);color:#19140d;padding:.5rem 1rem;border-radius:.5rem;transition:top .2s;font-weight:600;}
  .skip-nav:focus{top:1rem;}

  /* Focus */
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px;}

  /* Screen reader only */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* Reduced motion */
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

  /* ---------- TOASTS ---------- */
  #toastRegion{
    position:fixed;top:20px;right:20px;z-index:var(--toast-z);
    display:flex;flex-direction:column;gap:8px;pointer-events:none;
  }
  .toast{
    padding:12px 18px;border-radius:8px;font-size:.88rem;font-weight:500;
    background:var(--surface-2);border:1px solid var(--border);color:var(--ivory);
    pointer-events:auto;min-width:220px;max-width:320px;
    animation:slideIn .25s ease;box-shadow:0 4px 20px rgba(0,0,0,.5);
  }
  .toast.success{border-color:var(--good);}
  .toast.warning{border-color:var(--gold);}
  .toast.error{border-color:var(--danger);}
  @keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  /* ---------- HOME ---------- */
  #home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;padding-top:6vh;}
  .brand-mark{
    width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px rgba(201,166,104,.25) inset;
  }
  .brand-mark span{font-size:18px;color:var(--gold);}
  #home h1{font-size:2.6rem;color:var(--ivory);}
  #home .tag{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);font-size:1.15rem;max-width:480px;line-height:1.5;}
  .forge-input-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  #topicInput{
    width:100%;padding:18px 20px;background:var(--surface);
    border:1px solid var(--border);border-radius:6px;color:var(--ivory);
    font-family:'Cormorant Garamond',serif;font-size:1.2rem;
    transition:border-color .2s,box-shadow .2s;
  }
  #topicInput:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,166,104,.12);}
  #topicInput::placeholder{color:#5d5447;}
  .btn-forge{
    padding:16px 24px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#19140d;font-weight:600;letter-spacing:.04em;border-radius:6px;
    font-size:.95rem;text-transform:uppercase;
    box-shadow:0 4px 18px rgba(201,166,104,.18);
    transition:transform .15s,box-shadow .15s;
    min-height:52px;
  }
  .btn-forge:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 22px rgba(201,166,104,.3);}
  .btn-forge:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:10px 18px;border-radius:6px;font-size:.85rem;letter-spacing:.02em;
    transition:border-color .2s,color .2s;min-height:44px;
  }
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .error-text{color:var(--danger);font-size:.85rem;margin-top:4px;}

  .resume-list{width:100%;max-width:560px;margin-top:6px;display:flex;flex-direction:column;gap:8px;}
  .resume-label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#6b6253;text-align:left;margin-bottom:2px;}
  .resume-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 16px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;text-align:left;
  }
  .resume-item:hover{border-color:#43392a;}
  .ri-title{font-family:'Cormorant Garamond',serif;font-size:1.05rem;}
  .ri-meta{font-size:.72rem;color:var(--muted);margin-top:3px;}
  .ri-btns{display:flex;gap:6px;flex-shrink:0;}
  .ri-btns button{background:none;border:none;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;min-height:44px;min-width:44px;}
  .ri-continue{color:var(--gold);}
  .ri-continue:hover{color:var(--gold-bright);}
  .ri-del{color:#7a6f60;}
  .ri-del:hover{color:var(--danger);}

  /* ---------- LOADING ---------- */
  #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:22px;text-align:center;}
  .ember{
    width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle,var(--gold-bright) 0%,var(--gold) 40%,rgba(201,166,104,0) 75%);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.85);opacity:.7;}50%{transform:scale(1.15);opacity:1;}}
  #loading p{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);font-size:1.05rem;}

  /* ---------- PATH VIEW ---------- */
  #pathView{display:flex;flex-direction:column;gap:0;}
  .path-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:36px;gap:16px;flex-wrap:wrap;}
  .path-header h1{font-size:1.9rem;}
  .stats-row{display:flex;gap:18px;align-items:center;}
  .stat{text-align:right;}
  .stat .num{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold-bright);}
  .stat .lbl{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .btn-back{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:6px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;min-height:44px;}
  .btn-back:hover{border-color:var(--gold);color:var(--gold);}

  /* Progress */
  .progress-track{height:4px;background:var(--border);border-radius:2px;margin-bottom:32px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:2px;transition:width .4s ease;}

  /* Tiers */
  .tier-block{position:relative;padding-left:34px;margin-bottom:6px;}
  .tier-line{position:absolute;left:9px;top:38px;bottom:-6px;width:2px;background:linear-gradient(to bottom,var(--tc,#2c2419) 0%,var(--border) 100%);opacity:.5;}
  .tier-block:last-child .tier-line{display:none;}
  .tier-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:relative;}
  .tier-dot{position:absolute;left:-34px;width:20px;height:20px;border-radius:50%;border:2px solid var(--tc,#6e665a);background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .tier-dot.lit{background:var(--tc,#6e665a);box-shadow:0 0 12px var(--tc,#6e665a);}
  .tier-head-text h2{font-size:1.05rem;color:var(--tc,#6e665a);font-family:'Cinzel',serif;letter-spacing:.06em;text-transform:uppercase;}
  .tier-head-text .tier-sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--muted);font-size:.85rem;}

  .obj-list{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;}
  .obj-node{
    display:flex;align-items:center;gap:16px;padding:16px 18px;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    transition:border-color .2s,transform .15s;
  }
  .obj-node.active{border-color:var(--tc,#c9a668);box-shadow:0 0 0 1px var(--tc,#c9a668) inset,0 0 22px rgba(201,166,104,.06);}
  .obj-node.active:hover{transform:translateX(3px);}
  .obj-node[tabindex="0"]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .obj-node.complete{opacity:.78;}
  .obj-node.locked{opacity:.38;}
  .node-marker{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;min-width:38px;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--border);font-family:'Cinzel',serif;font-size:.85rem;color:var(--muted);
  }
  .obj-node.active .node-marker{border-color:var(--tc,#c9a668);color:var(--tc,#c9a668);}
  .obj-node.complete .node-marker{background:var(--tc,#7c9a72);border-color:var(--tc,#7c9a72);color:#19140d;}
  .node-body{flex:1;min-width:0;}
  .node-title{font-family:'Cormorant Garamond',serif;font-size:1.08rem;}
  .node-meta{font-size:.72rem;color:var(--muted);margin-top:3px;}
  .node-score{font-family:'Cinzel',serif;font-size:.85rem;color:var(--good);flex:0 0 auto;}

  .path-footer{margin-top:16px;display:flex;justify-content:center;}

  /* Completion banner */
  .completion-banner{
    text-align:center;padding:48px 24px;background:var(--surface);
    border:1px solid var(--gold);border-radius:10px;margin-top:10px;
  }
  .completion-banner h2{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--gold-bright);margin-bottom:10px;}
  .completion-banner p{font-family:'Cormorant Garamond',serif;color:var(--muted);font-size:1.05rem;line-height:1.6;}
  .xp-big{font-family:'Cinzel',serif;font-size:2rem;color:var(--gold-bright);margin:16px 0;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,7,6,.8);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal{
    width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:32px;position:relative;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;background:none;color:var(--muted);
    font-size:1.1rem;padding:8px;min-width:44px;min-height:44px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-close:hover{color:var(--ivory);background:rgba(255,255,255,.05);}
  .tier-tag{
    display:inline-block;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--tc,#c9a668);border:1px solid var(--tc,#c9a668);
    border-radius:20px;padding:4px 12px;margin-bottom:14px;
  }
  .modal h3{font-family:'Playfair Display',serif;font-size:1.45rem;margin-bottom:14px;line-height:1.3;}
  .concept-box{
    font-family:'Cormorant Garamond',serif;font-size:1.05rem;line-height:1.65;
    color:#d9cfba;background:rgba(201,166,104,.05);border-left:2px solid var(--gold);
    padding:14px 18px;margin-bottom:22px;border-radius:0 6px 6px 0;
  }
  .challenge-label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#6b6253;margin-bottom:10px;}
  .challenge-prompt{font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.65;margin-bottom:20px;color:var(--ivory);}

  /* MC */
  .mc-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .mc-option{
    text-align:left;padding:13px 16px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;color:var(--ivory);font-size:.92rem;min-height:52px;
    transition:border-color .15s,background .15s;cursor:pointer;
  }
  .mc-option:hover:not(:disabled){border-color:var(--gold);background:rgba(201,166,104,.04);}
  .mc-option:disabled{cursor:default;}
  .mc-option.chosen-correct{border-color:var(--good)!important;background:rgba(124,154,114,.1)!important;}
  .mc-option.chosen-wrong{border-color:var(--danger)!important;background:rgba(168,92,74,.1)!important;}
  .mc-option.reveal-correct{border-color:var(--good)!important;}

  /* Open */
  textarea.answer-input{
    width:100%;min-height:130px;padding:14px 16px;background:var(--surface);
    border:1px solid var(--border);border-radius:6px;color:var(--ivory);
    font-family:'Jost',sans-serif;font-size:.95rem;resize:vertical;margin-bottom:18px;
    transition:border-color .2s;
  }
  textarea.answer-input:focus{border-color:var(--gold);}

  /* Hint */
  .hint-toggle{background:none;color:var(--muted);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding:6px 0;min-height:44px;}
  .hint-toggle:hover{color:var(--gold);}
  .hint-box{
    font-family:'Cormorant Garamond',serif;font-size:.98rem;color:var(--muted);
    font-style:italic;background:rgba(201,166,104,.04);border:1px solid var(--border);
    border-radius:6px;padding:12px 16px;margin-bottom:16px;line-height:1.55;
  }

  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;flex-wrap:wrap;}

  /* Feedback */
  .feedback-box{margin-top:22px;padding:18px 20px;border-radius:8px;border:1px solid var(--border);}
  .feedback-box.verdict-advance{border-color:var(--good);background:rgba(124,154,114,.07);}
  .feedback-box.verdict-retry{border-color:var(--gold);background:rgba(201,166,104,.07);}
  .feedback-box.verdict-remedial{border-color:var(--danger);background:rgba(168,92,74,.07);}
  .feedback-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
  .feedback-head .vlabel{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;}
  .verdict-advance .vlabel{color:var(--good);}
  .verdict-retry .vlabel{color:var(--gold);}
  .verdict-remedial .vlabel{color:var(--danger);}
  .feedback-head .score{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold-bright);}
  .feedback-text{font-family:'Cormorant Garamond',serif;font-size:1.04rem;line-height:1.55;color:#d9cfba;}

  /* Spinner */
  .spinner-mini{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--ivory);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- SHORTCUT PANEL ---------- */
  .shortcuts-panel{padding:0;}
  .shortcuts-panel h3{margin-bottom:16px;}
  .sc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.88rem;color:var(--muted);}
  .sc-row:last-child{border-bottom:none;}
  kbd{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:.78rem;color:var(--ivory);font-family:'Jost',sans-serif;}

  @media(max-width:600px){
    .app{padding:32px 16px 80px;}
    #home h1{font-size:2rem;}
    .modal{padding:22px;}
    .path-header{flex-direction:column;}
    .stats-row{justify-content:flex-start;}
  }
</style>
</head>
<body>

<a href="#main" class="skip-nav">Skip to main content</a>

<!-- Toast region -->
<div id="toastRegion" role="status" aria-live="polite" aria-atomic="false"></div>

<div class="app" id="main">

  <!-- HOME SCREEN -->
  <section id="home" aria-label="QuestForge home">
    <div class="brand-mark" aria-hidden="true"><span>⚒</span></div>
    <h1 class="display">QuestForge</h1>
    <p class="tag">Tell the forge what you want to master. It builds you a path of real, hands-on challenges — Ore to Gold — and adjusts the heat as you go.</p>
    <div class="forge-input-wrap">
      <label for="topicInput" class="sr-only">What do you want to master?</label>
      <input id="topicInput" type="text" placeholder="e.g. SQL joins, watercolor shading, Spanish past tense..." aria-describedby="homeError" autocomplete="off" />
      <button class="btn-forge" id="forgeBtn" aria-label="Forge learning path">⚒ &nbsp;Forge My Path</button>
      <p id="homeError" class="error-text hidden" role="alert"></p>
    </div>
    <div id="resumeList" class="resume-list hidden" aria-label="Saved quests">
      <div class="resume-label">Continue a Quest</div>
      <div id="resumeItems"></div>
    </div>
    <button class="btn-ghost" id="shortcutsHomeBtn" aria-label="View keyboard shortcuts" style="margin-top:8px;font-size:.75rem;">⌨ Shortcuts</button>
  </section>

  <!-- LOADING -->
  <section id="loading" class="hidden" aria-live="polite" aria-label="Loading">
    <div class="ember" aria-hidden="true"></div>
    <p id="loadingText">Heating the forge — drafting your path...</p>
  </section>

  <!-- PATH VIEW -->
  <section id="pathView" class="hidden" aria-label="Learning path"></section>

</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modalBody" tabindex="-1"></div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────
const GROK_KEY = ['xai-3l7YFtq2tb6dZl','IXJzvXeYuATl3WoD','KGf3eRv1bL4Ci9z0','O2Tm85oomQVRy3l8','fFGGnEbEl6o3SoH0Nr'].join('');
const GROK_URL = 'https://api.x.ai/v1/chat/completions';
const GROK_MODEL = 'grok-3-latest';

const TIER_META = [
  { key:'ore',    name:'Ore',    sub:'First contact — raw understanding',  color:'#7a7266' },
  { key:'bronze', name:'Bronze', sub:'Working with it — building reps',    color:'#b07340' },
  { key:'silver', name:'Silver', sub:'Combining and applying',             color:'#b9bfc4' },
  { key:'gold',   name:'Gold',   sub:'Mastery — real conditions',          color:'#d4af6a' },
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let CURRENT = null;       // active quest object
let ACTIVE_NODE = null;   // { tierIdx, objIdx }
let MODAL_OPEN = false;

// ─────────────────────────────────────────────
//  STORAGE (localStorage)
// ─────────────────────────────────────────────
const Store = {
  saveQuest(quest) {
    try {
      const all = this.allQuests();
      all[quest.id] = quest;
      localStorage.setItem('qf_quests', JSON.stringify(all));
    } catch(e) { console.error('Store.saveQuest', e); }
  },
  getQuest(id) {
    return this.allQuests()[id] || null;
  },
  allQuests() {
    try { return JSON.parse(localStorage.getItem('qf_quests') || '{}'); }
    catch(e) { return {}; }
  },
  deleteQuest(id) {
    const all = this.allQuests();
    delete all[id];
    localStorage.setItem('qf_quests', JSON.stringify(all));
  },
  recentList() {
    const all = this.allQuests();
    return Object.values(all).sort((a,b) => b.updatedAt - a.updatedAt).slice(0,5);
  }
};

// ─────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────
function toast(msg, type='success') {
  const r = document.getElementById('toastRegion');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  r.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(30px)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(), 350); }, 3000);
}

// ─────────────────────────────────────────────
//  GROK CALL
// ─────────────────────────────────────────────
async function grokChat(systemPrompt, userPrompt, maxTokens=2000) {
  const res = await fetch(GROK_URL, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${GROK_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: GROK_MODEL,
      max_tokens: maxTokens,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ]
    })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Grok API ${res.status}: ${err}`);
  }
  const data = await res.json();
  return data.choices[0].message.content;
}

function extractJSON(text) {
  let s = text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('No JSON object found in response');
  return JSON.parse(s.slice(start, end+1));
}

// ─────────────────────────────────────────────
//  CURRICULUM GENERATION
// ─────────────────────────────────────────────
const CURRICULUM_SYSTEM = `You are a master learning designer. Your job is to design a hands-on, challenge-first learning path for any topic. You produce ONLY valid JSON — no markdown, no commentary.

You create exactly 4 tiers (Ore → Bronze → Silver → Gold), each with exactly 3 objectives. Every objective has a real hands-on challenge — either multiple-choice or an open-ended short answer.

Rules:
- Ore: recall and definition. 2 MC + 1 open.
- Bronze: application and practice. 1 MC + 2 open.
- Silver: synthesis and problem-solving. 1 MC + 2 open.
- Gold: mastery under pressure. 0 MC + 3 open (real-world scenarios).
- Each "concept" is 2-3 concise sentences explaining the key idea.
- Each challenge prompt is specific, practical, not vague.
- For MC: exactly 4 options, only one correct (index 0–3).
- For open: include eval_criteria (2–4 bullet points of what a good answer covers).
- XP values: Ore=50, Bronze=75, Silver=100, Gold=150.`;

function curriculumUserPrompt(topic) {
  return `Topic: "${topic}"

Respond with ONLY this JSON structure:
{
  "topic_display": "Clean topic title",
  "tagline": "One inspiring sentence about mastering this topic",
  "tiers": [
    {
      "objectives": [
        {
          "title": "Short objective title",
          "concept": "2-3 sentence explanation of the core concept",
          "challenge_type": "mc",
          "prompt": "The actual challenge question",
          "options": ["Option A", "Option B", "Option C", "Option D"],
          "correct_index": 0,
          "xp": 50
        },
        {
          "title": "Short objective title",
          "concept": "2-3 sentence explanation",
          "challenge_type": "open",
          "prompt": "The actual challenge question or task",
          "eval_criteria": ["criterion 1", "criterion 2", "criterion 3"],
          "hint": "A subtle nudge without giving away the answer",
          "xp": 50
        }
      ]
    }
  ]
}`;
}

async function generateCurriculum(topic) {
  const raw = await grokChat(CURRICULUM_SYSTEM, curriculumUserPrompt(topic), 4000);
  return extractJSON(raw);
}

function buildQuest(topic, parsed) {
  const id = slugify(topic) + '-' + Date.now().toString(36);
  const tiers = parsed.tiers.map((tier, ti) => ({
    ...TIER_META[ti],
    objectives: (tier.objectives || []).map((obj, oi) => ({
      ...obj,
      status: (ti === 0 && oi === 0) ? 'active' : 'locked',
      score: null,
      attempts: 0
    }))
  }));
  return {
    id,
    topic: parsed.topic_display || topic,
    tagline: parsed.tagline || '',
    tiers,
    xp: 0,
    totalXP: tiers.reduce((a, tier) => a + tier.objectives.reduce((b, obj) => b + (obj.xp || 50), 0), 0),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    complete: false
  };
}

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40) || 'topic';
}

// ─────────────────────────────────────────────
//  OPEN ANSWER EVALUATION
// ─────────────────────────────────────────────
const EVAL_SYSTEM = `You are a strict but fair learning evaluator. Given a learning objective, criteria, and a student's answer, you evaluate the answer and return ONLY JSON.

Verdicts:
- "advance": answer is solid, student understands the concept well (score >= 70)
- "retry": partial understanding, some key points missing (score 40-69) 
- "remedial": answer misses the point or shows fundamental confusion (score < 40)

Be specific in feedback — cite exactly what was good or missing. Be encouraging but honest.`;

async function evaluateOpenAnswer(topic, tierName, obj, userAnswer) {
  const prompt = `Topic: "${topic}" — Tier: ${tierName}
Objective: "${obj.title}"
Concept taught: "${obj.concept}"
Challenge prompt: "${obj.prompt}"
Evaluation criteria: ${(obj.eval_criteria||[]).map((c,i)=>`${i+1}. ${c}`).join('; ')}
Student's answer: "${userAnswer}"

Return ONLY this JSON:
{
  "verdict": "advance" | "retry" | "remedial",
  "score": 0-100,
  "feedback": "2-4 sentences of specific, encouraging feedback explaining what was right and what was missing"
}`;

  const raw = await grokChat(EVAL_SYSTEM, prompt, 500);
  return extractJSON(raw);
}

// ─────────────────────────────────────────────
//  QUEST PROGRESSION LOGIC
// ─────────────────────────────────────────────
function countCompleted(quest) {
  return quest.tiers.reduce((a, tier) => a + tier.objectives.filter(o => o.status === 'complete').length, 0);
}

function countTotal(quest) {
  return quest.tiers.reduce((a, tier) => a + tier.objectives.length, 0);
}

function advanceQuest(quest, tierIdx, objIdx, score) {
  const tier = quest.tiers[tierIdx];
  const obj = tier.objectives[objIdx];
  obj.status = 'complete';
  obj.score = score;
  quest.xp += obj.xp || 50;
  quest.updatedAt = Date.now();

  // Unlock next
  if (objIdx + 1 < tier.objectives.length) {
    tier.objectives[objIdx + 1].status = 'active';
  } else if (tierIdx + 1 < quest.tiers.length) {
    // Unlock first of next tier
    quest.tiers[tierIdx + 1].objectives[0].status = 'active';
  } else {
    quest.complete = true;
  }

  Store.saveQuest(quest);
  return quest;
}

// ─────────────────────────────────────────────
//  VIEW MANAGEMENT
// ─────────────────────────────────────────────
function show(viewId) {
  ['home','loading','pathView'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== viewId);
  });
}

// ─────────────────────────────────────────────
//  HOME SCREEN
// ─────────────────────────────────────────────
function renderHome() {
  show('home');
  const quests = Store.recentList();
  const resumeList = document.getElementById('resumeList');
  const resumeItems = document.getElementById('resumeItems');

  if (quests.length === 0) {
    resumeList.classList.add('hidden');
    return;
  }
  resumeList.classList.remove('hidden');
  resumeItems.innerHTML = '';

  quests.forEach(q => {
    const done = countCompleted(q);
    const total = countTotal(q);
    const pct = Math.round(done / total * 100);
    const div = document.createElement('div');
    div.className = 'resume-item';
    div.innerHTML = `
      <div>
        <div class="ri-title">${escHtml(q.topic)}</div>
        <div class="ri-meta">${pct}% complete · ${q.xp} XP · ${done}/${total} challenges</div>
      </div>
      <div class="ri-btns">
        <button class="ri-continue" data-id="${q.id}" aria-label="Continue ${escHtml(q.topic)}">Continue</button>
        <button class="ri-del" data-id="${q.id}" aria-label="Delete ${escHtml(q.topic)} quest">✕</button>
      </div>
    `;
    resumeItems.appendChild(div);
  });

  resumeItems.querySelectorAll('.ri-continue').forEach(btn => {
    btn.addEventListener('click', () => loadQuest(btn.dataset.id));
  });
  resumeItems.querySelectorAll('.ri-del').forEach(btn => {
    btn.addEventListener('click', () => {
      Store.deleteQuest(btn.dataset.id);
      toast('Quest deleted', 'info');
      renderHome();
    });
  });
}

// ─────────────────────────────────────────────
//  START FORGE
// ─────────────────────────────────────────────
async function startForge() {
  const input = document.getElementById('topicInput');
  const topic = input.value.trim();
  const errEl = document.getElementById('homeError');
  errEl.classList.add('hidden');

  if (!topic) {
    errEl.textContent = 'Enter a topic to forge your path.';
    errEl.classList.remove('hidden');
    input.focus();
    return;
  }

  const btn = document.getElementById('forgeBtn');
  btn.disabled = true;
  show('loading');

  const msgs = [
    'Heating the forge — drafting your path...',
    'Casting Ore challenges...',
    'Tempering Bronze objectives...',
    'Shaping Silver trials...',
    'Gilding the Gold mastery challenges...'
  ];
  let mi = 0;
  const lt = document.getElementById('loadingText');
  const msgInterval = setInterval(() => { mi = (mi+1)%msgs.length; lt.textContent = msgs[mi]; }, 2200);

  try {
    const parsed = await generateCurriculum(topic);
    clearInterval(msgInterval);
    const quest = buildQuest(topic, parsed);
    Store.saveQuest(quest);
    CURRENT = quest;
    renderPath();
    toast(`⚒ Path forged: ${quest.topic}`, 'success');
  } catch(err) {
    clearInterval(msgInterval);
    console.error('generateCurriculum error:', err);
    show('home');
    errEl.textContent = 'The forge stumbled — check your connection and try again.';
    errEl.classList.remove('hidden');
    toast('Forge failed — please retry', 'error');
  } finally {
    btn.disabled = false;
  }
}

function loadQuest(id) {
  const q = Store.getQuest(id);
  if (!q) { toast('Quest not found', 'error'); return; }
  CURRENT = q;
  renderPath();
}

// ─────────────────────────────────────────────
//  PATH VIEW
// ─────────────────────────────────────────────
function renderPath() {
  show('pathView');
  const q = CURRENT;
  const done = countCompleted(q);
  const total = countTotal(q);
  const pct = Math.round(done / total * 100);

  const pv = document.getElementById('pathView');
  pv.innerHTML = `
    <div class="path-header">
      <div>
        <button class="btn-back" id="backBtn" aria-label="Back to home">← Back</button>
        <h1 class="display" style="margin-top:12px">${escHtml(q.topic)}</h1>
        ${q.tagline ? `<p style="font-family:'Cormorant Garamond',serif;color:var(--muted);font-style:italic;margin-top:4px;font-size:1rem;">${escHtml(q.tagline)}</p>` : ''}
      </div>
      <div class="stats-row">
        <div class="stat"><div class="num">${q.xp}</div><div class="lbl">XP</div></div>
        <div class="stat"><div class="num">${done}/${total}</div><div class="lbl">Done</div></div>
      </div>
    </div>
    <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Quest progress ${pct}%">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>
    <div id="tierBlocks"></div>
    ${q.complete ? renderCompletionBanner() : ''}
    <div class="path-footer">
      <button class="btn-ghost" id="shortcutsPathBtn" aria-label="Keyboard shortcuts" style="font-size:.75rem;">⌨ Shortcuts</button>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { CURRENT=null; renderHome(); });
  document.getElementById('shortcutsPathBtn')?.addEventListener('click', openShortcuts);

  const tb = document.getElementById('tierBlocks');
  q.tiers.forEach((tier, ti) => {
    const anyDone = tier.objectives.some(o => o.status === 'complete');
    const allDone = tier.objectives.every(o => o.status === 'complete');
    const tc = tier.color;

    const block = document.createElement('div');
    block.className = 'tier-block';
    block.style.setProperty('--tc', tc);
    block.innerHTML = `
      <div class="tier-line" style="--tc:${tc}"></div>
      <div class="tier-head">
        <div class="tier-dot ${anyDone?'lit':''}" style="--tc:${tc}" aria-hidden="true"></div>
        <div class="tier-head-text">
          <h2>${tier.name}</h2>
          <div class="tier-sub">${tier.sub}</div>
        </div>
      </div>
      <div class="obj-list" role="list" aria-label="${tier.name} tier challenges">
        ${tier.objectives.map((obj, oi) => renderNodeHTML(obj, ti, oi, tc)).join('')}
      </div>
    `;
    tb.appendChild(block);
  });

  // Bind active node clicks
  pv.querySelectorAll('.obj-node.active').forEach(node => {
    const ti = parseInt(node.dataset.ti);
    const oi = parseInt(node.dataset.oi);
    node.addEventListener('click', () => openChallenge(ti, oi));
    node.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); openChallenge(ti, oi); } });
  });
}

function renderNodeHTML(obj, ti, oi, tc) {
  const isActive = obj.status === 'active';
  const isComplete = obj.status === 'complete';
  const isLocked = obj.status === 'locked';

  let marker = `${oi+1}`;
  if (isComplete) marker = '✓';

  const typeLabel = obj.challenge_type === 'mc' ? 'Multiple choice' : 'Open answer';
  const xpLabel = `${obj.xp || 50} XP`;
  const scoreLabel = obj.score != null ? ` · ${obj.score}%` : '';

  return `
    <div class="obj-node ${obj.status}"
      style="--tc:${tc}"
      role="listitem"
      ${isActive ? `tabindex="0" data-ti="${ti}" data-oi="${oi}"` : ''}
      aria-label="${obj.title} — ${isComplete ? 'Complete' : isLocked ? 'Locked' : 'Ready'}"
      ${isLocked ? 'aria-disabled="true"' : ''}>
      <div class="node-marker" aria-hidden="true">${marker}</div>
      <div class="node-body">
        <div class="node-title">${escHtml(obj.title)}</div>
        <div class="node-meta">${typeLabel} · ${xpLabel}${scoreLabel}</div>
      </div>
      ${isComplete && obj.score!=null ? `<div class="node-score" aria-label="Score: ${obj.score}%">${obj.score}%</div>` : ''}
      ${isActive ? `<div style="color:var(--tc,var(--gold));font-size:.8rem;font-family:'Cinzel',serif;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0;">Open →</div>` : ''}
    </div>
  `;
}

function renderCompletionBanner() {
  const q = CURRENT;
  return `
    <div class="completion-banner" role="region" aria-label="Quest complete">
      <div style="font-size:2.5rem;margin-bottom:12px">🏆</div>
      <h2>Quest Complete!</h2>
      <div class="xp-big">${q.xp} XP Earned</div>
      <p>You've forged mastery of <em>${escHtml(q.topic)}</em> — Ore to Gold. The skills are yours to keep.<br>
      Visit <a href="https://shop.artistrystore.com" target="_blank" rel="noopener">shop.artistrystore.com</a> for more tools to level up your life.</p>
      <button class="btn-forge" onclick="CURRENT=null;renderHome();" style="margin-top:20px;padding:14px 28px;">Forge a New Path</button>
    </div>
  `;
}

// ─────────────────────────────────────────────
//  CHALLENGE MODAL
// ─────────────────────────────────────────────
function openChallenge(tierIdx, objIdx) {
  const q = CURRENT;
  const tier = q.tiers[tierIdx];
  const obj = tier.objectives[objIdx];
  ACTIVE_NODE = { tierIdx, objIdx };

  const tc = tier.color;
  const isMC = obj.challenge_type === 'mc';

  const body = document.getElementById('modalBody');
  body.style.setProperty('--tc', tc);

  body.innerHTML = `
    <button class="modal-close" id="modalClose" aria-label="Close challenge">✕</button>
    <div class="tier-tag">${tier.name} Tier</div>
    <h3 id="modalTitle">${escHtml(obj.title)}</h3>
    <div class="concept-box" role="note" aria-label="Concept">${escHtml(obj.concept)}</div>
    <div class="challenge-label">Your Challenge</div>
    <p class="challenge-prompt">${escHtml(obj.prompt)}</p>
    ${isMC ? renderMCOptions(obj) : renderOpenInput(obj)}
    <div id="feedbackArea"></div>
    <div class="modal-actions" id="modalActions">
      ${isMC ? '' : `
        <button class="btn-ghost hint-toggle" id="hintBtn" aria-expanded="false" aria-controls="hintBox" style="margin-right:auto">💡 Hint</button>
        <div id="hintBox" class="hint-box hidden" role="note">${escHtml(obj.hint || 'Think about what the concept says — apply it directly to the question.')}</div>
        <button class="btn-forge" id="submitBtn" style="padding:14px 24px;">Submit Answer</button>
      `}
    </div>
  `;

  document.getElementById('modalOverlay').classList.remove('hidden');
  MODAL_OPEN = true;
  setTimeout(() => {
    const close = document.getElementById('modalClose');
    close?.focus();
  }, 50);

  document.getElementById('modalClose').addEventListener('click', closeModal);

  if (isMC) {
    body.querySelectorAll('.mc-option').forEach(btn => {
      btn.addEventListener('click', () => handleMCAnswer(parseInt(btn.dataset.idx), obj, tierIdx, objIdx));
    });
  } else {
    document.getElementById('hintBtn')?.addEventListener('click', () => {
      const hb = document.getElementById('hintBox');
      const btn = document.getElementById('hintBtn');
      const open = !hb.classList.contains('hidden');
      hb.classList.toggle('hidden');
      btn.setAttribute('aria-expanded', String(!open));
    });
    document.getElementById('submitBtn')?.addEventListener('click', () => handleOpenAnswer(obj, tierIdx, objIdx));
    document.getElementById('openAnswer')?.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) handleOpenAnswer(obj, tierIdx, objIdx);
    });
  }
}

function renderMCOptions(obj) {
  return `
    <div class="mc-options" role="group" aria-label="Answer choices">
      ${(obj.options||[]).map((opt, i) => `
        <button class="mc-option" data-idx="${i}" aria-label="Option ${String.fromCharCode(65+i)}: ${escHtml(opt)}">${String.fromCharCode(65+i)}. ${escHtml(opt)}</button>
      `).join('')}
    </div>
  `;
}

function renderOpenInput(obj) {
  return `
    <label for="openAnswer" class="sr-only">Your answer</label>
    <textarea id="openAnswer" class="answer-input" placeholder="Write your answer here... (Ctrl+Enter to submit)" aria-describedby="charCount" rows="5"></textarea>
    <div id="charCount" aria-live="polite" class="sr-only">Character count will update as you type</div>
  `;
}

// ─────────────────────────────────────────────
//  ANSWER HANDLERS
// ─────────────────────────────────────────────
function handleMCAnswer(idx, obj, tierIdx, objIdx) {
  const btns = document.querySelectorAll('.mc-option');
  btns.forEach(b => b.disabled = true);

  const correct = obj.correct_index ?? 0;
  btns[idx].classList.add(idx === correct ? 'chosen-correct' : 'chosen-wrong');
  if (idx !== correct) btns[correct].classList.add('reveal-correct');

  const isCorrect = idx === correct;
  const score = isCorrect ? 100 : Math.max(20, 60 - (obj.attempts * 20));

  const fb = document.getElementById('feedbackArea');
  const verdict = isCorrect ? 'advance' : 'retry';
  fb.innerHTML = renderFeedbackHTML(
    verdict,
    score,
    isCorrect
      ? `Correct! ${escHtml(obj.concept.split('.')[0])}.`
      : `Not quite — the correct answer is <strong>${String.fromCharCode(65+correct)}. ${escHtml(obj.options[correct])}</strong>. Review the concept above and try the next challenge.`
  );

  const actions = document.getElementById('modalActions');
  if (isCorrect) {
    actions.innerHTML = `<button class="btn-forge" id="advanceBtn" style="padding:14px 24px;">Advance →</button>`;
    document.getElementById('advanceBtn').addEventListener('click', () => {
      CURRENT = advanceQuest(CURRENT, tierIdx, objIdx, score);
      closeModal();
      renderPath();
      toast(`+${obj.xp || 50} XP — ${TIER_META[tierIdx].name} challenge complete! 🔥`, 'success');
    });
  } else {
    obj.attempts = (obj.attempts||0) + 1;
    Store.saveQuest(CURRENT);
    actions.innerHTML = `<button class="btn-forge" id="closeBtn" style="padding:14px 24px;">Try Next</button>`;
    document.getElementById('closeBtn').addEventListener('click', closeModal);
  }

  fb.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

async function handleOpenAnswer(obj, tierIdx, objIdx) {
  const ta = document.getElementById('openAnswer');
  const answer = ta?.value.trim();

  if (!answer || answer.length < 10) {
    toast('Write at least a sentence or two!', 'warning');
    ta?.focus();
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = `<span class="spinner-mini" aria-hidden="true"></span> Evaluating...`;

  try {
    const tier = CURRENT.tiers[tierIdx];
    const result = await evaluateOpenAnswer(CURRENT.topic, tier.name, obj, answer);

    const fb = document.getElementById('feedbackArea');
    fb.innerHTML = renderFeedbackHTML(result.verdict, result.score, result.feedback);

    const actions = document.getElementById('modalActions');
    obj.attempts = (obj.attempts||0) + 1;

    if (result.verdict === 'advance') {
      CURRENT = advanceQuest(CURRENT, tierIdx, objIdx, result.score);
      actions.innerHTML = `<button class="btn-forge" id="advanceBtn" style="padding:14px 24px;">Advance →</button>`;
      document.getElementById('advanceBtn').addEventListener('click', () => {
        closeModal();
        renderPath();
        toast(`+${obj.xp || 50} XP — ${TIER_META[tierIdx].name} challenge complete! 🔥`, 'success');
      });
    } else if (result.verdict === 'retry') {
      Store.saveQuest(CURRENT);
      ta.value = '';
      ta.focus();
      actions.innerHTML = `
        <button class="btn-ghost" id="hintBtn2" style="margin-right:auto" aria-controls="hintBox">💡 Hint</button>
        <div id="hintBox" class="hint-box hidden">${escHtml(obj.hint||'Re-read the concept and try again.')}</div>
        <button class="btn-forge" id="submitBtn" style="padding:14px 24px;">Try Again</button>
      `;
      document.getElementById('submitBtn').addEventListener('click', () => handleOpenAnswer(obj, tierIdx, objIdx));
      document.getElementById('hintBtn2').addEventListener('click', () => {
        const hb = document.getElementById('hintBox');
        hb.classList.toggle('hidden');
      });
    } else {
      // remedial — still allow retry
      Store.saveQuest(CURRENT);
      ta.value = '';
      ta.focus();
      actions.innerHTML = `
        <button class="btn-ghost" id="closeBtn2" style="margin-right:auto">Close</button>
        <button class="btn-forge" id="submitBtn" style="padding:14px 24px;">Try Again</button>
      `;
      document.getElementById('submitBtn').addEventListener('click', () => handleOpenAnswer(obj, tierIdx, objIdx));
      document.getElementById('closeBtn2').addEventListener('click', closeModal);
    }

    fb.scrollIntoView({ behavior:'smooth', block:'nearest' });

  } catch(err) {
    console.error('evaluateOpenAnswer error:', err);
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Submit Answer';
    toast('Evaluation failed — check your connection and try again.', 'error');
  }
}

function renderFeedbackHTML(verdict, score, feedbackText) {
  const labels = { advance: '✓ Excellent', retry: '◈ Almost There', remedial: '⚑ Needs Review' };
  return `
    <div class="feedback-box verdict-${verdict}" role="region" aria-live="polite" aria-label="Feedback">
      <div class="feedback-head">
        <span class="vlabel">${labels[verdict] || verdict}</span>
        ${score!=null ? `<span class="score">${score}%</span>` : ''}
      </div>
      <p class="feedback-text">${feedbackText}</p>
    </div>
  `;
}

// ─────────────────────────────────────────────
//  MODAL CONTROL
// ─────────────────────────────────────────────
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  MODAL_OPEN = false;
  ACTIVE_NODE = null;
  // Return focus to the last active node
  const active = document.querySelector('.obj-node.active');
  active?.focus();
}

// Focus trap
document.getElementById('modalOverlay').addEventListener('keydown', e => {
  if (!MODAL_OPEN) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
  if (e.key === 'Tab') {
    const modal = document.getElementById('modalBody');
    const focusable = [...modal.querySelectorAll('button:not([disabled]),textarea,input,[tabindex="0"]')];
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length-1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// Click backdrop to close
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

//  SHORTCUTS PANEL

  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <button class="modal-close" id="modalClose" aria-label="Close shortcuts">✕</button>
    <div class="shortcuts-panel">
      <h3 id="modalTitle">⌨ Keyboard Shortcuts</h3>
      <div class="sc-row"><span>Open active challenge</span><kbd>Enter</kbd></div>
      <div class="sc-row"><span>Close modal</span><kbd>Esc</kbd></div>
      <div class="sc-row"><span>Submit open answer</span><kbd>Ctrl</kbd> + <kbd>Enter</kbd></div>
      <div class="sc-row"><span>Show shortcuts</span><kbd>?</kbd></div>
      <div class="sc-row"><span>Go back to home</span><kbd>Backspace</kbd> (on path view)</div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.remove('hidden');
  MODAL_OPEN = true;
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalClose').focus();
}

// ─────────────────────────────────────────────
//  GLOBAL KEYBOARD SHORTCUTS
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  if (e.key === '?') { e.preventDefault(); openShortcuts(); }
  if (e.key === 'Backspace' && !MODAL_OPEN && CURRENT) { e.preventDefault(); CURRENT=null; renderHome(); }
});

// ─────────────────────────────────────────────
//  UTILITY
// ─────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
function init() {
  document.getElementById('forgeBtn').addEventListener('click', startForge);
  document.getElementById('topicInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startForge();
  });
  document.getElementById('shortcutsHomeBtn').addEventListener('click', openShortcuts);

  // First-run hint
  if (!localStorage.getItem('qf_onboarded')) {
    setTimeout(() => {
      toast('⚒ Type any topic to start your quest — Ore to Gold!', 'info');
      localStorage.setItem('qf_onboarded', '1');
    }, 800);
  }

  renderHome();
}

init();
</script>
</body>
</html>
