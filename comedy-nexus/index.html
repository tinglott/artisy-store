<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Comedy Nexus 😂 | 603 Clean Jokes</title>
<style>
:root{
  --bg:#060608;--bg2:#0e0e12;--bg3:#14141a;--bg4:#1a1a22;
  --yellow:#FFE500;--pink:#FF2D6B;--cyan:#00F5C4;--purple:#A855F7;
  --white:#F2F2F2;--muted:#888;--dim:#333;--border:#1e1e26;
  --card-h:420px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}

/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-emoji{font-size:26px;animation:flicker 3s infinite}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}96%{opacity:1}97%{opacity:.3}98%{opacity:1}}
.logo-text{font-weight:900;font-size:18px;letter-spacing:3px;color:var(--yellow);text-shadow:0 0 12px rgba(255,229,0,.4)}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px}
.search-wrap{flex:1;min-width:160px}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--white);font-size:14px;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--yellow)}
.search-wrap input::placeholder{color:var(--muted)}
.nav-btns{display:flex;gap:8px;flex-shrink:0}
.nav-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--white);cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
.nav-btn:hover,.nav-btn.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.nav-btn .badge{background:var(--pink);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:700}

/* STATS BAR */
.stats-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.stat{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.stat strong{color:var(--white)}
.stat.laughs strong{color:var(--cyan)}
.stat.groans strong{color:var(--pink)}

/* CATEGORY PILLS */
.cat-wrap{padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cat-wrap::-webkit-scrollbar{display:none}
.pill{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;transition:all .2s;margin-right:6px;white-space:nowrap;color:var(--muted);font-weight:500}
.pill:hover{border-color:var(--yellow);color:var(--yellow)}
.pill.active{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:700}
.pill-all{background:var(--bg3);border:1px solid var(--yellow);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--yellow);font-weight:700;margin-right:6px}
.pill-all.active{background:var(--yellow);color:#000}

/* MAIN CONTENT */
.main{padding:24px 16px;max-width:500px;margin:0 auto}

/* CARD STACK */
.deck{position:relative;height:var(--card-h);margin-bottom:20px}
.ghost{position:absolute;left:50%;transform:translateX(-50%);border-radius:20px;background:var(--bg3);border:1px solid var(--border);transition:all .3s}
.ghost-2{width:82%;height:calc(var(--card-h) - 40px);top:20px;opacity:.3}
.ghost-1{width:90%;height:calc(var(--card-h) - 20px);top:10px;opacity:.6}
.joke-card{position:absolute;top:0;left:0;right:0;min-height:var(--card-h);max-height:80vh;overflow-y:auto;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:28px 24px 20px;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,opacity .3s;user-select:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.joke-card.fly-left{transform:translateX(-120%) rotate(-15deg)!important;opacity:0;transition:transform .4s,opacity .4s}
.joke-card.fly-right{transform:translateX(120%) rotate(15deg)!important;opacity:0;transition:transform .4s,opacity .4s}
.joke-card.fly-up{transform:translateY(-120%)!important;opacity:0;transition:transform .3s,opacity .3s}

.card-cat{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;font-weight:600}
.card-setup{font-size:18px;line-height:1.5;font-weight:600;color:var(--white);flex:1}
.card-divider{border:none;border-top:1px dashed var(--border);margin:16px 0;opacity:.5}
.card-punchline{font-size:17px;line-height:1.5;color:var(--cyan);font-style:italic;font-weight:500;padding:12px;background:rgba(0,245,196,.05);border-radius:10px;border:1px solid rgba(0,245,196,.15)}
.card-punchline.hidden{display:none}
.tap-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:12px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.card-actions{display:flex;align-items:center;gap:8px;margin-top:16px;justify-content:center}
.act-btn{background:var(--bg4);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;transition:all .2s;color:var(--white);flex-shrink:0}
.act-btn:hover{transform:scale(1.1)}
.act-btn.laugh{background:rgba(0,245,196,.1);border-color:rgba(0,245,196,.3);color:var(--cyan);flex:1;font-weight:700}
.act-btn.laugh:hover{background:var(--cyan);color:#000}
.act-btn.groan{background:rgba(255,45,107,.1);border-color:rgba(255,45,107,.3);color:var(--pink);flex:1;font-weight:700}
.act-btn.groan:hover{background:var(--pink);color:#fff}
.act-btn.fav.loved{color:var(--yellow);border-color:var(--yellow)}

/* SWIPE HINT */
.swipe-hint{display:flex;justify-content:space-between;padding:0 8px;margin-bottom:8px;font-size:11px;color:var(--dim)}

/* NAV BUTTONS */
.nav-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}
.nav-arrow{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 18px;color:var(--white);cursor:pointer;font-size:14px;transition:all .2s;font-weight:600}
.nav-arrow:hover{background:var(--yellow);color:#000;border-color:var(--yellow)}
.nav-arrow:disabled{opacity:.3;cursor:default}
.card-counter{font-size:13px;color:var(--muted);min-width:80px;text-align:center}

/* RANDOM BTN */
.random-btn{width:100%;background:linear-gradient(135deg,var(--purple),var(--pink));border:none;border-radius:12px;padding:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;letter-spacing:1px;margin-bottom:20px}
.random-btn:hover{opacity:.85}

/* FAVORITES PANEL */
.fav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;backdrop-filter:blur(4px)}
.fav-overlay.open{display:block}
.fav-panel{position:fixed;right:0;top:0;bottom:0;width:min(380px,100vw);background:var(--bg2);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s}
.fav-panel.open{transform:none}
.fav-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.fav-title{font-size:16px;font-weight:700;color:var(--yellow)}
.fav-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.fav-list{flex:1;overflow-y:auto;padding:12px}
.fav-item{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.fav-item:hover{border-color:var(--yellow)}
.fav-setup{font-size:13px;color:var(--white);margin-bottom:6px;font-weight:500}
.fav-punchline{font-size:12px;color:var(--cyan);font-style:italic}
.fav-cat{font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1px}
.fav-empty{text-align:center;padding:40px 20px;color:var(--muted)}
.fav-empty-emoji{font-size:48px;margin-bottom:12px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--white);z-index:300;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* NO RESULTS */
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
.no-results .emoji{font-size:48px;margin-bottom:12px}

@media(max-width:420px){
  .logo-text{font-size:15px}
  .card-setup{font-size:16px}
  .act-btn.laugh,.act-btn.groan{font-size:12px;padding:8px 6px}
}
</style>
</head>

ng on.' \n\nAfter the tests, the doctor said, 'I've got some good news and some bad news.'", "punchline": "'The bad news is you've got a bad case of fatigue,' said the doctor. 'The good news is, you can sleep on it.'", "category": "Story Jokes"}, {"setup": "A woman brought a pillow to the party. \n\nWhen someone asked her why, she said, 'I wanted to have a soft landing in case the conversation got too hard.' \n\nEveryone laughed.", "punchline": "It was a down-to-earth approach to socializing.", "category": "Story Jokes"}, {"setup": "A group of friends decided to go on a road trip. \n\nAs they were driving, they came across a cow crossing the road. \n\nOne of them asked, 'Why did the cow cross the road?'", "punchline": "'To get to the udder side,' said another friend, milking the joke for all it was worth.", "category": "Story Jokes"}, {"setup": "An elderly man went to the doctor and said, 'Doc, I've been having some problems with my memory.' \n\nThe doctor said, 'Let's run some tests and see what's going on.' \n\nAfter the tests, the doctor said, 'I've got some good news and some bad news.'", "punchline": "'The bad news is you've got a bad case of forgetfulness,' said the doctor. 'The good news is, you'll forget all about it – oh wait, you already did.'", "category": "Story Jokes"}];

// State
let filtered = [...JOKES];
let current = 0;
let revealed = false;
let activeCat = 'All';
let searchQ = '';
let voices = [];
let isSpeaking = false;
let touchStartX = 0, touchStartY = 0;
let mouseStartX = 0, isDragging = false;

// Stats
let laughs = parseInt(localStorage.getItem('cn-laughs')||'0');
let groans = parseInt(localStorage.getItem('cn-groans')||'0');
let favorites = JSON.parse(localStorage.getItem('cn-favs')||'[]');

// Voice loading
function loadVoices() {
  voices = speechSynthesis.getVoices();
}
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);

function getBritishVoice() {
  const all = voices.length ? voices : speechSynthesis.getVoices();
  // Priority: explicit male British names
  const maleNames = ['Google UK English Male','Daniel','Arthur','Microsoft George','Microsoft Ryan','en-GB-News-N'];
  for (const p of maleNames) {
    const v = all.find(v => v.name.includes(p));
    if (v) return v;
  }
  // Filter out female voices explicitly
  const nonFemale = all.filter(v => !v.name.match(/female|Hazel|Fiona|Kate|Zira|Susan|Samantha|Karen|Moira|Tessa|Nicky|Female/i));
  return nonFemale.find(v => v.lang === 'en-GB')
      || nonFemale.find(v => v.lang.startsWith('en-GB'))
      || nonFemale.find(v => v.lang.startsWith('en'))
      || all[0] || null;
}

function speak(text) {
  speechSynthesis.cancel();
  setTimeout(() => {
    const utt = new SpeechSynthesisUtterance(text);
    const v = getBritishVoice();
    if (v) utt.voice = v;
    utt.rate = 0.88; utt.pitch = 1.05; utt.volume = 1;
    speechSynthesis.speak(utt);
  }, 150);
}

// Filter
function applyFilter() {
  filtered = JOKES.filter(j => {
    const catOk = activeCat === 'All' || j.category === activeCat;
    const q = searchQ.toLowerCase();
    const qOk = !q || j.setup.toLowerCase().includes(q) || j.punchline.toLowerCase().includes(q);
    return catOk && qOk;
  });
  current = 0;
  if (filtered.length === 0) {
    document.getElementById('deck').style.display = 'none';
    document.getElementById('no-results').style.display = 'block';
    document.getElementById('counter').textContent = '0 / 0';
  } else {
    document.getElementById('deck').style.display = 'block';
    document.getElementById('no-results').style.display = 'none';
    renderCard();
  }
}

function selectCat(btn) {
  document.querySelectorAll('.pill,.pill-all').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  applyFilter();
}

function onSearch() {
  searchQ = document.getElementById('search-input').value;
  applyFilter();
}

// Render
function renderCard() {
  if (!filtered.length) return;
  const joke = filtered[current];
  revealed = false;

  document.getElementById('card-cat').textContent = joke.category;
  document.getElementById('card-setup').innerHTML = joke.setup.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');

  const pl = document.getElementById('card-punchline');
  pl.textContent = joke.punchline || '';

  if (joke.punchline && joke.punchline.trim()) {
    pl.classList.add('hidden');
    pl.style.display = '';
    document.getElementById('tap-hint').style.display = '';
    document.getElementById('card-divider').style.display = 'none';
  } else {
    // One-liner — full joke is in setup, show badge
    pl.textContent = '✨ One-liner — the setup IS the punchline!';
    pl.classList.remove('hidden');
    pl.style.display = '';
    pl.style.color = 'var(--muted)';
    pl.style.fontSize = '13px';
    pl.style.fontStyle = 'italic';
    document.getElementById('tap-hint').style.display = 'none';
    document.getElementById('card-divider').style.display = '';
  }

  // Fav button
  const key = jokeKey(joke);
  document.getElementById('btn-fav').textContent = favorites.includes(key) ? '⭐' : '☆';
  document.getElementById('btn-fav').classList.toggle('loved', favorites.includes(key));

  // Counter
  document.getElementById('counter').textContent = `${current+1} / ${filtered.length}`;
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === filtered.length - 1;

  // Reset card position
  const card = document.getElementById('main-card');
  card.classList.remove('fly-left','fly-right','fly-up');
  card.style.transform = '';
  card.style.opacity = '';
}

function revealPunchline() {
  if (revealed) return;
  const joke = filtered[current];
  if (!joke?.punchline?.trim()) return;
  revealed = true;
  const pl = document.getElementById('card-punchline');
  const div = document.getElementById('card-divider');
  pl.style.display = '';
  pl.classList.remove('hidden');
  div.style.display = '';
  document.getElementById('tap-hint').style.display = 'none';
}

// Card tap (reveal)
document.getElementById('main-card').addEventListener('click', function(e) {
  if (e.target.closest('button')) return;
  revealPunchline();
});

// Swipe — touch
document.getElementById('main-card').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});

document.getElementById('main-card').addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    const card = document.getElementById('main-card');
    card.style.transform = `translateX(${dx}px) rotate(${dx*0.05}deg)`;
    card.style.transition = 'none';
  }
}, {passive: true});

document.getElementById('main-card').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const card = document.getElementById('main-card');
  card.style.transition = '';
  if (Math.abs(dx) > Math.abs(dy) + 10 && Math.abs(dx) > 70) {
    if (dx > 0) rateJoke('laugh');
    else rateJoke('groan');
  } else {
    card.style.transform = '';
    // Small tap = reveal
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      revealPunchline();
    }
  }
});

// Navigation
function nextJoke() {
  if (current < filtered.length - 1) {
    const card = document.getElementById('main-card');
    card.classList.add('fly-up');
    setTimeout(() => { current++; renderCard(); }, 300);
  }
}
function prevJoke() {
  if (current > 0) {
    current--;
    renderCard();
  }
}
function randomJoke() {
  current = Math.floor(Math.random() * filtered.length);
  renderCard();
  showToast('🎲 Random joke!');
}

// Rating
function rateJoke(type) {
  const card = document.getElementById('main-card');
  if (type === 'laugh') {
    laughs++;
    localStorage.setItem('cn-laughs', laughs);
    document.getElementById('laugh-count').textContent = laughs;
    card.classList.add('fly-right');
    showToast('😂 Hilarious!');
  } else {
    groans++;
    localStorage.setItem('cn-groans', groans);
    document.getElementById('groan-count').textContent = groans;
    card.classList.add('fly-left');
    showToast('💀 Terrible!');
  }
  setTimeout(() => {
    if (current < filtered.length - 1) { current++; }
    else { current = 0; }
    renderCard();
  }, 400);
}

// Favorites
function jokeKey(j) { return (j.setup || '').slice(0,40); }

function toggleFav() {
  if (!filtered.length) return;
  const joke = filtered[current];
  const key = jokeKey(joke);
  const idx = favorites.indexOf(key);
  if (idx === -1) {
    favorites.push(key);
    document.getElementById('btn-fav').textContent = '⭐';
    document.getElementById('btn-fav').classList.add('loved');
    showToast('⭐ Saved to favorites!');
  } else {
    favorites.splice(idx, 1);
    document.getElementById('btn-fav').textContent = '☆';
    document.getElementById('btn-fav').classList.remove('loved');
    showToast('Removed from favorites');
  }
  localStorage.setItem('cn-favs', JSON.stringify(favorites));
  updateFavBadge();
}

function updateFavBadge() {
  document.getElementById('fav-badge').textContent = favorites.length;
}

function openFavPanel() {
  const list = document.getElementById('fav-list');
  const favJokes = JOKES.filter(j => favorites.includes(jokeKey(j)));
  if (!favJokes.length) {
    list.innerHTML = '<div class="fav-empty"><div class="fav-empty-emoji">💔</div><div>No favorites yet!<br/>Rate some jokes to save them.</div></div>';
  } else {
    list.innerHTML = favJokes.map((j,i) => `
      <div class="fav-item" onclick="jumpToJoke('${jokeKey(j)}')">
        <div class="fav-cat">${j.category}</div>
        <div class="fav-setup">${j.setup}</div>
        ${j.punchline ? `<div class="fav-punchline">${j.punchline}</div>` : ''}
      </div>`).join('');
  }
  document.getElementById('fav-overlay').classList.add('open');
  document.getElementById('fav-panel').classList.add('open');
}

function closeFavPanel() {
  document.getElementById('fav-overlay').classList.remove('open');
  document.getElementById('fav-panel').classList.remove('open');
}

function jumpToJoke(key) {
  closeFavPanel();
  activeCat = 'All';
  searchQ = '';
  document.querySelectorAll('.pill,.pill-all').forEach(b => b.classList.remove('active'));
  document.querySelector('.pill-all').classList.add('active');
  document.getElementById('search-input').value = '';
  applyFilter();
  const idx = filtered.findIndex(j => jokeKey(j) === key);
  if (idx !== -1) { current = idx; renderCard(); }
}

// TTS
function speakJoke() {
  if (!filtered.length) return;
  const joke = filtered[current];
  const btn = document.getElementById('btn-tts');
  if (speechSynthesis.speaking) {
    speechSynthesis.cancel();
    btn.textContent = '🔊';
    return;
  }
  btn.textContent = '🔇';
  let text = joke.setup;
  if (joke.punchline && joke.punchline.trim()) {
    if (revealed) text += '. ' + joke.punchline;
  }
  // One-liners: setup is the full joke — read it all
  const utt = new SpeechSynthesisUtterance(text);
  const v = getBritishVoice();
  if (v) utt.voice = v;
  utt.rate = 0.88; utt.pitch = 1.05;
  utt.onend = () => { btn.textContent = '🔊'; };
  utt.onerror = () => { btn.textContent = '🔊'; };
  speechSynthesis.speak(utt);
}

// Share
function shareJoke() {
  if (!filtered.length) return;
  const joke = filtered[current];
  const text = joke.punchline ? `${joke.setup}\n\n${joke.punchline}` : joke.setup;
  navigator.clipboard.writeText(text).then(() => showToast('📋 Joke copied!')).catch(() => showToast('📋 Copy failed'));
}

// Toast
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// Init
updateFavBadge();
document.getElementById('laugh-count').textContent = laughs;
document.getElementById('groan-count').textContent = groans;
applyFilter();
</script>
