<!DOCTYPE html>

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {

            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }

        .content {

            transition: all 0.3s ease;
            text-decoration: none;
            margin: 10px;
        }
        .button-primary {
            background: #ff4757;
            color: white;
        }
        .button-primary:hover {
            background: #ff3838;
            transform: scale(1.05);
        }
        .email-form {
            max-width: 500px;
            margin: 30px auto;
            background: #f7f9fc;
            padding: 30px;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
        }
        .submit-btn {

</html>
