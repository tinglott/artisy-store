name: gumroad_upload
description: >
  Logs into Gumroad via browser session and creates or updates a product.
  Use --session ./sessions/gumroad.json to avoid re-logging in each run.
  First run: use --headless=false to log in manually; session is saved.

variables:
  product_name: "My Digital Product"
  product_price: "9.99"
  product_description: "Product description goes here."

steps:
  - type: goto
    url: "https://app.gumroad.com/products/new"

  - type: wait
    ms: 2000

  - type: ai_task
    goal: >
      If a login page appears, wait — the session should handle auth.
      Find the product name field and type "{{product_name}}".
      Find the price field and enter "{{product_price}}".
      Find the description area and enter "{{product_description}}".
      Click Save or Publish when done. Return "Product saved: {{product_name}}" as done.
    save_as: upload_result
