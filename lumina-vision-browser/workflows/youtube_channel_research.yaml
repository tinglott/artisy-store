name: youtube_channel_research
description: >
  Opens a YouTube channel, finds their latest video, and extracts the title,
  view count and upload date — entirely through the browser UI, no YouTube
  Data API key required.

variables:
  channel_url: "https://www.youtube.com/@tingsterlott"

steps:
  - type: goto
    url: "{{channel_url}}/videos"

  - type: wait
    ms: 2000

  - type: scroll
    direction: down
    amount: 600

  - type: ai_task
    goal: >
      Identify the most recently uploaded video on this channel's videos tab
      (it's the first video thumbnail in the grid). Click it, then read the
      title, view count, and upload date from the video page, and return
      them as your final "done" result in the format
      "Title | Views | Uploaded".
    save_as: latest_video_summary

  - type: extract
    save_as: full_page_text
