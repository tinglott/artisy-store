name: youtube_studio_upload
description: >
  Opens YouTube Studio and uploads a video file. Use a saved session
  (--session ./sessions/youtube.json) to stay logged in.
  First run: use --headless=false and log in manually.

variables:
  video_path: "/path/to/your/video.mp4"
  title: "Video Title"
  description: "Video description. Visit https://shop.artistrystore.com for free resources."
  tags: "sleep music, relaxation, stress relief"

steps:
  - type: goto
    url: "https://studio.youtube.com"

  - type: wait
    ms: 2000

  - type: ai_task
    goal: >
      Click the "Create" or "Upload videos" button in YouTube Studio.
      When the file picker appears, type the file path "{{video_path}}" into
      the file input. After the file starts uploading, fill in the title
      "{{title}}" and description "{{description}}". Add tags: "{{tags}}".
      Set visibility to Public. Click Save/Publish. Return "Uploaded: {{title}}" as done.
    save_as: upload_result
