<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentForge Workflows — Multi-Agent Orchestration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: #0f3460;
            border-right: 2px solid #d4af37;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h2 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }

        .agent-palette {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .agent-item {
            background: #16213e;
            border: 2px solid #d4af37;
            padding: 12px;
            border-radius: 6px;
            cursor: move;
            font-weight: 600;
            color: #d4af37;
            user-select: none;
            transition: all 0.2s;
        }

        .agent-item:hover {
            background: #1a2e4a;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .workflows-list {
            margin-top: 30px;
        }

        .workflow-item {
            background: #16213e;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            border-left: 4px solid #d4af37;
            transition: all 0.2s;
        }

        .workflow-item:hover {
            background: #1a2e4a;
        }

        .workflow-item.active {
            background: #1a2e4a;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        .btn {
            background: #d4af37;
            color: #0f3460;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn:hover {
            background: #f4d03f;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
        }

        .toolbar {
            background: #0f3460;
            border-bottom: 2px solid #d4af37;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar input {
            background: #16213e;
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 8px 12px;
            border-radius: 4px;
            flex: 1;
            min-width: 200px;
        }

        .toolbar input::placeholder {
            color: #888;
        }

        #canvas {
            flex: 1;
            background: linear-gradient(45deg, #1a1a2e 25%, transparent 25%, transparent 75%, #1a1a2e 75%, #1a1a2e),
                        linear-gradient(45deg, #1a1a2e 25%, transparent 25%, transparent 75%, #1a1a2e 75%, #1a1a2e);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-color: #16213e;
            position: relative;
            overflow: auto;
        }

        .node {
            position: absolute;
            background: #0f3460;
            border: 3px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            min-width: 180px;
            cursor: move;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s;
        }

        .node:hover {
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .node.selected {
            border-color: #ffff00;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.6);
        }

        .node-title {
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .node-type {
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }

        .node-inputs, .node-outputs {
            display: flex;
            gap: 5px;
            flex-direction: column;
            font-size: 11px;
        }

        .port {
            width: 10px;
            height: 10px;
            background: #d4af37;
            border-radius: 50%;
            cursor: pointer;
            position: absolute;
            transition: all 0.2s;
        }

        .port:hover {
            width: 12px;
            height: 12px;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
        }

        .port-in {
            left: -5px;
        }

        .port-out {
            right: -5px;
        }

        .connection {
            stroke: #d4af37;
            stroke-width: 2;
            fill: none;
            pointer-events: none;
        }

        /* Control Panel */
        .control-panel {
            width: 320px;
            background: #0f3460;
            border-left: 2px solid #d4af37;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }

        .control-panel.active {
            display: block;
        }

        .control-panel h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .control-group input, .control-group select, .control-group textarea {
            width: 100%;
            background: #16213e;
            border: 2px solid #d4af37;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .control-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: monospace;
        }

        /* Execution Log */
        .log-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            max-height: 300px;
            background: #0f3460;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .log-panel.active {
            display: block;
        }

        .log-entry {
            font-size: 12px;
            padding: 8px;
            margin-bottom: 5px;
            background: #16213e;
            border-radius: 4px;
            border-left: 3px solid #d4af37;
        }

        .log-entry.error {
            border-left-color: #ff4444;
            color: #ff8888;
        }

        .log-entry.success {
            border-left-color: #44ff44;
            color: #88ff88;
        }

        .log-entry.info {
            border-left-color: #d4af37;
            color: #d4af37;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f3460;
            border: 3px solid #d4af37;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #d4af37;
            background: none;
            border: none;
        }

        .close-modal:hover {
            color: #ffff00;
        }

        /* Execution Status */
        .status-bar {
            background: #16213e;
            border-bottom: 2px solid #d4af37;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d4af37;
            font-size: 13px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #44ff44;
            margin-right: 8px;
        }

        .status-indicator.idle {
            background: #999;
        }

        .status-indicator.running {
            background: #ffff00;
            animation: pulse 0.8s infinite;
        }

        .status-indicator.error {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .svg-container svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>🤖 Agents</h2>
            <div class="agent-palette">
                <div class="agent-item" draggable="true" data-agent="content-creator">
                    📝 Content Creator
                </div>
                <div class="agent-item" draggable="true" data-agent="data-analyzer">
                    📊 Data Analyzer
                </div>
                <div class="agent-item" draggable="true" data-agent="email-sender">
                    ✉️ Email Sender
                </div>
                <div class="agent-item" draggable="true" data-agent="social-poster">
                    🔗 Social Poster
                </div>
                <div class="agent-item" draggable="true" data-agent="lead-nurture">
                    🎯 Lead Nurture
                </div>
                <div class="agent-item" draggable="true" data-agent="product-builder">
                    🛠️ Product Builder
                </div>
            </div>

            <button class="btn" onclick="newWorkflow()">+ New Workflow</button>
            <button class="btn btn-sm" onclick="showSettings()">⚙️ Settings</button>
            <button class="btn btn-sm" onclick="toggleLog()">📋 Show Log</button>

            <h2 style="margin-top: 30px;">📚 Workflows</h2>
            <div class="workflows-list" id="workflowsList"></div>
        </div>

        <!-- Canvas -->
        <div class="canvas-area">
            <div class="status-bar">
                <div>
                    <span class="status-indicator idle" id="statusIndicator"></span>
                    <span id="statusText">Ready</span>
                </div>
                <div>
                    <button class="btn btn-sm" onclick="runWorkflow()">▶️ Execute</button>
                    <button class="btn btn-sm" onclick="saveWorkflow()">💾 Save</button>
                </div>
            </div>
            <div class="toolbar">
                <input type="text" id="workflowName" placeholder="Workflow Name...">
                <button class="btn btn-sm" onclick="addTrigger()">⏰ Add Trigger</button>
            </div>
            <div id="canvas">
                <svg class="svg-container" id="connectionsSVG">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                            <polygon points="0 0, 10 3, 0 6" fill="#d4af37"/>
                        </marker>
                    </defs>
                </svg>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel" id="controlPanel">
            <button class="close-modal" onclick="closeControlPanel()">×</button>
            <h3>Node Properties</h3>
            <div id="nodeProperties"></div>
        </div>
    </div>

    <!-- Execution Log -->
    <div class="log-panel" id="logPanel">
        <h3>📋 Execution Log</h3>
        <div id="logContent"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeSettings()">×</button>
            <h2>⚙️ Settings</h2>
            <div class="control-group">
                <label>Grok API Key</label>
                <input type="password" id="grokKey" placeholder="xai-...">
            </div>
            <div class="control-group">
                <label>Supabase Project URL</label>
                <input type="text" id="supabaseUrl" placeholder="https://xxxxx.supabase.co">
            </div>
            <div class="control-group">
                <label>Supabase Anon Key</label>
                <input type="password" id="supabaseKey" placeholder="eyJhbGc...">
            </div>
            <button class="btn" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>

    <script>
        // State
        const state = {
            workflows: [],
            currentWorkflow: null,
            nodes: [],
            connections: [],
            settings: {
                grokKey: localStorage.getItem('grokKey') || '',
                supabaseUrl: localStorage.getItem('supabaseUrl') || '',
                supabaseKey: localStorage.getItem('supabaseKey') || ''
            },
            executionLog: []
        };

        const AGENTS = {
            'content-creator': {
                title: '📝 Content Creator',
                description: 'Generate content using Grok',
                inputs: ['topic', 'style', 'length'],
                outputs: ['content'],
                color: '#d4af37'
            },
            'data-analyzer': {
                title: '📊 Data Analyzer',
                description: 'Analyze data and extract insights',
                inputs: ['data', 'query'],
                outputs: ['analysis', 'insights'],
                color: '#d4af37'
            },
            'email-sender': {
                title: '✉️ Email Sender',
                description: 'Send emails via Emailit',
                inputs: ['recipient', 'subject', 'body'],
                outputs: ['status'],
                color: '#d4af37'
            },
            'social-poster': {
                title: '🔗 Social Poster',
                description: 'Post to social media',
                inputs: ['platform', 'content', 'hashtags'],
                outputs: ['post_id', 'status'],
                color: '#d4af37'
            },
            'lead-nurture': {
                title: '🎯 Lead Nurture',
                description: 'Manage lead nurture sequences',
                inputs: ['lead_id', 'sequence', 'day'],
                outputs: ['next_step'],
                color: '#d4af37'
            },
            'product-builder': {
                title: '🛠️ Product Builder',
                description: 'Create and update products',
                inputs: ['product_type', 'details'],
                outputs: ['product_id', 'url'],
                color: '#d4af37'
            }
        };

        // Initialize
        function init() {
            loadWorkflows();
            setupEventListeners();
            loadSettings();
        }

        // Event Listeners
        function setupEventListeners() {
            document.addEventListener('dragstart', handleDragStart);
            document.addEventListener('dragover', handleDragOver);
            document.addEventListener('drop', handleDrop);
            document.getElementById('canvas').addEventListener('click', handleCanvasClick);
        }

        function handleDragStart(e) {
            if (e.target.classList.contains('agent-item')) {
                e.dataTransfer.effectAllowed = 'copy';
                e.dataTransfer.setData('agentType', e.target.dataset.agent);
            }
        }

        function handleDragOver(e) {
            if (e.target.id === 'canvas' || e.target.closest('#canvas')) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            }
        }

        function handleDrop(e) {
            if (e.target.id === 'canvas' || e.target.closest('#canvas')) {
                e.preventDefault();
                const agentType = e.dataTransfer.getData('agentType');
                const canvas = document.getElementById('canvas');
                const x = e.clientX - canvas.getBoundingClientRect().left;
                const y = e.clientY - canvas.getBoundingClientRect().top;
                addNodeToCanvas(agentType, x, y);
            }
        }

        function handleCanvasClick(e) {
            if (e.target.id === 'canvas') {
                closeControlPanel();
            }
        }

        // Workflow Management
        function newWorkflow() {
            const name = prompt('Workflow name:');
            if (name) {
                const workflow = {
                    id: Date.now(),
                    name: name,
                    nodes: [],
                    connections: [],
                    trigger: null,
                    createdAt: new Date().toISOString()
                };
                state.workflows.push(workflow);
                state.currentWorkflow = workflow;
                state.nodes = [];
                state.connections = [];
                clearCanvas();
                updateWorkflowsList();
                document.getElementById('workflowName').value = name;
            }
        }

        function saveWorkflow() {
            if (!state.currentWorkflow) return;
            state.currentWorkflow.nodes = state.nodes.map(node => ({
                id: node.id,
                agentType: node.agentType,
                x: node.element.offsetLeft,
                y: node.element.offsetTop,
                config: node.config || {}
            }));
            state.currentWorkflow.connections = state.connections;
            localStorage.setItem('workflows', JSON.stringify(state.workflows));
            addLog('Workflow saved ✅', 'success');
        }

        function loadWorkflows() {
            const saved = localStorage.getItem('workflows');
            if (saved) {
                state.workflows = JSON.parse(saved);
                updateWorkflowsList();
            }
        }

        function updateWorkflowsList() {
            const list = document.getElementById('workflowsList');
            list.innerHTML = '';
            state.workflows.forEach(wf => {
                const item = document.createElement('div');
                item.className = 'workflow-item' + (state.currentWorkflow?.id === wf.id ? ' active' : '');
                item.textContent = wf.name;
                item.onclick = () => loadWorkflow(wf.id);
                list.appendChild(item);
            });
        }

        function loadWorkflow(workflowId) {
            const workflow = state.workflows.find(w => w.id === workflowId);
            if (workflow) {
                state.currentWorkflow = workflow;
                state.nodes = [];
                state.connections = workflow.connections || [];
                clearCanvas();
                document.getElementById('workflowName').value = workflow.name;
                
                // Redraw nodes
                workflow.nodes.forEach(nodeData => {
                    const node = {
                        id: nodeData.id,
                        agentType: nodeData.agentType,
                        config: nodeData.config || {},
                        element: null
                    };
                    const el = createNodeElement(nodeData.agentType, nodeData.x, nodeData.y, node.id);
                    node.element = el;
                    state.nodes.push(node);
                });
                
                redrawConnections();
                updateWorkflowsList();
            }
        }

        // Canvas Functions
        function addNodeToCanvas(agentType, x, y) {
            const nodeId = `node-${Date.now()}`;
            const node = {
                id: nodeId,
                agentType: agentType,
                config: {},
                element: null
            };
            const element = createNodeElement(agentType, x, y, nodeId);
            node.element = element;
            state.nodes.push(node);
        }

        function createNodeElement(agentType, x, y, nodeId) {
            const canvas = document.getElementById('canvas');
            const agent = AGENTS[agentType];
            const node = document.createElement('div');
            node.className = 'node';
            node.id = nodeId;
            node.style.left = x + 'px';
            node.style.top = y + 'px';

            let html = `<div class="node-title">${agent.title}</div>
                        <div class="node-type">${agent.description}</div>`;

            // Input ports
            if (agent.inputs.length > 0) {
                html += `<div class="node-inputs">`;
                agent.inputs.forEach((input, idx) => {
                    html += `<div style="position: relative;">
                                <div class="port port-in" style="top: ${40 + idx * 25}px;" data-type="input" data-port="${input}"></div>
                                <span style="margin-left: 15px; font-size: 11px; color: #999;">${input}</span>
                            </div>`;
                });
                html += `</div>`;
            }

            // Output ports
            if (agent.outputs.length > 0) {
                html += `<div class="node-outputs">`;
                agent.outputs.forEach((output, idx) => {
                    html += `<div style="position: relative; padding-right: 15px;">
                                <span style="font-size: 11px; color: #999;">${output}</span>
                                <div class="port port-out" style="top: ${40 + idx * 25}px;" data-type="output" data-port="${output}"></div>
                            </div>`;
                });
                html += `</div>`;
            }

            node.innerHTML = html;
            canvas.appendChild(node);

            // Make draggable
            makeDraggable(node, nodeId);

            // Click to select
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                selectNode(nodeId, agentType);
            });

            // Connect ports
            const ports = node.querySelectorAll('.port');
            ports.forEach(port => {
                port.addEventListener('click', (e) => {
                    e.stopPropagation();
                    initiateConnection(e, nodeId);
                });
            });

            return node;
        }

        function makeDraggable(element, nodeId) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            element.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
                redrawConnections();
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        function selectNode(nodeId, agentType) {
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            document.getElementById(nodeId).classList.add('selected');
            showNodeProperties(nodeId, agentType);
        }

        function showNodeProperties(nodeId, agentType) {
            const controlPanel = document.getElementById('controlPanel');
            const nodeProps = document.getElementById('nodeProperties');
            const node = state.nodes.find(n => n.id === nodeId);
            const agent = AGENTS[agentType];

            let html = `<h3>${agent.title}</h3>`;
            
            agent.inputs.forEach(input => {
                html += `<div class="control-group">
                            <label>${input}</label>
                            <input type="text" class="node-input" data-input="${input}" value="${node.config[input] || ''}">
                        </div>`;
            });

            html += `<button class="btn btn-sm" onclick="deleteNode('${nodeId}')">🗑️ Delete</button>`;

            nodeProps.innerHTML = html;

            // Save config on input
            nodeProps.querySelectorAll('.node-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    node.config[e.target.dataset.input] = e.target.value;
                });
            });

            controlPanel.classList.add('active');
        }

        function closeControlPanel() {
            document.getElementById('controlPanel').classList.remove('active');
        }

        function deleteNode(nodeId) {
            const node = document.getElementById(nodeId);
            if (node) node.remove();
            state.nodes = state.nodes.filter(n => n.id !== nodeId);
            state.connections = state.connections.filter(c => c.source !== nodeId && c.target !== nodeId);
            redrawConnections();
            closeControlPanel();
        }

        function clearCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.querySelectorAll('.node').forEach(n => n.remove());
        }

        // Connection Management
        let connectionStart = null;

        function initiateConnection(e, nodeId) {
            const port = e.target;
            const portType = port.dataset.type;
            
            if (!connectionStart) {
                connectionStart = { nodeId, portType, port };
                port.style.background = '#ffff00';
            } else {
                if (connectionStart.portType !== portType && connectionStart.nodeId !== nodeId) {
                    const connection = {
                        source: connectionStart.portType === 'output' ? connectionStart.nodeId : nodeId,
                        target: connectionStart.portType === 'output' ? nodeId : connectionStart.nodeId,
                        sourcePort: connectionStart.port.dataset.port,
                        targetPort: port.dataset.port
                    };
                    state.connections.push(connection);
                }
                connectionStart.port.style.background = '#d4af37';
                connectionStart = null;
                redrawConnections();
            }
        }

        function redrawConnections() {
            const svg = document.getElementById('connectionsSVG');
            svg.innerHTML = `<defs>
                                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                    <polygon points="0 0, 10 3, 0 6" fill="#d4af37"/>
                                </marker>
                            </defs>`;

            state.connections.forEach(conn => {
                const sourceEl = document.getElementById(conn.source);
                const targetEl = document.getElementById(conn.target);

                if (sourceEl && targetEl) {
                    const x1 = sourceEl.offsetLeft + sourceEl.offsetWidth;
                    const y1 = sourceEl.offsetTop + sourceEl.offsetHeight / 2;
                    const x2 = targetEl.offsetLeft;
                    const y2 = targetEl.offsetTop + targetEl.offsetHeight / 2;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    line.setAttribute('d', `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${y1}, ${x2} ${y2}`);
                    line.setAttribute('class', 'connection');
                    line.setAttribute('marker-end', 'url(#arrowhead)');
                    svg.appendChild(line);
                }
            });
        }

        // Execution
        async function runWorkflow() {
            if (!state.currentWorkflow || state.nodes.length === 0) {
                addLog('No workflow to execute', 'error');
                return;
            }

            setStatus('running');
            state.executionLog = [];
            addLog('▶️ Starting workflow execution...', 'info');

            try {
                for (const node of state.nodes) {
                    await executeNode(node);
                }
                setStatus('idle');
                addLog('✅ Workflow completed successfully', 'success');
            } catch (error) {
                setStatus('error');
                addLog(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function executeNode(node) {
            const agent = AGENTS[node.agentType];
            addLog(`→ Executing ${agent.title}...`, 'info');

            // Simulate execution (in production, call Grok API)
            const systemPrompt = `You are the ${agent.title} agent. Execute this task: ${JSON.stringify(node.config)}`;
            
            try {
                // For demo, simulate response
                const response = {
                    success: true,
                    output: `[${agent.title}] Task completed`
                };
                addLog(`✓ ${agent.title} completed`, 'success');
                return response;
            } catch (error) {
                addLog(`✗ ${agent.title} failed: ${error.message}`, 'error');
                throw error;
            }
        }

        // Settings
        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('grokKey').value = state.settings.grokKey;
            document.getElementById('supabaseUrl').value = state.settings.supabaseUrl;
            document.getElementById('supabaseKey').value = state.settings.supabaseKey;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            state.settings.grokKey = document.getElementById('grokKey').value;
            state.settings.supabaseUrl = document.getElementById('supabaseUrl').value;
            state.settings.supabaseKey = document.getElementById('supabaseKey').value;

            localStorage.setItem('grokKey', state.settings.grokKey);
            localStorage.setItem('supabaseUrl', state.settings.supabaseUrl);
            localStorage.setItem('supabaseKey', state.settings.supabaseKey);

            addLog('Settings saved ✅', 'success');
            closeSettings();
        }

        function loadSettings() {
            state.settings.grokKey = localStorage.getItem('grokKey') || '';
            state.settings.supabaseUrl = localStorage.getItem('supabaseUrl') || '';
            state.settings.supabaseKey = localStorage.getItem('supabaseKey') || '';
        }

        // Logging
        function addLog(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        function toggleLog() {
            document.getElementById('logPanel').classList.toggle('active');
        }

        // Status
        function setStatus(status) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            indicator.className = `status-indicator ${status}`;
            text.textContent = status === 'running' ? 'Executing...' : status === 'error' ? 'Error' : 'Ready';
        }

        // Trigger (placeholder)
        function addTrigger() {
            const trigger = prompt('Trigger type (manual/webhook/schedule):');
            if (trigger) {
                state.currentWorkflow.trigger = trigger;
                addLog(`Trigger set to: ${trigger}`, 'info');
            }
        }

        // Init
        init();
    </script>
</body>
</html>
