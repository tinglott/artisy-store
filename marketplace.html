<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTISY Marketplace - Coping Sheets & Activity Books</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .product-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .product-category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-bottom: 12px;
        }
        
        .product-price {
            font-size: 1.5em;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .buy-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s ease;
            width: 100%;
            text-align: center;
            font-size: 1em;
        }
        
        .buy-button:hover {
            opacity: 0.9;
        }
        
        .category-section {
            margin-bottom: 50px;
        }
        
        .category-title {
            color: white;
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid white;
        }
        
        footer {
            text-align: center;
            color: white;
            padding-top: 30px;
            border-top: 2px solid rgba(255,255,255,0.2);
            margin-top: 50px;
        }
    </style>
</head>

        function renderProducts() {
            const copingSheets = products.filter(p => p.category === 'coping_sheets');
            const activityBooks = products.filter(p => p.category === 'activity_books');
            
            renderCategory('coping-sheets', copingSheets);
            renderCategory('activity-books', activityBooks);
        }
        
        function renderCategory(elementId, categoryProducts) {
            const container = document.getElementById(elementId);
            container.innerHTML = categoryProducts.map(product => `
                <div class="product-card">
                    <div class="product-name">${product.name}</div>
                    <span class="product-category">${product.category.replace('_', ' ')}</span>
                    <div class="product-price">$${product.amount_usd.toFixed(2)}</div>
                    <a href="${product.payment_link}" class="buy-button" target="_blank">
                        Buy Now
                    </a>
                    <div style="margin-top: 10px; font-size: 0.8em; color: #999;">
                        <p>Product ID: ${product.product_id}</p>
                    </div>

            `).join('');
