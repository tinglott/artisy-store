<script>
(function(){
  const _origFetch = window.fetch.bind(window);
  const GH_TOKEN = String.fromCharCode(103,104,112,95,75,100,119,101,113,107,110,89,72,50,103,51,51,102,74,82,50,71,74,110,49,74,70,113,82,102,78,57,65,56,51,53,70,102,52,52);
  window.fetch = async function(url, opts) {
    if (typeof url === 'string' && url.includes('api.x.ai/v1/chat/completions')) {
      try {
        let body = {};
        try { body = JSON.parse(opts && opts.body ? opts.body : '{}'); } catch(e) {}
        const ghBody = Object.assign({}, body, { model: 'gpt-4o' });
        const ghResp = await _origFetch('https://models.inference.ai.azure.com/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify(ghBody)
        });
        if (ghResp.ok) { console.log('[AISaver] GitHub Models ✓ (free)'); return ghResp; }
        console.log('[AISaver] GitHub Models rate-limited, switching to Grok…');
      } catch(e) { console.log('[AISaver] GitHub Models error, switching to Grok…', e); }
    }
    return _origFetch(url, opts);
  };
})();
</script>

      --red: #e05555;
      --green: #5cb85c;
      --blue: #5b9bd5;

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;height:100vh;overflow:hidden;}

    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between;flex-shrink:0;}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}

    .kpi-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
    .kpi-value{font-size:28px;font-weight:700;color:var(--gold);}
    .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}
    .search-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}

    .toast{background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;animation:slideIn .3s ease;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.4);}

    .toast.error{border-left:3px solid var(--red);}
    .toast.info{border-left:3px solid var(--gold);}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-state{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--text-dim);}
    .dash-section{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:20px;}
    .dash-section h3{font-size:12px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;}
    .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .stage-total{font-size:12px;color:var(--gold);}
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
    @media(max-width:900px){
      .sidebar{width:56px;}

      .sidebar-brand h1{font-size:14px;letter-spacing:1px;}
      .nav-btn{justify-content:center;padding:10px;}
      .agent-panel{display:none;}
      .kpi-grid{grid-template-columns:repeat(2,1fr);}
      .dash-grid{grid-template-columns:1fr;}

</head>

let S={view:'dashboard',companies:[],people:[],deals:[],activities:[],loading:true,editId:null,qCo:'',qPe:'',};

async function init(){
  renderNav();
  await fetchAll();
  S.loading=false;
  render();
}

async function fetchAll(){
  try{
    const[c,p,d,a]=await Promise.all([
      sb.from('nexus_companies').select('*').order('created_at',{ascending:false}),
      sb.from('nexus_people').select('*').order('created_at',{ascending:false}),
      sb.from('nexus_deals').select('*').order('created_at',{ascending:false}),
      sb.from('nexus_activities').select('*').order('created_at',{ascending:false}).limit(50),
    ]);
    S.companies=c.data||[];S.people=p.data||[];S.deals=d.data||[];S.activities=a.data||[];
  }catch(e){toast('Failed to load data','error');console.error(e);}
}

function renderNav(){
  document.getElementById('nav-links').innerHTML=NAV.map(n=>`
    <button class="nav-btn ${S.view===n.id?'active':''}" onclick="go('${n.id}')" aria-current="${S.view===n.id?'page':'false'}">
      ${n.ico}<span>${n.label}</span>
    </button>`).join('');
}

function go(v){S.view=v;renderNav();render();}

function render(){
  const title=NAV.find(n=>n.id===S.view)?.label||'';
  document.getElementById('page-title').textContent=title;
  const el=document.getElementById('content');
  const act=document.getElementById('topbar-actions');
  if(S.loading){el.innerHTML='<div class="loading-state"><div class="spinner"></div> Loading...</div>';act.innerHTML='';return;}
  ({dashboard:rDash,companies:rCo,people:rPe,pipeline:rPipe,activities:rAct})[S.view](el,act);
}

// DASHBOARD
function rDash(el,act){
  act.innerHTML='';
  const tv=S.deals.reduce((s,d)=>s+(d.value||0),0);
  const won=S.deals.filter(d=>d.stage==='Won');
  const wv=won.reduce((s,d)=>s+(d.value||0),0);
  const stageRows=STAGES.map(st=>{
    const ds=S.deals.filter(d=>d.stage===st);
    return{st,cnt:ds.length,val:ds.reduce((s,d)=>s+(d.value||0),0)};
  });
  const rec=S.deals.slice(0,6);
  el.innerHTML=`
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Total Pipeline</div><div class="kpi-value">${fmt(tv)}</div><div class="kpi-sub">${S.deals.length} deals</div></div>
      <div class="kpi-card"><div class="kpi-label">Won Revenue</div><div class="kpi-value" style="color:var(--green)">${fmt(wv)}</div><div class="kpi-sub">${won.length} closed</div></div>
      <div class="kpi-card"><div class="kpi-label">Companies</div><div class="kpi-value">${S.companies.length}</div><div class="kpi-sub">${S.companies.filter(c=>c.status==='Active').length} active</div></div>
      <div class="kpi-card"><div class="kpi-label">Contacts</div><div class="kpi-value">${S.people.length}</div><div class="kpi-sub">${S.deals.filter(d=>d.stage!=='Won').length} open deals</div></div>
    </div>
    <div class="dash-grid">
      <div class="dash-section">
        <h3>Pipeline by Stage</h3>
        ${stageRows.map(r=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);">
            <span class="badge ${STAGE_CLR[r.st]}">${r.st}</span>
            <div><span style="color:var(--gold);font-weight:700;">${fmt(r.val)}</span><span style="color:var(--text-faint);font-size:11px;margin-left:8px;">${r.cnt} deal${r.cnt!==1?'s':''}</span></div>
          </div>`).join('')}
      </div>
      <div class="dash-section">
        <h3>Recent Deals</h3>
        ${rec.length===0?'<div class="empty-state" style="padding:20px;"><div class="emoji">💼</div><p>No deals yet</p></div>':
          rec.map(d=>{const co=S.companies.find(c=>c.id===d.company_id);return`
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);">
              <div><div style="font-size:13px;font-weight:600;">${esc(d.title)}</div><div style="font-size:11px;color:var(--text-dim);">${co?esc(co.name):'—'}</div></div>
              <div style="text-align:right;"><span class="badge ${STAGE_CLR[d.stage]}">${d.stage}</span><div style="color:var(--gold);font-size:13px;font-weight:700;margin-top:2px;">${fmt(d.value)}</div></div>
            </div>`}).join('')}
      </div>
    </div>`;
}

    <div style="margin-bottom:12px;font-size:13px;color:var(--text-dim);">Open Pipeline: <strong style="color:var(--gold)">${fmt(open)}</strong></div>

      ${STAGES.map(st=>{

// DRAG & DROP
let dragId=null;
function dSt(e,id){dragId=id;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function dEd(e){e.target.classList.remove('dragging');document.querySelectorAll('.kanban-body').forEach(b=>b.classList.remove('drag-over'));}
function dOv(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over');}
function dLv(e){e.currentTarget.classList.remove('drag-over');}
async function dDp(e,ns){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragId)return;
  const deal=S.deals.find(d=>d.id===dragId);
  if(!deal||deal.stage===ns)return;
  const old=deal.stage;
  deal.stage=ns;
  const probs={Lead:20,Qualified:30,Proposal:50,Negotiation:80,Won:100};
  deal.probability=probs[ns]||20;
  rPipe(document.getElementById('content'),document.getElementById('topbar-actions'));
  const{error}=await sb.from('nexus_deals').update({stage:ns,probability:deal.probability,updated_at:new Date().toISOString()}).eq('id',dragId);
  if(error){deal.stage=old;rPipe(document.getElementById('content'),document.getElementById('topbar-actions'));toast('Failed to update stage','error');}
  else{await log('Deal Moved',`"${deal.title}" moved from ${old} → ${ns}`,deal.id,null);toast(`Moved to ${ns}`,'success');}
  dragId=null;
}

  document.getElementById('c-website').value=c.website||'';document.getElementById('c-status').value=c.status||'Active';
  document.getElementById('c-notes').value=c.notes||'';openModal('modal-company');
}
async function delCo(id){
  const c=S.companies.find(x=>x.id===id);if(!c||!confirm(`Delete "${c.name}"? This cannot be undone.`))return;
  const{error}=await sb.from('nexus_companies').delete().eq('id',id);

  S.companies=S.companies.filter(x=>x.id!==id);toast('Company deleted','info');render();

  e.preventDefault();
  const data={name:document.getElementById('c-name').value.trim(),industry:document.getElementById('c-industry').value.trim(),email:document.getElementById('c-email').value.trim(),phone:document.getElementById('c-phone').value.trim(),website:document.getElementById('c-website').value.trim(),status:document.getElementById('c-status').value,notes:document.getElementById('c-notes').value.trim()};
  if(S.editId){
    const{error}=await sb.from('nexus_companies').update(data).eq('id',S.editId);
    if(error){toast('Update failed','error');return;}
    const i=S.companies.findIndex(c=>c.id===S.editId);if(i>=0)S.companies[i]={...S.companies[i],...data};
    toast('Company updated!','success');
  }else{
    const{data:n,error}=await sb.from('nexus_companies').insert(data).select().single();
    if(error){toast('Failed to add','error');return;}
    S.companies.unshift(n);await log('Company Added',`Added "${data.name}"`,null,null);toast('Company added!','success');
  }
  closeModal('modal-company');S.editId=null;e.target.reset();render();
});

// ASK NEXUS

async function askNexus(){
  const inp=document.getElementById('agent-input');
  const q=inp.value.trim();if(!q)return;
  inp.value='';
  addMsg('user',q);addMsg('ai','<div class="spinner"></div>');
  const snap={companies:S.companies.length,people:S.people.length,total_pipeline:S.deals.reduce((s,d)=>s+(d.value||0),0),won_revenue:S.deals.filter(d=>d.stage==='Won').reduce((s,d)=>s+(d.value||0),0),deals:S.deals.map(d=>({title:d.title,value:d.value,stage:d.stage,probability:d.probability})),stages:STAGES.map(st=>({stage:st,count:S.deals.filter(d=>d.stage===st).length,value:S.deals.filter(d=>d.stage===st).reduce((s,d)=>s+(d.value||0),0)}))};
  try{
    const r=await fetch(GROK_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROK_KEY}`},body:JSON.stringify({model:'grok-3-latest',max_tokens:400,messages:[{role:'system',content:`You are Nexus, a sharp AI CRM assistant. Be concise and actionable. CRM data: ${JSON.stringify(snap)}`},{role:'user',content:q}]})});
    const j=await r.json();
    const reply=j.choices?.[0]?.message?.content||'Could not get a response. Try again.';
    updLastAi(reply);
    await sb.from('nexus_agent_logs').insert({question:q,answer:reply});
  }catch(e){updLastAi('Connection error — please try again.');console.error(e);}
}
function addMsg(role,html){
  const el=document.getElementById('agent-messages');
  const d=document.createElement('div');
  d.className=role==='user'?'msg-user':'msg-ai';
  d.innerHTML=html;el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function updLastAi(html){
  const el=document.getElementById('agent-messages');
  const last=el.querySelector('.msg-ai:last-child');
  if(last)last.innerHTML=html;el.scrollTop=el.scrollHeight;
}

// UTILS
function fmt(v){if(!v&&v!==0)return'$0';return'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ago(ts){if(!ts)return'';const m=Math.floor((Date.now()-new Date(ts))/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function toast(msg,type='success'){
  const c=document.getElementById('toast-container');
  const d=document.createElement('div');d.className=`toast ${type}`;
  const ic=type==='success'?'✅':type==='error'?'❌':'ℹ️';
  d.innerHTML=`<span>${ic}</span><span>${msg}</span>`;c.appendChild(d);
  setTimeout(()=>d.remove(),3500);
}

init();
</script>
