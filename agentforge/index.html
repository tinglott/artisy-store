<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AgentForge — App Gallery by T. Lott Creative</title>
<style>
  :root {
    --cream: #fdf6ec;
    --warm: #f5e6d0;
    --gold: #c9a84c;
    --gold-dark: #a07830;
    --charcoal: #2c2417;
    --brown: #6b4c2a;
    --text: #3a2a10;
    --muted: #8a7560;
    --card-bg: #fff9f0;
    --border: #e8d5b0;
    --shadow: 0 4px 24px rgba(100,70,20,0.10);
    --shadow-hover: 0 8px 40px rgba(100,70,20,0.18);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #2c1a08 0%, #4a2e10 40%, #6b4010 100%);
    color: #fff;
    padding: 60px 24px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 60% 40%, rgba(201,168,76,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(201,168,76,0.2);
    border: 1px solid rgba(201,168,76,0.5);
    color: #e8c96a;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 5px 16px;
    border-radius: 100px;
    margin-bottom: 20px;
    font-family: sans-serif;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .hero h1 span { color: #e8c96a; }
  .hero p {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.78);
    max-width: 560px;
    margin: 0 auto 30px;
    font-style: italic;
  }
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 36px;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    display: block;
    font-size: 1.8rem;
    font-weight: 700;
    color: #e8c96a;
    line-height: 1;
  }
  .stat-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    font-family: sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* NAV BAR */
  .nav-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .site-link {
    color: var(--gold-dark);
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    font-family: sans-serif;
  }
  .site-link:hover { color: var(--gold); }
  .search-wrap {
    flex: 1;
    max-width: 380px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1.5px solid var(--border);
    border-radius: 100px;
    font-size: 0.9rem;
    background: var(--cream);
    color: var(--text);
    font-family: sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap .icon {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1rem;
  }
  .app-count {
    font-family: sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* FILTERS */
  .filters {
    padding: 20px 24px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
  }
  .filter-btn {
    padding: 8px 18px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-size: 0.82rem;
    font-family: sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .filter-btn:hover { border-color: var(--gold); color: var(--gold-dark); }
  .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
    font-weight: 600;
  }

  /* GRID */
  .gallery {
    max-width: 1200px;
    margin: 24px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  /* CARD */
  .app-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
  }
  .app-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }
  .card-image {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #e8d5b0, #f5e6d0);
  }
  .card-image-placeholder {
    width: 100%;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .card-body {
    padding: 18px 18px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-category {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-dark);
    font-family: sans-serif;
    font-weight: 700;
    margin-bottom: 7px;
  }
  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 0.86rem;
    color: var(--muted);
    line-height: 1.55;
    font-family: sans-serif;
    flex: 1;
    margin-bottom: 14px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .card-price {
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold-dark);
  }
  .card-price.free { color: #2e7d32; }
  .launch-btn {
    display: inline-block;
    padding: 9px 20px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #fff;
    border-radius: 100px;
    font-size: 0.82rem;
    font-weight: 700;
    font-family: sans-serif;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: opacity 0.2s, transform 0.15s;
    border: none;
    cursor: pointer;
  }
  .launch-btn:hover { opacity: 0.88; transform: scale(1.03); }
  .new-badge {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    font-size: 0.65rem;
    font-weight: 700;
    font-family: sans-serif;
    padding: 2px 8px;
    border-radius: 100px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* EMPTY STATE */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: sans-serif;
  }
  .empty .icon { font-size: 3rem; margin-bottom: 14px; }

  /* FOOTER */
  footer {
    background: var(--charcoal);
    color: rgba(255,255,255,0.6);
    text-align: center;
    padding: 30px 20px;
    font-family: sans-serif;
    font-size: 0.85rem;
  }
  footer a { color: #e8c96a; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .hero { padding: 40px 16px 36px; }
    .gallery { padding: 0 12px; gap: 16px; }
    .filters { padding: 16px 12px 0; }
  }
</style>
</head>

let currentFilter = 'all';
let currentSearch = '';

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterApps();
}

function filterApps() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  const visible = apps.filter(app => {
    const matchCat = currentFilter === 'all' || app.category === currentFilter;
    const matchSearch = !currentSearch ||
      app.title.toLowerCase().includes(currentSearch) ||
      app.desc.toLowerCase().includes(currentSearch) ||
      app.category.toLowerCase().includes(currentSearch);
    return matchCat && matchSearch;
  });

  document.getElementById('appCount').textContent = visible.length + ' apps';
  document.getElementById('totalCount').textContent = apps.length;

  if (visible.length === 0) {
    gallery.innerHTML = '<div class="empty"><div class="icon">🔍</div><p>No apps found — try a different search.</p></div>';
    return;
  }

  visible.forEach(app => {
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <img class="card-image" src="${app.img}&width=400&height=200&seed=42" alt="${app.title}" onerror="this.style.display='none'"/>
      <div class="card-body">
        <div class="card-category">${app.category}</div>
        <div class="card-title">${app.emoji} ${app.title}${app.isNew ? '<span class="new-badge">New</span>' : ''}</div>
        <div class="card-desc">${app.desc}</div>
        <div class="card-footer">
          <span class="card-price free">✅ Free</span>
          <a class="launch-btn" href="${app.url}" target="_blank">Launch App →</a>
        </div>
      </div>`;
    gallery.appendChild(card);
  });
}
