<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Cycles — Video Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            font-size: 1em;
            font-weight: 600;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .video-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            display: none;
        }
        
        .video-card.show {
            display: flex;
            flex-direction: column;
        }
        
        .video-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        
        .video-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            overflow: hidden;
        }
        
        .video-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .video-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .video-title {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }
        
        .video-series {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
            width: fit-content;
        }
        
        .video-desc {
            font-size: 0.95em;
            color: #666;
            line-height: 1.5;
            flex: 1;
        }
        
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .video-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

        function renderVideos(filter = 'all') {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            let shown = 0;
            videos.forEach(video => {
                if (filter === 'all' || video.category === filter) {
                    const card = document.createElement('div');
                    card.className = 'video-card show';
                    card.innerHTML = `
                        <div class="video-frame">
                            <iframe src="https://drive.google.com/file/${video.id}/preview" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                        <div class="video-info">
                            <span class="video-series">${video.series}</span>
                            <h3 class="video-title">${video.name}</h3>
                            <p class="video-desc">Watch full video • Access anytime • Download available</p>
                        </div>
                    `;
                    grid.appendChild(card);
                    shown++;
                }
            });
            
            if (shown === 0) {
                grid.innerHTML = '<div class="empty-state">No videos found in this category</div>';
            }
        }
        
        function filterVideos(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderVideos(category);
        }
        
        // Initial render
        renderVideos();
    </script>
