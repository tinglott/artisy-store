<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ting Lott Apps</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
    h1 { color: #667eea; }
    .apps { display: grid; gap: 20px; margin-top: 30px; }
    .app-card { padding: 20px; border: 2px solid #667eea; border-radius: 8px; }
    .app-card h2 { margin: 0 0 10px 0; }
    .app-card a { color: #667eea; text-decoration: none; font-weight: bold; }
    .app-card a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🦉 Ting Lott Apps</h1>
  <div class="apps">
    <div class="app-card">
      <h2>📧 Email Capture</h2>
      <p>Newsletter signup form</p>
      <a href="/email-capture/">Open →</a>
    </div>
    <div class="app-card">
      <h2>👨‍👩‍👧‍👦 ParentWise</h2>
      <p>ADHD support for parents</p>
      <a href="/parentwise/">Open →</a>
    </div>
    <div class="app-card">
      <h2>💐 Mom's Day</h2>
      <p>Mother's Day celebration</p>
      <a href="/momsday/">Open →</a>
    </div>
    <div class="app-card">
      <h2>📋 Task Master</h2>
      <p>Cloud-synced to-do list</p>
      <a href="/todo-list/">Open →</a>
    </div>
  </div>
</body>
</html>
