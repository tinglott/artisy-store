let cur = 0;
document.getElementById('nav').innerHTML = D.map((d,i) =>
  `<button class="nav-btn${i===0?' active':''}" onclick="show(${i})">Day ${d.day}</button>`).join('');
document.getElementById('pages').innerHTML = D.map((d,i) => `
<div class="page${i===0?' active':''}" id="p${i}">
  <div class="card">
    <div class="day-header">
      <span class="day-badge">Day ${d.day} of 365</span>
      <span class="day-title">${d.title}</span>
    </div>
    <div class="img-wrap">
      <img src="data:image/jpeg;base64,${d.img}" alt="Coloring art Day ${d.day}">
      <div class="img-caption">🎨 Color this page as you reflect</div>
    </div>
    <div class="text-sec">
      <div class="label">Today's Devotion</div>
      <p class="devotion">${d.devotion}</p>
      <div class="label">Daily Affirmation</div>
      <div class="affirm"><p>"${d.affirmation}"</p></div>
      <div class="scripture">📖 <span>${d.scripture}</span></div>
    </div>
  </div>
</div>`).join('');
function show(i) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('p'+i).classList.add('active');
  document.querySelectorAll('.nav-btn')[i].classList.add('active');
  cur=i;
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===D.length-1;
}
function go(d){if(cur+d>=0&&cur+d<D.length)show(cur+d);}
</script>
