<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Meta Ads Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--ink:#14171f;--mut:#5b6475;--line:#e2e6ef;--acc:#0866ff;--acc2:#e7f0ff;--ok:#18a058}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--ink:#eef1f7;--mut:#9aa4b8;--line:#2a3040;--acc:#4d95ff;--acc2:#1a2740;--ok:#3ecf8e}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--ink:#eef1f7;--mut:#9aa4b8;--line:#2a3040;--acc:#4d95ff;--acc2:#1a2740;--ok:#3ecf8e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 2px}p.sub{color:var(--mut);margin:0 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:0 0 4px}
label.t{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
label.t input{margin-top:5px;width:18px;height:18px;flex:none}
a{color:var(--acc)}small,.mut{color:var(--mut)}
.tag{display:inline-block;font-size:12px;background:var(--acc2);color:var(--acc);border-radius:10px;padding:1px 8px;margin-right:4px}
input[type=text],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
button.go{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%}
button.go:disabled{opacity:.6}button.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.ct{font-size:12px;color:var(--mut)}.over{color:#d33}
.q button{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.q button.right{border-color:var(--ok);background:var(--acc2)}.q button.wrong{border-color:#d33}
section{display:none}section.on{display:block}
</style></head><body><main>
<h1>📣 Meta Ads Academy</h1>
<p class="sub">Learn to create Meta ads: official training, YouTube, open-source tools, and an AI copy lab.</p>
<div class="bar"><i id="pb"></i></div><small id="pt" class="mut"></small>
<nav id="nav"></nav>

<section id="s-path"></section>

<section id="s-res"></section>

<section id="s-lab">
<div class="card"><h2>Ad Copy Lab</h2>
<p class="mut" style="margin-top:0">Generates three angles to test. Treat them as drafts, and always A/B test in Ads Manager.</p>
<label>Product or offer<input type="text" id="prod" placeholder="e.g. handmade soy candles, 20% off first order"></label>
<label>Audience<input type="text" id="aud" placeholder="e.g. women 25–40 who love home decor"></label>
<label>Campaign objective<select id="obj"><option>Sales</option><option>Leads</option><option>Traffic</option><option>Engagement</option><option>Awareness</option><option>App promotion</option></select></label>
<label>Tone<select id="tone"><option>Friendly</option><option>Professional</option><option>Playful</option><option>Urgent</option><option>Luxury</option></select></label>
<button class="go" id="gen">Generate ad copy</button>
<p class="ct" id="msg"></p></div>
<div id="out"></div></section>

<section id="s-quiz"><div class="card q" id="quiz"></div></section>

<section id="s-glos"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const weeks=[
{t:"Week 1 · Foundations",i:["Take Meta Blueprint’s beginner path (Digital Marketing Associate)","Create a Meta Business portfolio and connect your Page and ad account","Set up the Meta Pixel and learn about the Conversions API","Map campaign → ad set → ad in your own words"]},
{t:"Week 2 · Your first campaign",i:["Pick ONE objective (Sales, Leads, Traffic…)","Compare broad, interest, custom and lookalike audiences, then choose one","Set a small daily budget you can afford to lose","Create 2–3 creatives (image/video + primary text + headline + CTA)","Publish and check ad review status"]},
{t:"Week 3 · Test and measure",i:["Run an A/B test that changes only one variable","Learn CTR, CPC, CPM, CPA and ROAS","Let the learning phase finish before making big edits","Write down what won and why"]},
{t:"Week 4 · Scale and automate",i:["Pull campaign reports with the Python Business SDK","Explore Robyn (marketing mix modeling) with sample data","Read how GeoLift measures incremental lift","Use the Copy Lab to draft new variants, then test them"]}];
const res=[
{h:"Meta (official)",l:[["Meta Blueprint free courses","https://www.facebook.com/business/learn","Start here for terminology, Ads Manager and Advantage+ campaigns"],["Meta Business Help Center","https://www.facebook.com/business/help","Specs, policies and troubleshooting"]]},
{h:"YouTube",l:[["Meta Ads Manager tutorials","https://www.youtube.com/results?search_query=meta+ads+manager+tutorial+for+beginners","Sort by upload date; Ads Manager changes often"],["Meta for Business channel","https://www.youtube.com/results?search_query=Meta+for+Business","Official walkthroughs and product updates"],["Creative testing strategy","https://www.youtube.com/results?search_query=meta+ads+creative+testing","How to structure ad tests"]]},
{h:"GitHub (open source)",l:[["facebook-python-business-sdk","https://github.com/facebook/facebook-python-business-sdk","Official Marketing API SDK: create and report on campaigns in code"],["Robyn","https://github.com/facebookexperimental/Robyn","Marketing mix modeling: which channels drive results"],["GeoLift","https://github.com/facebookincubator/GeoLift","Measure true incremental impact of ads"]]},
{h:"Hugging Face",l:[["Meta Llama models","https://huggingface.co/meta-llama","Open models for drafting ad copy and angles"],["Transformers library","https://huggingface.co/docs/transformers","Run open models yourself"]]}];
const glos=[["Campaign","Top level; holds your objective."],["Ad set","Audience, budget, schedule and placements."],["Ad","The creative people see: media, text, headline, CTA."],["Pixel / CAPI","Tracking that reports site actions back to Meta."],["CTR","Click-through rate: clicks ÷ impressions."],["CPM","Cost per 1,000 impressions."],["CPA","Cost per action (purchase, lead…)."],["ROAS","Return on ad spend: revenue ÷ spend."],["Lookalike","Audience similar to a source audience you provide."],["Learning phase","Period when delivery is still optimizing; avoid big changes."],["Advantage+","Meta’s automated campaign and creative options."]];
const quiz=[["Which level holds the audience and budget?",["Campaign","Ad set","Ad"],1],["You want to test two headlines. What should you change?",["Headline only","Headline, image and audience","Everything"],0],["ROAS measures…",["Clicks per impression","Revenue per ad dollar","Cost per lead"],1],["Best first move with a new, small budget?",["Ten objectives at once","One clear objective and 2–3 creatives","Edit the ad daily"],1],["What shows incremental impact of ads?",["GeoLift-style lift testing","Counting likes","Page followers"],0]];

// tabs
const tabs=[["path","Plan"],["res","Resources"],["lab","Copy Lab"],["quiz","Quiz"],["glos","Glossary"]];
tabs.forEach(([k,n],i)=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>show(k);b.id="t-"+k;$("nav").appendChild(b)});
function show(k){tabs.forEach(([x])=>{$("s-"+x).classList.toggle("on",x===k);$("t-"+x).classList.toggle("on",x===k)});store.set("tab",k)}

// plan
let done=store.get("done")||{};
function renderPlan(){const el=$("s-path");el.textContent="";let n=0,tot=0;
weeks.forEach((w,wi)=>{const c=document.createElement("div");c.className="card";const h=document.createElement("h2");h.textContent=w.t;c.appendChild(h);
w.i.forEach((t,ti)=>{const id=wi+"-"+ti;tot++;if(done[id])n++;const l=document.createElement("label");l.className="t";const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!done[id];cb.onchange=()=>{done[id]=cb.checked;store.set("done",done);renderPlan()};const s=document.createElement("span");s.textContent=t;l.append(cb,s);c.appendChild(l)});el.appendChild(c)});
$("pb").style.width=(n/tot*100)+"%";$("pt").textContent=n+" of "+tot+" steps complete"}
// resources
function renderRes(){const el=$("s-res");res.forEach(g=>{const c=document.createElement("div");c.className="card";const h=document.createElement("h2");h.textContent=g.h;c.appendChild(h);
g.l.forEach(([n,u,d])=>{const p=document.createElement("p");p.style.margin="6px 0";const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener noreferrer";a.textContent=n;const s=document.createElement("small");s.textContent=" — "+d;p.append(a,s);c.appendChild(p)});el.appendChild(c)})}
// glossary
function renderGlos(){const c=document.createElement("div");c.className="card";glos.forEach(([a,b])=>{const p=document.createElement("p");p.style.margin="6px 0";const s=document.createElement("strong");s.textContent=a+": ";p.append(s,b);c.appendChild(p)});$("s-glos").appendChild(c)}
// quiz
let qi=0,score=0;
function renderQ(){const el=$("quiz");el.textContent="";if(qi>=quiz.length){const h=document.createElement("h2");h.textContent="Score: "+score+" / "+quiz.length;const b=document.createElement("button");b.className="go";b.textContent="Retry";b.onclick=()=>{qi=0;score=0;renderQ()};el.append(h,b);return}
const [q,o,a]=quiz[qi];const h=document.createElement("h3");h.textContent=(qi+1)+". "+q;el.appendChild(h);
o.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{if(el.dataset.l)return;el.dataset.l=1;b.classList.add(i===a?"right":"wrong");if(i===a)score++;else el.children[a+1].classList.add("right");setTimeout(()=>{delete el.dataset.l;qi++;renderQ()},900)};el.appendChild(b)})}
// copy lab
function card(v,i){const c=document.createElement("div");c.className="card";const tg=document.createElement("span");tg.className="tag";tg.textContent="Variant "+(i+1)+(v.angle?" · "+v.angle:"");c.appendChild(tg);
[["Primary text",v.primary_text,125],["Headline",v.headline,40],["Description",v.description,30]].forEach(([n,t,m])=>{t=String(t||"");const p=document.createElement("p");p.style.margin="8px 0 0";const s=document.createElement("strong");s.textContent=n+": ";p.append(s,t);const k=document.createElement("span");k.className="ct"+(t.length>m?" over":"");k.textContent="  ("+t.length+"/"+m+" suggested)";p.appendChild(k);c.appendChild(p)});
const cta=document.createElement("p");cta.style.margin="8px 0";cta.textContent="CTA button: "+(v.cta||"Learn More");c.appendChild(cta);
if(v.why){const w=document.createElement("small");w.textContent="Why it may work: "+v.why;c.appendChild(w)}
const b=document.createElement("button");b.className="sm";b.style.marginTop="8px";b.textContent="Copy";b.onclick=async()=>{const x=v.primary_text+"\n"+v.headline+"\n"+(v.description||"");try{await navigator.clipboard.writeText(x);b.textContent="Copied"}catch(e){b.textContent="Select text to copy"}};c.appendChild(document.createElement("br"));c.appendChild(b);return c}
let sample=null;
claude.use("sample").then(s=>{sample=s;if(!s){$("msg").textContent="AI generation isn’t available in this view."}}).catch(()=>{$("msg").textContent="AI generation isn’t available in this view."});
$("gen").onclick=async()=>{const prod=$("prod").value.trim(),aud=$("aud").value.trim();if(!prod){$("msg").textContent="Describe your product or offer first.";return}
if(!sample){$("msg").textContent="AI generation isn’t available in this view.";return}
const b=$("gen");b.disabled=true;$("msg").textContent="Writing variants…";$("out").textContent="";
const prompt="You are an expert Meta (Facebook/Instagram) paid-social copywriter. Write 3 distinct ad variants using different angles (e.g. benefit, social proof, urgency or curiosity). Product/offer: "+prod+". Audience: "+(aud||"general")+". Objective: "+$("obj").value+". Tone: "+$("tone").value+". Rules: primary_text under 125 characters, headline under 40, description under 30, no false claims, no guaranteed results, no personal-attribute callouts, cta must be one of Meta’s button labels (Shop Now, Learn More, Sign Up, Get Offer, Contact Us, Book Now, Download). Return ONLY a JSON array of 3 objects with keys: angle, primary_text, headline, description, cta, why (one short sentence).";
try{const r=await sample.json(prompt,{cache:false});const arr=Array.isArray(r)?r:(r.variants||[]);arr.slice(0,3).forEach((v,i)=>$("out").appendChild(card(v,i)));$("msg").textContent=arr.length?"Always test these in Ads Manager and check Meta’s ad policies.":"No variants returned. Try again."}
catch(e){$("msg").textContent=e&&e.code==="rate_limited"?"Rate limited. Wait a moment and retry.":e&&e.code==="not_granted"?"Permission needed to use AI generation.":"Couldn’t generate. Please try again."}
b.disabled=false};
renderPlan();renderRes();renderGlos();renderQ();show(store.get("tab")||"path");
</script></body></html>
