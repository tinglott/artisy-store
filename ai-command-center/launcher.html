<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start Here — AI Command Center</title>
<style>
:root{--bg:#eef1ef;--sf:#fff;--ink:#17231f;--mu:#5f6f68;--ln:#d6ddd9;--nv:#14332b;--nt:#cfe3da;--ac:#b86e00;--ac2:#fff0d6;--gn:#13744a;--rd:#b3261e;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101a17;--sf:#18251f;--ink:#e8f0ec;--mu:#9bada5;--ln:#2b3b34;--nv:#0b1f19;--ac:#f0a53a;--ac2:#3a2c10;--gn:#5fd39a;--rd:#ff8b84;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 system-ui,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--nv);color:var(--nt);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
aside h1{font-size:19px;margin:0 8px 2px;color:#fff}aside h1 span{color:#f0a53a}
aside .sub{font-size:12px;color:var(--nt);opacity:.75;margin:0 8px 12px}
aside button{background:none;border:0;color:inherit;text-align:left;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}
aside button[aria-current=true]{background:#ffffff1f;color:#fff;font-weight:600}
main{padding:20px;max-width:1150px;width:100%}
h2{font-size:22px;margin:0}h3{margin:0 0 8px;font-size:16px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.top h2{flex:1;min-width:120px}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:7px;width:100%}
.btn{background:var(--ac);color:#fff;border:0;border-radius:5px;padding:7px 13px;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--ink);border:1px solid var(--ln)}.btn.s{padding:2px 8px;font-size:12.5px}
.btn.danger{color:var(--rd);border:1px solid var(--rd);background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:7px;padding:12px;margin-bottom:12px}.cards .c{margin:0}
.c small{color:var(--mu)}.k{font:500 21px monospace;display:block}
.mu{color:var(--mu)}
.tag{display:inline-block;border-radius:9px;padding:0 8px;font-size:12px;background:var(--ac2);color:var(--ac)}
.tag.INCLUDED{background:#13744a22;color:var(--gn)}
.tag.ARRANGE{background:#b86e0022;color:var(--ac)}
dialog{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:18px;width:min(540px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#0008}label{display:block;margin:8px 0 2px;color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{background:var(--ac2);border:1px solid var(--ln);border-radius:7px;padding:10px 12px;margin-bottom:12px}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--gn)}
.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--gn);cursor:pointer}
.step.done .t{text-decoration:line-through;color:var(--mu)}
.step .t{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tool{background:var(--sf);border:1px solid var(--ln);border-radius:7px;padding:12px}
.tool a{color:var(--ac);font-weight:600}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 16px;border-radius:7px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.show{opacity:1}
@media(max-width:760px){.app{display:block}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}aside h1{display:none}aside .sub{display:none}aside button{white-space:nowrap}main{padding:14px}}
</style></head><body>
<div class="app"><aside id="side"></aside><main id="m"></main></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)],
esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="aicc-launcher";
const BASE="https://shop.artistrystore.com/ai-command-center/";
const WEEKS=[
{id:"w1",label:"Week 1 — Protect the business first"},
{id:"w2",label:"Week 2 — Money"},
{id:"w3",label:"Week 3 — Customers"},
{id:"w4",label:"Week 4 — Glue + support"},
{id:"w5",label:"After day 30 — the rest of the stack"}];
const STEPS=[
{week:"w1",title:"Turn on multi-factor authentication (MFA) everywhere",kind:"arrange",service:"Authenticator app (free) — start with email and money accounts",why:"One stolen password can reach everything else. AICC has no security tool; this is a practice, not a purchase."},
{week:"w1",title:"Set up a business password manager",kind:"arrange",service:"Bitwarden (free core)",why:"Stop sharing passwords by email or chat. AICC does not store your passwords."},
{week:"w1",title:"Run your first backup — and test restoring it",kind:"arrange",service:"Your own backup (Google Drive, an external drive, or your host's backup)",why:"A backup you cannot restore is wasted money. AICC does not back up your business."},
{week:"w2",title:"Get the books live",kind:"included",service:"Ledgerlight + OpenSuite",why:"Real double-entry books, invoices, and reports — already in the box.",link:"finance/ledgerlight.html"},
{week:"w2",title:"Connect payments to the books",kind:"arrange",service:"Your own Stripe account (connect it yourself)",why:"AICC does not take payments. Stripe, JVZoo, Gumroad, or Whop take the money; the books record it."},
{week:"w3",title:"Set up the customer list (CRM)",kind:"included",service:"OpenLeaf",why:"One source of truth for every customer — already in the box.",link:"crm/openleaf.html"},
{week:"w3",title:"Start the email list — with consent records",kind:"included",service:"OpenLeaf subscribers",why:"Subscribers and autoresponders live in OpenLeaf — already in the box.",link:"crm/openleaf.html"},
{week:"w3",title:"Set up email sending",kind:"arrange",service:"OpenLeaf Sender + your own SMTP/host — plus the Email Auto-Responder download",why:"The Sender is built but not deployed — it needs an always-on host and your own SMTP before it can send. The Auto-Responder download drafts replies to incoming mail (drafts only, on your own computer).",link:"email/auto-responder.html"},
{week:"w4",title:"Set up one automation",kind:"arrange",service:"Activepieces (free tier) or n8n",why:"The glue between sale, CRM, email, and books. AICC's own command layer is design-only for now."},
{week:"w4",title:"Open the support inbox",kind:"included",service:"Help Desk",why:"A ticket queue with owners and resolution times — already in the box.",link:"support/helpdesk.html"},
{week:"w5",title:"Put bookings on the page",kind:"included",service:"Bookings",why:"Services, booking form, reminders list, .ics download — already in the box. It sends no emails or texts.",link:"scheduling/bookings.html"},
{week:"w5",title:"Track contracts and signatures",kind:"included",service:"E-Signature + Contracts",why:"Typed-name signature records with expiry watch — already in the box. Not legal advice.",link:"legal/esignature.html"},
{week:"w5",title:"Run work on a board",kind:"included",service:"Projects",why:"Projects with To do / Doing / Done boards — already in the box.",link:"operations/projects.html"},
{week:"w5",title:"Write down how things work",kind:"included",service:"Knowledge Base",why:"Procedures in one searchable library — already in the box.",link:"support/knowledge-base.html"},
{week:"w5",title:"Put the phone on Aria",kind:"included",service:"Aria, the voice receptionist",why:"Greets visitors and books appointments in English, proven on the store. She claims a language only after a live voice test.",link:""},
{week:"w5",title:"Set up video meetings",kind:"arrange",service:"Google Meet or Zoom (free tier)",why:"AICC has no video meetings inside it."},
{week:"w5",title:"Check your website numbers",kind:"arrange",service:"Google Analytics (free) or Plausible",why:"Your store is your website. AICC has no analytics tool inside it."},
{week:"w5",title:"Arrange payroll (buy it — do not build it)",kind:"arrange",service:"Gusto (from $49/mo + $6 per employee) or Patriot Payroll (from $17/mo + $4 per worker) — prices as listed in 2026, confirm before buying",why:"Tax rules change by state and city. This is the one category where building your own is a bad idea."}
];
const TOOLS=[
{name:"Ledgerlight",desc:"Books, runway, and cash — the AI CFO workbench.",link:"finance/ledgerlight.html"},
{name:"OpenLeaf CRM",desc:"Customers, pipeline, subscribers, and follow-ups.",link:"crm/openleaf.html"},
{name:"OpenSuite ERP",desc:"The whole operation: orders, invoices, inventory, ledger.",link:"operations/opensuite.html"},
{name:"Help Desk",desc:"Support ticket queue with owners and resolution times.",link:"support/helpdesk.html"},
{name:"Bookings",desc:"Booking page with reminders and .ics download.",link:"scheduling/bookings.html"},
{name:"E-Signature + Contracts",desc:"Typed-name signature records and expiry watch.",link:"legal/esignature.html"},
{name:"Projects",desc:"Project and task boards, To do / Doing / Done.",link:"operations/projects.html"},
{name:"Knowledge Base",desc:"Procedures in one searchable library — searchable articles and how-tos.",link:"support/knowledge-base.html"},
{name:"AetherSheet — Inventory Grid",desc:"Check your inventory at a glance: stock levels, low-stock watch, total value, CSV in/out, AI column fill (your own service).",link:"spreadsheets/aethersheet.html"},
{name:"Staff Schedule",desc:"Employee work schedules by week, with Google Calendar send and .ics download.",link:"scheduling/staff-schedule.html"},
{name:"BizBlog — Blog Series Studio",desc:"BONUS — Turn your business story into a full blog series: AI drafts with your free key, edit in Markdown, export or publish to GitHub.",link:"marketing/bizblog.html"},
{name:"Catalog Studio",desc:"Turn your product list into an interactive, shoppable catalog: paste a spreadsheet or load a CSV, browse, compare, build a quote, and share the page. Your data stays in your browser.",link:"marketing/catalog-studio.html"},
{name:"StoreCopy",desc:"One product, one store page: paste a product link or fill in the details, and get a complete single-product storefront with a Buy button to your own checkout. Download it and host it free.",link:"marketing/store-copy.html"},
{name:"Ad Studio",desc:"Pick a product, pick a format, download the ad: square, story, and carousel ads drawn on-brand on a canvas, as PNGs. No photos to license, nothing uploaded. Ships with 13 real ARTISY products as samples; add your own.",link:"marketing/ad-studio.html"},
{name:"AI-Readiness Quiz",desc:"Six questions, one honest score: find out how ready your business is for AI and see the exact tools that fit your answers. Free, no email, no demo call — your result is right there.",link:"marketing/ai-readiness-quiz.html"},
{name:"Aria — voice receptionist",desc:"Greets visitors and books appointments in English. Talk to her on the store.",link:"",store:true}
];
let D=null,tab="checklist";
try{D=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!D||!Array.isArray(D.done))D={done:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
if(!localStorage.getItem(KEY))save();
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};
const doneCount=()=>STEPS.filter((s,i)=>D.done.includes(i)).length;
function side(){$("#side").innerHTML=`<h1>Start <span>Here</span></h1><p class="sub">AI Command Center · free tool</p>`+[["checklist","Your first 30 days"],["tools","Your tools"]].map(([k,l])=>`<button data-tab="${k}" aria-current="${tab===k}">${l}</button>`).join("")+`<p class="sub" style="margin-top:auto">Checkmarks stay in this browser only.</p>`;$$("#side button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function stepHTML(s,i){const done=D.done.includes(i);
const badge=s.kind==="included"?`<span class="tag INCLUDED">INCLUDED</span>`:`<span class="tag ARRANGE">YOU ARRANGE</span>`;
const svc=s.link?`<a href="${BASE+esc(s.link)}" target="_blank" rel="noopener">${esc(s.service)}</a>`:esc(s.service);
return `<div class="step${done?" done":""}"><input type="checkbox" ${done?"checked":""} onchange="toggleStep(${i},this.checked)" aria-label="${esc(s.title)}"><div><div><span class="t">${esc(s.title)}</span> ${badge}</div><div>${svc}</div><div class="mu">${esc(s.why)}</div></div></div>`}
function render(){side();const m=$("#m");const n=doneCount(),pct=Math.round(n/STEPS.length*100);
if(tab==="checklist"){m.innerHTML=`<div class="top"><h2>Start here — your first 30 days</h2><button class="btn g" onclick="askReset()">Reset checklist</button></div>
<div class="c"><small>${n} of ${STEPS.length} steps done — ${pct}%</small><div class="bar"><i style="width:${pct}%"></i></div>
<p class="mu" style="margin:8px 0 0">Every step is marked <span class="tag INCLUDED">INCLUDED</span> — already in the box, no extra cost — or <span class="tag ARRANGE">YOU ARRANGE</span> — the exact outside service, and why it sits outside the box. Work the weeks in order. Nothing here is bought or connected for you.</p></div>
${WEEKS.map(w=>{const items=STEPS.map((s,i)=>({s,i})).filter(x=>x.s.week===w.id);const wd=items.filter(x=>D.done.includes(x.i)).length;
return `<div class="c"><h3>${esc(w.label)} — ${wd}/${items.length} done</h3>${items.map(x=>stepHTML(x.s,x.i)).join("")}</div>`}).join("")}
<p class="mu">What this does not do: this is a checklist, not a setup service — it does not set anything up for you. It tells you what is already in the box and what you still need to arrange, in order, so there is no guessing about what is still needed. Prices named here were listed in 2026 and can change — confirm before buying.</p>`}
if(tab==="tools"){m.innerHTML=`<div class="top"><h2>Your tools</h2></div>
<div class="note">Everything below is already yours with AI Command Center — free, in the browser, no account, no server. Your data stays in this browser.</div>
<div class="grid">${TOOLS.map(t=>`<div class="tool"><strong>${esc(t.name)}</strong><p class="mu">${esc(t.desc)}</p>${t.link?`<a href="${BASE+esc(t.link)}" target="_blank" rel="noopener">Open →</a>`:t.store?`<a href="https://shop.artistrystore.com/" target="_blank" rel="noopener">Open the store →</a>`:""}</div>`).join("")}</div>
<p class="mu">What this does not do: this page does not set anything up — it is the map, not the work. Open each tool from here and use it; the checklist on the other tab keeps the order.</p>`}}
window.toggleStep=(i,on)=>{D.done=D.done.filter(x=>x!==i);if(on)D.done.push(i);save();render();if(on)toast("Step done — nice work.")};
window.askReset=()=>{const d=$("#dlg");d.innerHTML=`<h3>Reset the checklist?</h3><p>This clears all ${STEPS.length} checkmarks. There is no undo.</p><div class="row"><button class="btn danger" onclick="doReset()">Yes, reset it</button><button class="btn g" onclick="document.querySelector('#dlg').close()">Keep my progress</button></div>`;d.showModal()};
window.doReset=()=>{D.done=[];$("#dlg").close();save();render();toast("Checklist reset.")};
render();
</script></body></html>
