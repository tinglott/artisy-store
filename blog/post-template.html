<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title} - Ting Lott's Blog</title>
    <meta name="description" content="{excerpt}">
    <meta name="keywords" content="{keywords}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{title}">
    <meta property="og:description" content="{excerpt}">
    <meta property="og:image" content="{featured_image}">
    <meta property="og:type" content="article">
    
    <!-- Schema Markup -->
    <script type="application/ld+json">
    {{
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{title}",
        "description": "{excerpt}",
        "image": "{featured_image}",
        "datePublished": "{publish_date}",
        "author": {{
            "@type": "Person",
            "name": "Ting Lott",
            "url": "https://shop.artistrystore.com"
        }},
        "publisher": {{
            "@type": "Organization",
            "name": "Ting Lott",
            "url": "https://shop.artistrystore.com"
        }}
    }}
    </script>
    
    <style>
        * {{ margin: 0; padding: 0; box-sizing: border-box; }}
        body {{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            color: #333;
            background: #f9f9f9;
        }}
        
        header {{
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }}
        
        header h1 {{
            font-size: 2.5em;
            margin-bottom: 20px;
        }}
        
        .article-meta {{
            font-size: 1em;
            opacity: 0.95;
        }}
        
        .container {{
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }}
        
        article {{
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }}
        
        article h2 {{
            margin: 30px 0 15px 0;
            font-size: 1.8em;
            color: #667eea;
        }}
        
        article h3 {{
            margin: 25px 0 10px 0;
            font-size: 1.4em;
        }}
        
        article p {{
            margin-bottom: 20px;
            line-height: 1.8;
        }}
        
        article ul, article ol {{
            margin-left: 20px;
            margin-bottom: 20px;
        }}
        
        article li {{
            margin-bottom: 10px;
        }}
        
        .featured-image {{
            width: 100%;
            border-radius: 8px;
            margin: 30px 0;
        }}
        
        .cta-box {{
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 30px 0;
            border-radius: 4px;
        }}
        
        .cta-box strong {{
            color: #667eea;
        }}
        
        .related-products {{
            background: white;
            padding: 30px;
            margin-top: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }}
        
        .product-link {{
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }}
        
        .product-link:hover {{
            text-decoration: underline;
        }}
        
        footer {{
            background: #333;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }}
    </style>
</head>
<body>
    <header>
        <h1>{title}</h1>
        <div class="article-meta">
            <span>By Ting Lott</span> • <span>{publish_date}</span> • <span>{read_time}</span>
        </div>
    </header>
    
    <div class="container">
        <article itemscope itemtype="https://schema.org/BlogPosting">
            <img src="{featured_image}" alt="{title}" class="featured-image" itemprop="image">
            
            <p><strong>{excerpt}</strong></p>
            
            <!-- CONTENT GOES HERE -->
            {content}
            
            <!-- Related Products/Services -->
            <div class="related-products">
                <h3>Related Resources</h3>
                <ul>
                    {related_products}
                </ul>
            </div>
        </article>
    </div>
    
    <footer>
        <p>&copy; 2026 Ting Lott. All rights reserved. | <a href="https://shop.artistrystore.com">Shop</a> | <a href="https://whop.com/tlott12">Memberships</a></p>
    </footer>
</body>
</html>
