<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlipBook Pro • AI Classroom Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #141426;
      --bg-accent: #1a2345;
      --text-primary: #f0f0f8;
      --text-secondary: #c0c0d0;
      --gold: #e8c39e;
      --gold-dark: #c89f6e;
      --page-cream: #fffaf0;
      --page-cream-dark: #f8f0e8;
      --success: #4ade80;
      --error: #f87171;
      --warn: #facc15;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.8;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    header {
      text-align: center;
      padding: 48px 16px 32px;
      background: linear-gradient(180deg, rgba(232,195,158,0.06) 0%, transparent 100%);
      border-bottom: 1px solid rgba(232,195,158,0.12);
      margin-bottom: 32px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      background: linear-gradient(135deg, #ffd9a3, #e8b068, #c68f50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .subtitle { color: var(--text-secondary); font-style: italic; margin-top: 8px; font-size: 1.1rem; }

    .card {
      background: var(--bg-secondary);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 28px;
      border: 1px solid rgba(232,195,158,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .card-label {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 20px;
      font-family: 'Crimson Pro', serif;
      font-size: 1.1rem;
      line-height: 1.8;
      border: 2px solid rgba(232,195,158,0.2);
      border-radius: 14px;
      background: #0a0a14;
      color: #f0f0f8;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: rgba(232,195,158,0.5); }

    .controls-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 18px;
    }

    .btn {
      padding: 13px 26px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0f0f1a;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,195,158,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.14); }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-left: auto;
    }
    .toggle {
      width: 48px; height: 26px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #888;
      transition: all 0.2s;
    }
    .toggle.active { background: rgba(232,195,158,0.35); }
    .toggle.active::after { left: 25px; background: var(--gold); }

    /* Book Layout */
    .book-section { display: none; }
    .book-section.visible { display: block; }

    .book-wrapper {
      perspective: 3000px;
      padding: 40px 0 20px;
      display: flex;
      justify-content: center;
    }
    .book {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 1.618;
      transform-style: preserve-3d;
    }
    .book-spine {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 24px;
      transform: translateX(-50%);
      background: linear-gradient(90deg,#1a0f08,#3a2518,#5a3a28,#3a2518,#1a0f08);
      border-radius: 4px;
      z-index: 10;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }

    .page-container {
      position: absolute;
      width: calc(50% - 14px);
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.645,0.045,0.355,1);
    }
    .page-container.left { left: 0; transform-origin: right center; }
    .page-container.right { right: 0; transform-origin: left center; }

    .page {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--page-cream-dark), var(--page-cream) 10%, var(--page-cream));
      border-radius: 6px 2px 2px 6px;
      box-shadow: inset -20px 0 40px -20px rgba(0,0,0,0.12), 6px 0 18px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .page.right-page {
      background: linear-gradient(to left, var(--page-cream-dark), var(--page-cream) 10%, var(--page-cream));
      border-radius: 2px 6px 6px 2px;
      box-shadow: inset 20px 0 40px -20px rgba(0,0,0,0.12), -6px 0 18px rgba(0,0,0,0.25);
    }

    .page-inner {
      width: 100%; height: 100%;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page-image-wrap {
      flex: 0 0 45%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      background: #e8e0d8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-image {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.7s;
    }
    .page-image.loaded { opacity: 1; }
    .page-image-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(0,0,0,0.2);
    }

    .page-text {
      flex: 1;
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      line-height: 1.9;
      color: #2a1f18;
      text-align: justify;
      hyphens: auto;
      overflow: hidden;
    }
    .page-text::first-letter {
      font-family: 'Playfair Display', serif;
      font-size: 3.8rem;
      float: left;
      line-height: 0.78;
      margin: 4px 10px 0 0;
      color: var(--gold-dark);
    }

    .page-num {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      color: #8b8175;
      text-align: center;
      padding-top: 8px;
    }

    .nav-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .nav-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(20,20,38,0.9);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--gold); color: #0f0f1a; transform: scale(1.12); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .page-indicator {
      font-size: 1.1rem;
      color: var(--text-secondary);
      min-width: 180px;
      text-align: center;
    }

    .speaking-badge {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(20,20,38,0.92);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 10px 22px;
      margin: 0 auto 12px;
      width: fit-content;
      font-size: 0.95rem;
    }
    .speaking-badge.active { display: flex; }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Quiz */
    .quiz-section { display: none; }
    .quiz-section.visible { display: block; }

    .quiz-progress {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 0 24px;
    }
    .quiz-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: all 0.3s;
    }
    .quiz-dot.active { background: var(--gold); transform: scale(1.3); }
    .quiz-dot.correct { background: var(--success); }
    .quiz-dot.incorrect { background: var(--error); }

    .quiz-card {
      background: var(--bg-accent);
      border-radius: 18px;
      padding: 32px;
      max-width: 700px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .quiz-q {
      font-size: 1.35rem;
      line-height: 1.5;
      margin-bottom: 24px;
      color: var(--text-primary);
    }
    .quiz-opt {
      background: rgba(255,255,255,0.06);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'Crimson Pro', serif;
      font-size: 1.1rem;
      color: var(--text-primary);
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s;
      width: 100%;
      text-align: left;
    }
    .quiz-opt:hover:not(:disabled) { background: rgba(232,195,158,0.1); border-color: rgba(232,195,158,0.3); }
    .quiz-opt.selected { border-color: var(--gold); background: rgba(232,195,158,0.15); }
    .quiz-opt.correct-answer { border-color: var(--success); background: rgba(74,222,128,0.1); }
    .quiz-opt.wrong-answer { border-color: var(--error); background: rgba(248,113,113,0.1); }
    .quiz-opt:disabled { cursor: default; }

    .quiz-feedback {
      margin-top: 18px;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.correct { background: rgba(74,222,128,0.12); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
    .quiz-feedback.incorrect { background: rgba(248,113,113,0.12); color: var(--error); border: 1px solid rgba(248,113,113,0.3); }

    .quiz-result {
      text-align: center;
      padding: 40px 20px;
      display: none;
    }
    .quiz-result.show { display: block; }
    .quiz-score { font-size: 3rem; font-family: 'Playfair Display', serif; color: var(--gold); margin: 16px 0; }

    /* Loading Spinner */
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(232,195,158,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg {
      text-align: center;
      color: var(--text-secondary);
      font-style: italic;
      padding: 20px;
    }

    @media (max-width: 640px) {
      .book { aspect-ratio: 0.85; }
      .page-inner { padding: 18px 14px; gap: 12px; }
      .page-text { font-size: 0.85rem; line-height: 1.7; }
      .page-text::first-letter { font-size: 2.6rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>FlipBook Pro</h1>
    <p class="subtitle">AI-Powered Classroom Edition &bull; Adaptive Quiz &bull; Voice Narration</p>
  </header>

  <!-- INPUT CARD -->
  <div class="card">
    <div class="card-label"><i class="fas fa-feather-pointed"></i> Paste Your Lesson, Story, or Article</div>
    <textarea id="editor" placeholder="Enter your educational content here — a story, lesson, article, or any text. FlipBook Pro will transform it into a beautifully illustrated flip book with narration and a quiz...&#10;&#10;Example: 'The water cycle is one of Earth's most important processes. Water evaporates from oceans and lakes when the sun heats the surface...'"></textarea>
    <div class="controls-row">
      <button class="btn btn-primary" id="createBookBtn">
        <i class="fas fa-book-open"></i> Create FlipBook
      </button>
      <button class="btn btn-secondary" id="sampleBtn">
        <i class="fas fa-lightbulb"></i> Load Sample
      </button>
      <div class="toggle-wrap">
        <span><i class="fas fa-volume-high"></i> Voice Narration</span>
        <div class="toggle active" id="voiceToggle" title="Toggle voice narration"></div>
      </div>
    </div>
  </div>

  <!-- SPEAKING INDICATOR -->
  <div class="speaking-badge" id="speakingBadge">
    <i class="fas fa-volume-high pulse"></i>
    <span id="speakingStatus">Reading aloud...</span>
    <button id="stopSpeakBtn" style="background:none;border:none;color:var(--error);cursor:pointer;padding:2px 6px;" title="Stop">
      <i class="fas fa-stop"></i>
    </button>
  </div>

  <!-- BOOK SECTION -->
  <div class="card book-section" id="bookSection">
    <div class="book-wrapper">
      <div class="book" id="theBook">
        <div class="book-spine"></div>
        <div class="page-container left" id="leftPC">
          <div class="page" id="leftPage"></div>
        </div>
        <div class="page-container right" id="rightPC">
          <div class="page right-page" id="rightPage"></div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" disabled title="Previous"><i class="fas fa-chevron-left"></i></button>
      <span class="page-indicator" id="pageIndicator">—</span>
      <button class="nav-btn" id="nextBtn" title="Next"><i class="fas fa-chevron-right"></i></button>
      <button class="btn btn-primary" id="startQuizBtn" style="display:none;">
        <i class="fas fa-brain"></i> Take the Quiz
      </button>
    </div>
  </div>

  <!-- QUIZ SECTION -->
  <div class="card quiz-section" id="quizSection">
    <div style="text-align:center;margin-bottom:20px;">
      <h2 style="font-family:'Playfair Display';color:var(--gold);font-size:1.8rem;">Knowledge Check</h2>
      <p style="color:var(--text-secondary);margin-top:6px;">Test what you've learned</p>
    </div>
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="quiz-card" id="quizCard"></div>
    <div class="quiz-result" id="quizResult"></div>
  </div>
</div>

<script>
// ===================== STATE =====================
const state = {
  pages: [],
  spread: 0,
  voice: true,
  flipping: false,
  quiz: {
    questions: [],
    index: 0,
    score: 0,
    answered: 0
  }
};

// ===================== DOM =====================
const $ = id => document.getElementById(id);
const DOM = {
  editor: $('editor'),
  createBookBtn: $('createBookBtn'),
  sampleBtn: $('sampleBtn'),
  bookSection: $('bookSection'),
  leftPC: $('leftPC'),
  rightPC: $('rightPC'),
  leftPage: $('leftPage'),
  rightPage: $('rightPage'),
  prevBtn: $('prevBtn'),
  nextBtn: $('nextBtn'),
  pageIndicator: $('pageIndicator'),
  voiceToggle: $('voiceToggle'),
  speakingBadge: $('speakingBadge'),
  speakingStatus: $('speakingStatus'),
  stopSpeakBtn: $('stopSpeakBtn'),
  startQuizBtn: $('startQuizBtn'),
  quizSection: $('quizSection'),
  quizProgress: $('quizProgress'),
  quizCard: $('quizCard'),
  quizResult: $('quizResult')
};

// ===================== SAMPLE CONTENT =====================
const SAMPLE = `The Water Cycle: Earth's Great Recycler

Water is always moving. The water cycle is the continuous movement of water through Earth's environment. It has no beginning and no end — it is a cycle.

Evaporation is the first stage. When the sun heats up water in rivers, lakes, and oceans, the water turns into water vapor and rises into the air. This process is called evaporation.

Condensation follows next. As water vapor rises higher into the atmosphere, it cools down and turns back into tiny water droplets. These droplets cluster together to form clouds. This is called condensation.

Precipitation brings water back to Earth. When clouds collect enough water droplets, the water falls back to Earth as rain, snow, sleet, or hail. This is called precipitation.

Collection happens on the ground. Water that falls collects in oceans, rivers, lakes, and underground. Then the cycle begins again with evaporation.

The water you drink today may have fallen as rain millions of years ago. The water cycle ensures that Earth's water supply is constantly cleaned and recycled.`;

DOM.sampleBtn.onclick = () => {
  DOM.editor.value = SAMPLE;
};

// ===================== TEXT PROCESSING =====================
function splitIntoPages(text) {
  // Split into paragraphs/sentences, chunk into readable page units
  const paras = text.split(/\n+/).map(p => p.trim()).filter(p => p.length > 20);
  const pages = [];
  let chunk = '';

  paras.forEach(para => {
    if ((chunk + ' ' + para).length > 320 && chunk.length > 0) {
      pages.push(chunk.trim());
      chunk = para;
    } else {
      chunk = chunk ? chunk + '\n\n' + para : para;
    }
  });
  if (chunk.trim()) pages.push(chunk.trim());

  // Ensure at least 2 pages
  if (pages.length === 1) {
    const mid = Math.floor(pages[0].length / 2);
    const breakPoint = pages[0].indexOf(' ', mid);
    if (breakPoint > -1) {
      const first = pages[0].slice(0, breakPoint);
      const second = pages[0].slice(breakPoint + 1);
      pages.splice(0, 1, first, second);
    }
  }

  return pages.map((text, i) => ({ text, pageNum: i + 1, imageUrl: null }));
}

// ===================== IMAGE GENERATION =====================
function extractKeyword(text) {
  const words = text.toLowerCase().match(/\b[a-z]{5,}\b/g) || [];
  const stopWords = new Set(['their','about','which','there','where','these','those','would','could','should','other','after','before','every','might','still','water','cycle','earth']);
  const keywords = words.filter(w => !stopWords.has(w));
  return keywords[Math.floor(Math.random() * Math.min(keywords.length, 8))] || 'nature';
}

const imageCategories = ['nature','education','science','art','books','sky','forest','ocean','mountains','learning'];

function getPageImageUrl(page, index) {
  const keyword = extractKeyword(page.text);
  // Use Unsplash for beautiful free images
  const seed = index * 37 + page.text.charCodeAt(0);
  return `https://source.unsplash.com/800x500/?${encodeURIComponent(keyword)},${imageCategories[index % imageCategories.length]}&sig=${seed}`;
}

// ===================== PAGE RENDERING =====================
function buildPageHTML(pageObj, isRight) {
  if (!pageObj) {
    return `<div class="page-inner"><div style="display:flex;align-items:center;justify-content:center;height:100%;opacity:0.3;font-size:2rem;">📖</div></div>`;
  }
  const imgUrl = pageObj.imageUrl || getPageImageUrl(pageObj, pageObj.pageNum - 1);
  if (!pageObj.imageUrl) pageObj.imageUrl = imgUrl;

  return `
    <div class="page-inner">
      <div class="page-image-wrap">
        <img class="page-image" src="${imgUrl}" alt="Illustration" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<div class=page-image-placeholder>📚</div>'">
      </div>
      <div class="page-text">${pageObj.text}</div>
      <div class="page-num">— ${pageObj.pageNum} —</div>
    </div>
  `;
}

function renderSpread() {
  const L = state.spread * 2;
  const R = L + 1;
  const leftObj = state.pages[L] || null;
  const rightObj = state.pages[R] || null;

  DOM.leftPage.innerHTML = buildPageHTML(leftObj, false);
  DOM.rightPage.innerHTML = buildPageHTML(rightObj, true);

  DOM.pageIndicator.textContent = `Page ${L + 1}${rightObj ? ` – ${R + 1}` : ''} of ${state.pages.length}`;
  DOM.prevBtn.disabled = state.spread === 0;
  DOM.nextBtn.disabled = R >= state.pages.length - 1;

  // Narrate left page
  if (state.voice && leftObj) {
    setTimeout(() => speakText(leftObj.text), 600);
  }
}

// ===================== WEB SPEECH API =====================
function speakText(text) {
  if (!state.voice) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.92;
  utt.pitch = 1.05;
  utt.volume = 1;

  // Prefer a pleasant voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /Samantha|Google US|Aria|Jenny|Ava/i.test(v.name)) || voices[0];
  if (preferred) utt.voice = preferred;

  utt.onstart = () => {
    DOM.speakingBadge.classList.add('active');
    DOM.speakingStatus.textContent = 'Reading aloud...';
  };
  utt.onend = () => DOM.speakingBadge.classList.remove('active');
  utt.onerror = () => DOM.speakingBadge.classList.remove('active');
  window.speechSynthesis.speak(utt);
}

DOM.stopSpeakBtn.onclick = () => {
  window.speechSynthesis.cancel();
  DOM.speakingBadge.classList.remove('active');
};

DOM.voiceToggle.onclick = () => {
  state.voice = !state.voice;
  DOM.voiceToggle.classList.toggle('active', state.voice);
  if (!state.voice) {
    window.speechSynthesis.cancel();
    DOM.speakingBadge.classList.remove('active');
  }
};

// ===================== QUIZ GENERATION =====================
function generateQuiz(pages) {
  const allText = pages.map(p => p.text).join(' ');
  const sentences = allText.match(/[^.!?]+[.!?]/g) || [];
  const questions = [];
  const used = new Set();

  sentences.forEach(sent => {
    sent = sent.trim();
    if (sent.length < 40 || used.has(sent)) return;

    // Find a keyword to blank out (4-8 chars, not stopwords)
    const words = sent.match(/\b[A-Za-z]{4,10}\b/g) || [];
    const stopWords = new Set(['that','this','with','from','they','have','been','were','will','when','what','which','their','there','about','into','than','then','also','more','some','such','only','after','before','other','these','those','would','could','should']);
    const candidates = words.filter(w => !stopWords.has(w.toLowerCase()) && /^[a-z]/i.test(w));
    if (candidates.length < 1) return;

    const answer = candidates[Math.floor(Math.random() * candidates.length)];
    const question = sent.replace(new RegExp('\\b' + answer + '\\b', 'i'), '______');

    if (question === sent) return; // no replacement happened

    // Generate wrong options from other sentences
    const wrongPool = sentences
      .filter(s => s !== sent)
      .flatMap(s => (s.match(/\b[A-Za-z]{4,10}\b/g) || []))
      .filter(w => !stopWords.has(w.toLowerCase()) && w.toLowerCase() !== answer.toLowerCase());

    const wrongs = [];
    const wset = new Set([answer.toLowerCase()]);
    for (const w of wrongPool) {
      if (!wset.has(w.toLowerCase())) {
        wrongs.push(w);
        wset.add(w.toLowerCase());
      }
      if (wrongs.length >= 3) break;
    }
    if (wrongs.length < 3) return;

    used.add(sent);
    const options = shuffleArray([answer, ...wrongs.slice(0,3)]);
    questions.push({
      question: `Fill in the blank: "${question}"`,
      options,
      correctIndex: options.indexOf(answer),
      correctAnswer: answer
    });

    if (questions.length >= 10) return;
  });

  // If too few, add comprehension questions
  if (questions.length < 5) {
    pages.forEach(page => {
      const words = page.text.match(/[A-Z][a-z]+(?:\s[A-Z][a-z]+)*/g) || [];
      if (words.length > 0) {
        const ans = words[0];
        questions.push({
          question: `Which of the following is mentioned in the text on page ${page.pageNum}?`,
          options: shuffleArray([ans, 'Dragon', 'Volcano', 'Spaceship']),
          correctIndex: 0,
          correctAnswer: ans
        });
      }
    });
  }

  return questions.slice(0, 10);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===================== QUIZ RENDERING =====================
function renderQuizQuestion() {
  const q = state.quiz.questions[state.quiz.index];
  if (!q) { showQuizResults(); return; }

  // Progress dots
  const total = Math.min(state.quiz.questions.length, 10);
  DOM.quizProgress.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'quiz-dot' + (i === state.quiz.index ? ' active' : '');
    DOM.quizProgress.appendChild(dot);
  }

  DOM.quizCard.innerHTML = `
    <div class="quiz-q">Q${state.quiz.index + 1}. ${q.question}</div>
    ${q.options.map((opt, i) => `
      <button class="quiz-opt" data-i="${i}" onclick="selectAnswer(this, ${i})">
        ${String.fromCharCode(65 + i)}. ${opt}
      </button>
    `).join('')}
    <div class="quiz-feedback" id="qFeedback"></div>
    <div style="text-align:right;margin-top:18px;">
      <button class="btn btn-primary" id="submitQ" onclick="submitAnswer()" disabled>
        Submit Answer
      </button>
    </div>
  `;
  DOM.quizResult.classList.remove('show');
}

window.selectAnswer = function(el, idx) {
  document.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  $('submitQ').disabled = false;
  $('submitQ')._chosen = idx;
};

window.submitAnswer = function() {
  const chosen = $('submitQ')._chosen;
  if (chosen === undefined) return;

  const q = state.quiz.questions[state.quiz.index];
  const isCorrect = chosen === q.correctIndex;
  if (isCorrect) state.quiz.score++;
  state.quiz.answered++;

  // Color the options
  document.querySelectorAll('.quiz-opt').forEach((el, i) => {
    el.disabled = true;
    if (i === q.correctIndex) el.classList.add('correct-answer');
    else if (i === chosen && !isCorrect) el.classList.add('wrong-answer');
  });

  const fb = $('qFeedback');
  fb.className = `quiz-feedback show ${isCorrect ? 'correct' : 'incorrect'}`;
  fb.innerHTML = isCorrect
    ? `<strong>✅ Correct!</strong> Well done.`
    : `<strong>❌ Not quite.</strong> The correct answer is: <strong>${q.correctAnswer}</strong>`;

  // Update dot
  const dots = DOM.quizProgress.querySelectorAll('.quiz-dot');
  if (dots[state.quiz.index]) {
    dots[state.quiz.index].className = `quiz-dot ${isCorrect ? 'correct' : 'incorrect'}`;
  }

  $('submitQ').textContent = 'Next Question →';
  $('submitQ').disabled = false;
  $('submitQ').onclick = () => {
    state.quiz.index++;
    if (state.quiz.index >= state.quiz.questions.length) {
      showQuizResults();
    } else {
      renderQuizQuestion();
    }
  };
};

function showQuizResults() {
  const pct = Math.round((state.quiz.score / state.quiz.answered) * 100);
  let grade = '📚 Keep reading!';
  let color = 'var(--warn)';
  if (pct >= 90) { grade = '🌟 Outstanding!'; color = 'var(--success)'; }
  else if (pct >= 75) { grade = '👏 Great job!'; color = 'var(--gold)'; }
  else if (pct >= 60) { grade = '👍 Good effort!'; color = 'var(--gold-dark)'; }

  DOM.quizCard.innerHTML = '';
  DOM.quizResult.classList.add('show');
  DOM.quizResult.innerHTML = `
    <div style="font-size:4rem;margin-bottom:16px;">🎓</div>
    <h3 style="font-family:'Playfair Display';font-size:1.8rem;color:var(--gold)">Quiz Complete!</h3>
    <div class="quiz-score" style="color:${color}">${state.quiz.score} / ${state.quiz.answered}</div>
    <div style="font-size:2rem;margin:8px 0;">${pct}%</div>
    <p style="color:var(--text-secondary);font-size:1.2rem;margin-bottom:28px;">${grade}</p>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="restartQuiz()"><i class="fas fa-redo"></i> Try Again</button>
      <button class="btn btn-secondary" onclick="backToBook()"><i class="fas fa-book-open"></i> Back to Book</button>
    </div>
  `;
}

window.restartQuiz = function() {
  state.quiz.index = 0;
  state.quiz.score = 0;
  state.quiz.answered = 0;
  DOM.quizResult.classList.remove('show');
  renderQuizQuestion();
};

window.backToBook = function() {
  DOM.quizSection.classList.remove('visible');
  DOM.bookSection.scrollIntoView({ behavior: 'smooth' });
};

// ===================== BOOK CREATION =====================
DOM.createBookBtn.onclick = async function() {
  const text = DOM.editor.value.trim();
  if (!text || text.length < 50) {
    alert('Please enter at least a paragraph of content.');
    return;
  }

  DOM.createBookBtn.disabled = true;
  DOM.createBookBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
  window.speechSynthesis.cancel();
  DOM.speakingBadge.classList.remove('active');

  // Small delay for UX
  await new Promise(r => setTimeout(r, 300));

  state.pages = splitIntoPages(text);
  state.spread = 0;

  // Generate quiz
  state.quiz.questions = generateQuiz(state.pages);
  state.quiz.index = 0;
  state.quiz.score = 0;
  state.quiz.answered = 0;

  DOM.bookSection.classList.add('visible');
  renderSpread();

  if (state.quiz.questions.length > 0) {
    DOM.startQuizBtn.style.display = 'inline-flex';
  }

  DOM.bookSection.scrollIntoView({ behavior: 'smooth' });
  DOM.createBookBtn.disabled = false;
  DOM.createBookBtn.innerHTML = '<i class="fas fa-book-open"></i> Create FlipBook';
};

// ===================== NAV BUTTONS =====================
function doFlip(dir) {
  if (state.flipping) return;
  if (dir === 'next' && (state.spread * 2 + 1) >= state.pages.length - 1) return;
  if (dir === 'prev' && state.spread === 0) return;

  state.flipping = true;
  window.speechSynthesis.cancel();
  DOM.speakingBadge.classList.remove('active');

  if (dir === 'next') {
    DOM.rightPC.style.transform = 'rotateY(-180deg)';
  } else {
    DOM.leftPC.style.transform = 'rotateY(180deg)';
  }

  setTimeout(() => {
    state.spread += dir === 'next' ? 1 : -1;
    DOM.leftPC.style.transform = '';
    DOM.rightPC.style.transform = '';
    renderSpread();
    state.flipping = false;
  }, 400);
}

DOM.nextBtn.onclick = () => doFlip('next');
DOM.prevBtn.onclick = () => doFlip('prev');

DOM.startQuizBtn.onclick = () => {
  window.speechSynthesis.cancel();
  DOM.speakingBadge.classList.remove('active');
  DOM.quizSection.classList.add('visible');
  state.quiz.index = 0;
  state.quiz.score = 0;
  state.quiz.answered = 0;
  renderQuizQuestion();
  DOM.quizSection.scrollIntoView({ behavior: 'smooth' });
};

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') doFlip('next');
  if (e.key === 'ArrowLeft') doFlip('prev');
});

// Load voices async
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
