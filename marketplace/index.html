        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;

        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

        .gradient-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }
        
        .btn-primary {
            background-color: var(--primary);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }
        
        .product-card {
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .badge-bestseller {
            background-color: #fef3c7;
            color: #92400e;
        }
        
        .badge-new {
            background-color: #dbeafe;
            color: #075985;
        }
        
        .category-btn {
            transition: all 0.2s ease;
        }
        
        .category-btn.active {
            background-color: var(--primary);
            color: white;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            background-color: #10b981;
            color: white;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
            z-index: 50;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #8b5cf6;
        }
    </style>

        // Render Products
        function renderProducts(filter = 'all') {
            const container = document.getElementById('products-container');
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            container.innerHTML = filtered.map(product => `
                <a href="${product.stripeLink}" target="_blank" rel="noopener noreferrer" class="product-card rounded-lg p-6 bg-white block no-underline hover:no-underline">
                    <div class="product-image mb-4">${product.emoji}</div>
                    
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold text-gray-900 flex-1">${product.name}</h3>
                        <div class="flex gap-2">
                            ${product.bestseller ? '<span class="badge-bestseller text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap">BESTSELLER</span>' : ''}
                            ${product.new ? '<span class="badge-new text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap">NEW</span>' : ''}
                        </div>
                    </div>
                    
                    <p class="text-gray-600 text-sm mb-4 line-clamp-2">${product.description}</p>
                    
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-purple-600">$${product.price.toFixed(2)}</span>
                        <button onclick="event.preventDefault(); buyNow('${product.name}', ${product.price}, '${product.stripeLink}')" class="btn-primary text-white font-bold px-4 py-2 rounded-lg text-sm">
                            Buy Now →
                        </button>
                    </div>
                </a>
            `).join('');
        }
        
        // Buy Now Function
        function buyNow(productName, price, stripeLink) {
            showToast(`✅ Opening secure checkout for ${productName}...`);
            window.open(stripeLink, '_blank');
        }
        
        // Category Filter
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active', 'bg-purple-100', 'text-purple-900'));
                btn.classList.add('active', 'bg-purple-100', 'text-purple-900');
                renderProducts(btn.dataset.category);
            });
        });
        
        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
        });
