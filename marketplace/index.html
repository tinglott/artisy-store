        // Render Products
        function renderProducts(filter = 'all') {
            const container = document.getElementById('products-container');
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            container.innerHTML = filtered.map(product => `
                <a href="${product.stripeLink}" target="_blank" rel="noopener noreferrer" class="product-card rounded-lg p-6 bg-white block no-underline hover:no-underline">
                    <div class="product-image mb-4">${product.image ? `<img src="${product.image}" alt="${product.name} cover" loading="lazy">` : product.emoji}</div>
                    
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold text-gray-900 flex-1">${product.name}</h3>
                        <div class="flex gap-2">
                            ${product.bestseller ? '<span class="badge-bestseller text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap">BESTSELLER</span>' : ''}
                            ${product.new ? '<span class="badge-new text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap">NEW</span>' : ''}
                        </div>
                    </div>
                    
                    <p class="text-gray-600 text-sm mb-4 line-clamp-2">${product.description}</p>
                    
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-purple-600">${product.price === 0 ? 'Free' : '$' + product.price.toFixed(2)}</span>
                        <button onclick="event.preventDefault(); buyNow('${product.name}', ${product.price}, '${product.stripeLink}')" class="btn-primary text-white font-bold px-4 py-2 rounded-lg text-sm">
                            ${product.actionLabel || 'Buy Now →'}
                        </button>
                    </div>
                </a>
            `).join('');
        }
        
        // Buy Now Function
        function buyNow(productName, price, stripeLink) {
            showToast(price === 0 ? `🧱 Opening ${productName}...` : `✅ Opening secure checkout for ${productName}...`);
            window.open(stripeLink, '_blank');
        }
        
        // Category Filter
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active', 'bg-purple-100', 'text-purple-900'));
                btn.classList.add('active', 'bg-purple-100', 'text-purple-900');
                renderProducts(btn.dataset.category);
            });
        });
        
        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
        });
    </script>
