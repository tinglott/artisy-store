services:
  - type: web
    name: nexus-automation-hub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GROK_API_KEY
        scope: build,runtime
      - key: GOOGLE_GENAI_API_KEY
        scope: build,runtime
      - key: CONTENT360_API_KEY
        scope: build,runtime
      - key: CONTENT360_WORKSPACE
        scope: build,runtime
      - key: WHOP_API_KEY
        scope: build,runtime