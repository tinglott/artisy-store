<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Nap Time Adventures</title>
<style>
  :root {
    --bg: #0a0a2e;
    --bg2: #111148;
    --card: #1a1a4e;
    --accent: #ffd700;
    --accent2: #87ceeb;
    --text: #e8e8ff;
    --muted: #9999cc;
    --green: #44ff99;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* Stars background */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 5%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 20%, rgba(255,255,255,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 8%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(2px 2px at 65% 12%, rgba(255,220,100,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 55%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(2px 2px at 80% 70%, rgba(255,220,100,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 85%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.6) 0%, transparent 100%);
  }

  .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
  header { text-align: center; padding: 40px 0 30px; }
  header .moon { font-size: 64px; line-height: 1; margin-bottom: 12px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  header h1 { font-size: 2.4rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
  header p { color: var(--accent2); margin-top: 8px; font-size: 1.05rem; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--card); border-radius: var(--radius); padding: 6px; }
  .tab { flex: 1; padding: 10px; border: none; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
  .tab.active { background: var(--bg2); color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Lullaby section */
  .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .song-card { background: var(--card); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; text-align: center; }
  .song-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .song-card.playing { border-color: var(--green); background: #1a3a2a; }
  .song-card .emoji { font-size: 2rem; margin-bottom: 8px; }
  .song-card .name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .song-card .duration { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .song-card .play-btn { margin-top: 10px; font-size: 1.4rem; }

  .player-bar { background: var(--card); border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .player-bar .now-playing { flex: 1; }
  .player-bar .now-playing .label { font-size: 0.75rem; color: var(--muted); }
  .player-bar .now-playing .title { font-weight: 700; color: var(--accent); }
  .player-controls { display: flex; gap: 10px; align-items: center; }
  .btn-ctrl { background: var(--bg); border: 2px solid var(--muted); color: var(--text); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
  .btn-ctrl:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ctrl.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-size: 1.2rem; width: 52px; height: 52px; }
  .volume-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .volume-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .volume-row label { color: var(--muted); font-size: 0.8rem; min-width: 50px; }

  .section-title { font-size: 1.1rem; font-weight: 700; color: var(--accent2); margin-bottom: 12px; margin-top: 20px; }
  .sounds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .sound-card { background: var(--card); border-radius: 12px; padding: 14px; cursor: pointer; text-align: center; border: 2px solid transparent; transition: all 0.2s; }
  .sound-card:hover { border-color: var(--accent2); }
  .sound-card.playing { border-color: var(--green); background: #0a2a1e; }
  .sound-card .emoji { font-size: 1.8rem; }
  .sound-card .name { font-size: 0.8rem; font-weight: 600; margin-top: 6px; }

  /* Stories section */
  .story-select { background: var(--card); border: 2px solid var(--muted); border-radius: var(--radius); padding: 12px 16px; width: 100%; color: var(--text); font-size: 1rem; cursor: pointer; margin-bottom: 16px; }
  .story-select:focus { outline: none; border-color: var(--accent); }
  .story-card { background: var(--card); border-radius: var(--radius); padding: 24px; line-height: 1.8; }
  .story-card h2 { color: var(--accent); font-size: 1.4rem; margin-bottom: 16px; }
  .story-card p { color: var(--text); margin-bottom: 12px; font-size: 1rem; }
  .story-nav { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
  .btn { background: var(--accent); color: var(--bg); padding: 10px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.95rem; transition: all 0.2s; }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn.secondary { background: var(--card); color: var(--text); border: 2px solid var(--muted); }
  .btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* Dream Journal */
  .journal-form { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .journal-form textarea { width: 100%; background: var(--bg); border: 2px solid var(--muted); border-radius: 10px; color: var(--text); padding: 12px; font-size: 0.95rem; resize: vertical; min-height: 100px; font-family: inherit; }
  .journal-form textarea:focus { outline: none; border-color: var(--accent); }
  .journal-form input[type=text] { width: 100%; background: var(--bg); border: 2px solid var(--muted); border-radius: 10px; color: var(--text); padding: 10px 14px; font-size: 0.95rem; margin-bottom: 10px; font-family: inherit; }
  .journal-form input:focus { outline: none; border-color: var(--accent); }
  .entries { display: flex; flex-direction: column; gap: 12px; }
  .entry { background: var(--card); border-radius: 12px; padding: 16px; border-left: 4px solid var(--accent); }
  .entry .entry-date { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .entry .entry-title { font-weight: 700; color: var(--accent2); margin-bottom: 6px; }
  .entry .entry-text { font-size: 0.9rem; color: var(--text); line-height: 1.6; }
  .entry .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; float: right; font-size: 1rem; }
  .entry .delete-btn:hover { color: #ff6b6b; }
  .empty-state { text-align: center; padding: 40px; color: var(--muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

  /* Responsive */
  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
    .song-grid { grid-template-columns: repeat(2, 1fr); }
    .sounds-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="moon">🌙</div>
    <h1>Nap Time Adventures</h1>
    <p>Soothing lullabies & bedtime stories for little dreamers ✨</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('lullabies')">🎵 Lullabies</button>
    <button class="tab" onclick="showTab('sounds')">🌿 Sleep Sounds</button>
    <button class="tab" onclick="showTab('stories')">📖 Stories</button>
    <button class="tab" onclick="showTab('journal')">✏️ Dream Journal</button>
  </div>

  <!-- Lullabies Panel -->
  <div id="panel-lullabies" class="panel active">
    <div class="player-bar" id="playerBar" style="display:none">
      <span id="playerEmoji" style="font-size:2rem">🎵</span>
      <div class="now-playing">
        <div class="label">Now playing</div>
        <div class="title" id="playerTitle">—</div>
      </div>
      <div class="player-controls">
        <button class="btn-ctrl" onclick="prevTrack()" title="Previous">⏮</button>
        <button class="btn-ctrl primary" id="playPauseBtn" onclick="togglePlay()">▶</button>
        <button class="btn-ctrl" onclick="nextTrack()" title="Next">⏭</button>
      </div>
    </div>
    <div class="volume-row">
      <label>🔊 Volume</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)">
    </div>

    <div class="section-title" style="margin-top:20px">🎶 Lullabies</div>
    <div class="song-grid" id="songGrid"></div>
  </div>

  <!-- Sleep Sounds Panel -->
  <div id="panel-sounds" class="panel">
    <p style="color:var(--muted);margin-bottom:16px;font-size:0.9rem">Mix soothing background sounds with your lullabies for deeper sleep 💤</p>
    <div class="sounds-grid" id="soundsGrid"></div>
    <div class="volume-row" style="margin-top:16px">
      <label>🎚 Sound Vol</label>
      <input type="range" id="soundVolumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="setSoundVolume(this.value)">
    </div>
  </div>

  <!-- Stories Panel -->
  <div id="panel-stories" class="panel">
    <select class="story-select" id="storySelect" onchange="loadStory(this.value)">
      <option value="">— Pick a bedtime story —</option>
    </select>
    <div id="storyContainer"></div>
  </div>

  <!-- Dream Journal Panel -->
  <div id="panel-journal" class="panel">
    <div class="journal-form">
      <input type="text" id="entryTitle" placeholder="Dream title (e.g. The Flying Castle)">
      <textarea id="entryText" placeholder="What did you dream about? Write it here while you still remember... 🌙"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="btn" onclick="saveEntry()">Save Dream ✨</button>
      </div>
    </div>
    <div id="entriesList"></div>
  </div>
</div>

<audio id="mainAudio" preload="none"></audio>
<audio id="ambientAudio" preload="none" loop></audio>

<script>
const HF_CDN = "./audio";

const LULLABIES = [
  { id: "twinkle-twinkle", name: "Twinkle Twinkle", emoji: "⭐", file: "twinkle-twinkle.mp3" },
  { id: "saties-lullaby", name: "Satie's Lullaby", emoji: "🎹", file: "saties-lullaby.mp3" },
  { id: "sleep-tight", name: "Sleep Tight", emoji: "🛏️", file: "sleep-tight.mp3" },
  { id: "summer-lullaby", name: "Summer Lullaby", emoji: "☀️", file: "summer-lullaby.mp3" },
  { id: "sweet-lullaby", name: "Sweet Lullaby", emoji: "🍯", file: "sweet-lullaby.mp3" },
  { id: "sweet-ay-ay", name: "Sweet Ay Ay", emoji: "🎵", file: "sweet-ay-ay.mp3" },
];

const SOUNDS = [
  { id: "gentle-rain", name: "Gentle Rain", emoji: "🌧️", file: "gentle-rain.mp3" },
  { id: "ocean-waves", name: "Ocean Waves", emoji: "🌊", file: "ocean-waves.mp3" },
  { id: "forest-sounds", name: "Forest", emoji: "🌲", file: "forest-sounds.mp3" },
  { id: "babbling-stream", name: "Stream", emoji: "💧", file: "babbling-stream.mp3" },
  { id: "white-noise", name: "White Noise", emoji: "📻", file: "white-noise.mp3" },
  { id: "pink-noise", name: "Pink Noise", emoji: "🩷", file: "pink-noise.mp3" },
  { id: "brown-noise", name: "Brown Noise", emoji: "🤎", file: "brown-noise.mp3" },
];

const STORIES = [
  {
    id: "luna-star",
    title: "Luna and the Falling Star",
    pages: [
      "Once upon a time, high above the sleepy town of Willowbrook, lived a little star named Luna. Luna was the smallest star in the whole night sky, but she had the brightest twinkle of all.",
      "One evening, Luna leaned a little too far over the edge of her cloud to wave at a child in a window below. Whoooosh! She tumbled through the night sky, spinning and glittering all the way down.",
      "Luna landed softly in a garden, right in the middle of a bed of lavender. A little girl named Maisie looked out her window and gasped. 'A star! A real star fell into our garden!'",
      "Maisie crept downstairs and out the back door in her pajamas. She found Luna nestled among the purple flowers, glowing warm and golden. 'Are you lost?' she whispered.",
      "'A little,' admitted Luna. 'I was trying to wave hello, and I fell.' Maisie smiled and gently cupped Luna in her palms. The star felt like holding the warmth of a summer afternoon.",
      "That night, Maisie fell asleep with Luna on her windowsill, lighting the room with the softest glow. And from then on, every night when Maisie looked up at the sky, she always found one star twinkling extra bright — just for her. 🌟 Sweet dreams.",
    ],
  },
  {
    id: "cloud-bunny",
    title: "The Cloud Bunny's Bedtime Hop",
    pages: [
      "Up in the sky where the clouds are fluffiest lives a small white bunny named Pip. Pip isn't an ordinary bunny — she can hop from cloud to cloud all the way across the sky.",
      "Every evening, it was Pip's special job to hop across the sky and pull the soft purple blanket of night over the horizon. Without Pip, the stars would have to wait forever to come out.",
      "One evening, Pip found a baby cloud that was too small to hop onto. The little cloud was crying tiny raindrops. 'What's wrong?' asked Pip.",
      "'I'm too little to be part of the sunset,' the baby cloud whimpered. Pip thought for a moment, then smiled. 'Every sky needs a little cloud. You're going to make the best, most beautiful pink wisp in the whole sunset.'",
      "And she was right! As Pip hopped across, the tiny cloud turned the most magnificent shade of rose and gold, and all the other clouds cheered.",
      "When the last star winked on and the moon rose up smiling, Pip curled into a soft cloud and closed her eyes. And somewhere below, a child looked up and whispered, 'I can see a bunny in the clouds.' 🐰 Sweet dreams.",
    ],
  },
  {
    id: "captain-yawn",
    title: "Captain Yawn and the Sleepy Seas",
    pages: [
      "Every night, when the world grows quiet and the lamps go out, Captain Yawn sets sail on the Sleepy Seas. His ship is made of moonlight and his sails are made of the softest fog.",
      "Captain Yawn's job is very important: he sails from house to house, sprinkling sleepy dust on pillows and tucking blankets under chins.",
      "One night, he heard a small voice calling from a bedroom window. 'Captain Yawn! I can't sleep!' It was a boy named Theo, sitting up in bed with very wide eyes.",
      "'Aha,' said the Captain, stroking his starry beard. 'I think I forgot your pillow.' He reached into his magic bag and pulled out a pinch of lavender-colored dust.",
      "He sprinkled it gently over Theo's pillow. It smelled like warm cookies and night-blooming flowers. Theo lay back down and felt his eyes grow heavy almost immediately.",
      "'Thank you, Captain Yawn,' he murmured sleepily. But the Captain was already gone, his ship leaving a trail of silver sparkles on the water. 🌊 Sleep well, little sailor.",
    ],
  },
  {
    id: "sleepy-dragon",
    title: "Ember the Sleepy Dragon",
    pages: [
      "Deep inside Moonstone Mountain lived a very small dragon named Ember. Ember was different from other dragons — instead of breathing fire, she breathed warm golden light that made everything feel cozy.",
      "Every night, Ember would fly through the village and peek into windows. When she found a child who couldn't sleep, she'd breathe her golden light gently through the crack in the curtains.",
      "The light was like sunshine but softer — it smelled like chamomile tea and felt like a warm hug. Children who saw it would always, always fall asleep with a smile.",
      "One evening, Ember peeked into a window and found a little girl named Zara staring at the ceiling. Zara was worried about something — she couldn't even say what.",
      "Ember breathed her golden light, and Zara felt all her worries float away like bubbles. She imagined each bubble floating up, up, up into the night sky and popping into tiny stars.",
      "Ember watched until Zara's eyes closed and her breathing became slow and deep. Then she flapped her tiny wings and flew back toward Moonstone Mountain, leaving a glow of gold behind her. 🐉 Dream warm dreams.",
    ],
  },
  {
    id: "moon-gardener",
    title: "The Moon's Secret Garden",
    pages: [
      "Most people think the moon is bare and empty. But if you look very carefully on the clearest nights, you can just see the edges of the Moon Gardener's flowers.",
      "The Moon Gardener is an old woman with silver hair who plants dreams. Each flower in her garden is a different dream — yellow ones are adventure dreams, blue ones are flying dreams, pink ones are dreams about home.",
      "Every night before you fall asleep, the Moon Gardener walks through her garden and picks the perfect dream for you. She thinks carefully about who you are and what you love.",
      "For children who love animals, she picks a dream about talking horses or friendly tigers. For children who love the sea, she picks a dream where you can breathe underwater.",
      "She places the dream in a tiny seed pod and sends it drifting down on the night breeze, through your window, and into your pillow — ready for when you close your eyes.",
      "So tonight, when you lay your head down, know that somewhere up on the moon, someone is choosing something wonderful just for you. 🌸 What will you dream?",
    ],
  },
  {
    id: "counting-sheep",
    title: "101 Fluffy Sheep",
    pages: [
      "On the other side of sleep — just past where the yawns begin and the blinks slow down — there is a green meadow where 101 fluffy sheep are always waiting.",
      "Their wool is cloud-soft and snow-white, and they know just what to do. One by one, they walk up to a little wooden fence and jump over it with a soft thump.",
      "Sheep number one was named Biscuit. She had particularly bouncy hops. Sheep number two was named Fluff. Fluff always sneezed right before he jumped, which made everyone smile.",
      "Sheep number three was Pudding, who was the fluffiest of all. You could barely see her legs under all that wool. She waddled up to the fence and floated over like a cotton ball on the breeze.",
      "By the time sheep number twenty-seven — Marshmallow — had jumped the fence, your eyes had become very, very heavy. By sheep forty... it was hard to keep counting.",
      "Sheep number one hundred and one — old Wooly, who wore tiny glasses — jumped the fence last with a gentle sigh. And by then, you were already dreaming. 🐑 One... two... three...",
    ],
  },
];

// State
const mainAudio = document.getElementById('mainAudio');
const ambientAudio = document.getElementById('ambientAudio');
let currentTrack = -1;
let isPlaying = false;
let activeSound = null;

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', t.getAttribute('onclick').includes(name)));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}

// Build song grid
function buildSongGrid() {
  const grid = document.getElementById('songGrid');
  LULLABIES.forEach((song, i) => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.id = 'song-' + i;
    card.innerHTML = `<div class="emoji">${song.emoji}</div><div class="name">${song.name}</div><div class="play-btn">▶</div>`;
    card.onclick = () => playTrack(i);
    grid.appendChild(card);
  });
}

function buildSoundsGrid() {
  const grid = document.getElementById('soundsGrid');
  SOUNDS.forEach(sound => {
    const card = document.createElement('div');
    card.className = 'sound-card';
    card.id = 'sound-' + sound.id;
    card.innerHTML = `<div class="emoji">${sound.emoji}</div><div class="name">${sound.name}</div>`;
    card.onclick = () => toggleSound(sound);
    grid.appendChild(card);
  });
}

function playTrack(i) {
  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('playing'));
  currentTrack = i;
  const song = LULLABIES[i];
  mainAudio.src = `${HF_CDN}/${song.file}`;
  mainAudio.volume = document.getElementById('volumeSlider').value;
  mainAudio.play().then(() => {
    isPlaying = true;
    document.getElementById('playPauseBtn').textContent = '⏸';
    document.getElementById('playerEmoji').textContent = song.emoji;
    document.getElementById('playerTitle').textContent = song.name;
    document.getElementById('playerBar').style.display = 'flex';
    document.getElementById('song-' + i).classList.add('playing');
    document.querySelector('.play-btn', document.getElementById('song-' + i)).textContent = '⏸';
  }).catch(e => console.warn('Playback error:', e));
}

function togglePlay() {
  if (isPlaying) {
    mainAudio.pause();
    isPlaying = false;
    document.getElementById('playPauseBtn').textContent = '▶';
  } else {
    if (currentTrack === -1) { playTrack(0); return; }
    mainAudio.play();
    isPlaying = true;
    document.getElementById('playPauseBtn').textContent = '⏸';
  }
}

function prevTrack() { playTrack((currentTrack - 1 + LULLABIES.length) % LULLABIES.length); }
function nextTrack() { playTrack((currentTrack + 1) % LULLABIES.length); }

mainAudio.onended = () => nextTrack();

function setVolume(v) { mainAudio.volume = v; }
function setSoundVolume(v) { ambientAudio.volume = v; }

function toggleSound(sound) {
  const card = document.getElementById('sound-' + sound.id);
  if (activeSound === sound.id) {
    ambientAudio.pause();
    card.classList.remove('playing');
    activeSound = null;
  } else {
    document.querySelectorAll('.sound-card').forEach(c => c.classList.remove('playing'));
    ambientAudio.src = `${HF_CDN}/${sound.file}`;
    ambientAudio.volume = document.getElementById('soundVolumeSlider').value;
    ambientAudio.play().catch(e => console.warn('Sound error:', e));
    card.classList.add('playing');
    activeSound = sound.id;
  }
}

// Stories
function buildStorySelect() {
  const sel = document.getElementById('storySelect');
  STORIES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.title;
    sel.appendChild(opt);
  });
}

let storyPage = 0;
let currentStory = null;

function loadStory(id) {
  currentStory = STORIES.find(s => s.id === id);
  storyPage = 0;
  renderStory();
}

function renderStory() {
  const container = document.getElementById('storyContainer');
  if (!currentStory) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div class="story-card">
      <h2>${currentStory.title}</h2>
      <p style="color:var(--muted);font-size:0.8rem;margin-bottom:16px">Page ${storyPage + 1} of ${currentStory.pages.length}</p>
      <p>${currentStory.pages[storyPage]}</p>
      <div class="story-nav">
        ${storyPage > 0 ? '<button class="btn secondary" onclick="storyPage--;renderStory()">← Previous</button>' : ''}
        ${storyPage < currentStory.pages.length - 1 ? '<button class="btn" onclick="storyPage++;renderStory()">Next Page →</button>' : '<button class="btn" onclick="loadStory(\'\')">✨ The End</button>'}
      </div>
    </div>`;
}

// Dream Journal (localStorage)
function saveEntry() {
  const title = document.getElementById('entryTitle').value.trim();
  const text = document.getElementById('entryText').value.trim();
  if (!text) return;
  const entries = getEntries();
  entries.unshift({ id: Date.now(), title: title || 'Untitled Dream', text, date: new Date().toLocaleDateString() });
  localStorage.setItem('naptime-dreams', JSON.stringify(entries));
  document.getElementById('entryTitle').value = '';
  document.getElementById('entryText').value = '';
  renderEntries();
}

function getEntries() {
  try { return JSON.parse(localStorage.getItem('naptime-dreams') || '[]'); } catch { return []; }
}

function deleteEntry(id) {
  const entries = getEntries().filter(e => e.id !== id);
  localStorage.setItem('naptime-dreams', JSON.stringify(entries));
  renderEntries();
}

function renderEntries() {
  const list = document.getElementById('entriesList');
  const entries = getEntries();
  if (!entries.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🌙</div><p>No dreams recorded yet.<br>Start writing your first dream!</p></div>';
    return;
  }
  list.innerHTML = '<div class="entries">' + entries.map(e => `
    <div class="entry">
      <button class="delete-btn" onclick="deleteEntry(${e.id})">✕</button>
      <div class="entry-date">${e.date}</div>
      <div class="entry-title">${e.title}</div>
      <div class="entry-text">${e.text}</div>
    </div>`).join('') + '</div>';
}

// Init
buildSongGrid();
buildSoundsGrid();
buildStorySelect();
renderEntries();
</script>
</body>
</html>
