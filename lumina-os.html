<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA OS v2.2 - Grok Powered</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .message { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 overflow-hidden">
    <div id="root"></div>

    <script>
        const { useState, useRef, useEffect } = React;

        const BRAND = {
            black: "#0A0A0F", gold: "#C9A84C", goldLight: "#E2C46A",
            surface: "#111118", surfaceHover: "#18181F", border: "#1E1E2A",
            text: "#E8E8EE", muted: "#6B6B80", accent: "#7B5EA7", green: "#3DDC84", red: "#FF5A5A",
        };

        // Grok API key obfuscated (base64)
        const GROK_KEY_B64 = "eGFpLWlaVmxWa0paWjNDTTZibU5EQzVtcDJJZ3gySDVJY0pmWk83S2l2UUFLLVNDU0NWNUxSRGRFNm45NDFdVWZuUG5VemlzSlN6SkRDMTRzcU9NbXI=";
        function getGrokKey() {
            return atob(GROK_KEY_B64);
        }

        class RAGEngine {
            constructor() {
                this.docs = JSON.parse(localStorage.getItem("lumina_rag") || "[]");
            }

            addDoc(content, meta = {}) {
                const doc = {
                    id: Date.now().toString(36),
                    content: content.trim(),
                    meta,
                    added: new Date().toISOString()
                };
                this.docs.push(doc);
                localStorage.setItem("lumina_rag", JSON.stringify(this.docs));
                return doc;
            }

            search(query, limit = 3) {
                if (!this.docs.length) return [];
                const qWords = new Set(query.toLowerCase().split(/\s+/));
                return this.docs
                    .map(d => {
                        const dWords = d.content.toLowerCase().split(/\s+/);
                        const matches = dWords.filter(w => qWords.has(w)).length;
                        return { ...d, score: matches };
                    })
                    .filter(d => d.score > 0)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, limit);
            }

            clear() {
                this.docs = [];
                localStorage.setItem("lumina_rag", "[]");
            }

            getAll() { return [...this.docs]; }
        }

        async function callGrok(messages, onChunk) {
            const key = getGrokKey();
            const url = "https://api.x.ai/v1/chat/completions";

            const payload = {
                model: "grok-3-latest",
                messages,
                temperature: 0.7,
                stream: true,
                max_tokens: 2000
            };

            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    throw new Error(`Grok API error: ${res.status}`);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const data = line.slice(6);
                            if (data === "[DONE]") continue;
                            try {
                                const json = JSON.parse(data);
                                const delta = json.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullText += delta;
                                    onChunk(fullText);
                                }
                            } catch (e) {}
                        }
                    }
                }

                return fullText;
            } catch (err) {
                console.error(err);
                throw err;
            }
        }

        function LuminaOS() {
            const [messages, setMessages] = useState([
                { role: "system", content: "You are LUMINA, an advanced AI assistant. Be concise, helpful, and insightful. Use markdown for formatting." },
                { role: "assistant", content: "Hello! I'm LUMINA OS, powered by Grok AI. Ask me anything—no token required. ✦" }
            ]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [ragDocs, setRagDocs] = useState([]);
            const [showRAG, setShowRAG] = useState(false);
            const ragEngine = useRef(new RAGEngine());
            const messagesEnd = useRef(null);

            useEffect(() => {
                setRagDocs(ragEngine.current.getAll());
                messagesEnd.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, ragDocs]);

            const send = async () => {
                if (!input.trim() || loading) return;

                const userMsg = input.trim();
                setInput("");
                setMessages(m => [...m, { role: "user", content: userMsg }]);
                setLoading(true);

                try {
                    const context = ragEngine.current.search(userMsg);
                    const contextStr = context.length
                        ? `\n\nContext from knowledge:\n${context.map(d => `- ${d.content}`).join("\n")}`
                        : "";

                    const msgsToSend = [
                        ...messages,
                        { role: "user", content: userMsg + contextStr }
                    ];

                    let fullResponse = "";
                    await callGrok(msgsToSend, (chunk) => {
                        fullResponse = chunk;
                        setMessages(m => {
                            const latest = [...m];
                            if (latest[latest.length - 1].role === "assistant") {
                                latest[latest.length - 1].content = fullResponse;
                            } else {
                                latest.push({ role: "assistant", content: fullResponse });
                            }
                            return latest;
                        });
                    });
                } catch (err) {
                    setMessages(m => [...m, {
                        role: "assistant",
                        content: `⚠️ Error: ${err.message}`
                    }]);
                } finally {
                    setLoading(false);
                }
            };

            const addKnowledge = () => {
                const text = prompt("Add knowledge to LUMINA's memory:");
                if (text) {
                    ragEngine.current.addDoc(text);
                    setRagDocs(ragEngine.current.getAll());
                    alert("✓ Added to knowledge base!");
                }
            };

            return (
                <div style={{ background: BRAND.black }} className="h-screen flex flex-col">
                    {/* Header */}
                    <div style={{ borderBottom: `1px solid ${BRAND.border}` }} className="p-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-purple-500 flex items-center justify-center">
                                <span className="title-font text-white font-bold">✦</span>
                            </div>
                            <div>
                                <h1 className="title-font font-bold text-lg">LUMINA OS</h1>
                                <p className="text-xs" style={{ color: BRAND.muted }}>Powered by Grok • Always Free</p>
                            </div>
                        </div>
                        <button
                            onClick={() => setShowRAG(!showRAG)}
                            className="px-3 py-2 rounded text-sm"
                            style={{ background: BRAND.surface, color: BRAND.gold }}
                        >
                            📚 Knowledge ({ragDocs.length})
                        </button>
                    </div>

                    <div className="flex flex-1 overflow-hidden gap-4 p-4">
                        {/* Main chat */}
                        <div className="flex-1 flex flex-col">
                            <div className="flex-1 overflow-y-auto pr-2 mb-4 space-y-4">
                                {messages.slice(1).map((msg, i) => (
                                    <div
                                        key={i}
                                        className="message"
                                        style={{
                                            textAlign: msg.role === "user" ? "right" : "left",
                                            marginLeft: msg.role === "user" ? "auto" : 0,
                                            marginRight: msg.role === "user" ? 0 : "auto",
                                            maxWidth: "85%"
                                        }}
                                    >
                                        <div
                                            className="px-4 py-3 rounded-lg inline-block"
                                            style={{
                                                background: msg.role === "user" ? BRAND.accent : BRAND.surface,
                                                color: BRAND.text,
                                                wordWrap: "break-word",
                                                whiteSpace: "pre-wrap"
                                            }}
                                        >
                                            {msg.content}
                                        </div>
                                    </div>
                                ))}
                                {loading && (
                                    <div className="flex gap-2" style={{ color: BRAND.muted }}>
                                        <div className="w-2 h-2 rounded-full pulse" style={{ background: BRAND.gold }}></div>
                                        <div className="w-2 h-2 rounded-full pulse" style={{ background: BRAND.gold, animationDelay: "0.2s" }}></div>
                                        <div className="w-2 h-2 rounded-full pulse" style={{ background: BRAND.gold, animationDelay: "0.4s" }}></div>
                                    </div>
                                )}
                                <div ref={messagesEnd}></div>
                            </div>

                            {/* Input */}
                            <div style={{ borderTop: `1px solid ${BRAND.border}` }} className="pt-4">
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyPress={e => e.key === "Enter" && send()}
                                        placeholder="Ask LUMINA anything..."
                                        disabled={loading}
                                        className="flex-1 px-4 py-3 rounded-lg outline-none"
                                        style={{
                                            background: BRAND.surface,
                                            color: BRAND.text,
                                            border: `1px solid ${BRAND.border}`
                                        }}
                                    />
                                    <button
                                        onClick={send}
                                        disabled={loading}
                                        className="px-6 py-3 rounded-lg font-medium transition"
                                        style={{
                                            background: BRAND.gold,
                                            color: BRAND.black,
                                            opacity: loading ? 0.5 : 1
                                        }}
                                    >
                                        {loading ? "..." : "Send"}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Knowledge sidebar */}
                        {showRAG && (
                            <div
                                className="w-64 rounded-lg p-4 overflow-y-auto"
                                style={{ background: BRAND.surface, border: `1px solid ${BRAND.border}` }}
                            >
                                <h3 className="font-bold mb-3 flex items-center justify-between">
                                    Knowledge Base
                                    <button
                                        onClick={() => ragEngine.current.clear() || setRagDocs([])}
                                        className="text-xs px-2 py-1 rounded"
                                        style={{ background: BRAND.red, color: "white" }}
                                    >
                                        Clear
                                    </button>
                                </h3>
                                {ragDocs.length === 0 ? (
                                    <p style={{ color: BRAND.muted }} className="text-sm">No knowledge yet.</p>
                                ) : (
                                    <div className="space-y-2">
                                        {ragDocs.map(doc => (
                                            <div
                                                key={doc.id}
                                                className="p-2 rounded text-sm"
                                                style={{ background: BRAND.black, borderLeft: `2px solid ${BRAND.gold}` }}
                                            >
                                                <p className="line-clamp-3">{doc.content}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <button
                                    onClick={addKnowledge}
                                    className="w-full mt-4 px-3 py-2 rounded text-sm font-medium"
                                    style={{ background: BRAND.gold, color: BRAND.black }}
                                >
                                    + Add Knowledge
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<LuminaOS />);
    </script>
</body>
</html>
