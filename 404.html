<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — ARTISY Store</title>
  <script>
    // GitHub Pages SPA 404 redirect hack
    // Captures the requested path and redirects to root with path as query param
    // WHITELIST: /lumen-academy/* paths are NOT redirected
    var l = window.location;
    
    // Whitelist paths that should NOT be redirected
    var whitelistPatterns = [
      /^\/lumen-academy\//,
      /^\/lumen-academy\/index\.html/,
      /^\/lumen-academy\/studio\.html/
    ];
    
    // Check if current path matches any whitelist pattern
    var shouldRedirect = true;
    for (var i = 0; i < whitelistPatterns.length; i++) {
      if (whitelistPatterns[i].test(l.pathname)) {
        shouldRedirect = false;
        break;
      }
    }
    
    if (shouldRedirect) {
      var segmentCount = 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }
  </script>

    body {

    p { color: #c4b5fd; margin-bottom: 2rem; }
    a { 
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff; 
      padding: 0.75rem 2rem; 
      border-radius: 50px; 
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s;
    }
    a:hover { transform: scale(1.05); }
  </style>
</head>
