services:
  - type: web
    name: invoice-variance-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GITHUB_MODELS_API_KEY
        scope: runtime
      - key: DATABASE_URL
        scope: runtime
      - key: SUPABASE_URL
        scope: runtime
      - key: SUPABASE_KEY
        scope: runtime
