<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T. Lott AgentHub - 6-Agent AI Workforce</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier Prime', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f0a1a 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        #root {
            width: 100%;
            min-height: 100vh;
        }
        
        .app-container {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f0a1a 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(100, 200, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
        
        .content {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(90deg, #00d4ff, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }
        
        .header p {
            color: #00ffff;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .agent-card {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.8), rgba(50, 40, 80, 0.8));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            position: relative;
        }
        
        .agent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            border-color: #00ffff;
        }
        
        .agent-card h3 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .agent-card p {
            color: #b0b0b0;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .agent-card .emoji {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .input-section {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.8), rgba(50, 40, 80, 0.8));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .input-section h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 15px;
        }
        
        .input-section textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px;
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid #00d4ff;
            color: #e0e0e0;
            font-family: 'Courier Prime', monospace;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff, #00ffff);
            color: #000;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .output-section {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.8), rgba(50, 40, 80, 0.8));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 25px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .output-section h3 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 15px;
        }
        
        .output-content {
            color: #c0c0c0;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95em;
        }
        
        .loading {
            color: #00d4ff;
            font-style: italic;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-left: 3px solid #ff6b6b;
            border-radius: 4px;
        }
        
        .success-message {
            color: #51cf66;
            margin-top: 10px;
            padding: 10px;
            background: rgba(81, 207, 102, 0.1);
            border-left: 3px solid #51cf66;
            border-radius: 4px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .agents-grid {
                grid-template-columns: 1fr;
            }
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 6px 12px;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s ease;
            font-family: 'Courier Prime', monospace;
        }

        .quick-action-btn:hover {
            background: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const GROK_API_KEY = 'xai-token-yRCYMQuymEdkCjdBwqWBn4v60E9h4DJqKnt6WAWYft3PYzOjvjTQEGfQjv4c9HIi43qKc7u7zZHIie2u';
        
        const agents = [
            {
                id: 'content-creator',
                name: '📝 Content Creator',
                description: 'Generate blog posts, social media content, email copy, and creative writing.',
                emoji: '📝',
                systemPrompt: 'You are an expert content creator who specializes in engaging, compelling copy for various platforms.'
            },
            {
                id: 'research',
                name: '🔍 Research Assistant',
                description: 'Deep research, fact-checking, data synthesis, and knowledge compilation.',
                emoji: '🔍',
                systemPrompt: 'You are a thorough research assistant who provides well-organized, accurate information with sources.'
            },
            {
                id: 'ai-employee-builder',
                name: '⚙️ AI Employee Builder',
                description: 'Design and plan AI agents, automations, and workflow systems.',
                emoji: '⚙️',
                systemPrompt: 'You are an expert in designing AI systems, automations, and workflow optimization.'
            },
            {
                id: 'productivity-coach',
                name: '⏰ Productivity Coach',
                description: 'Task planning, time management strategies, and workflow optimization.',
                emoji: '⏰',
                systemPrompt: 'You are a productivity and time management expert who helps people optimize their workflows.'
            },
            {
                id: 'business-strategist',
                name: '💼 Business Strategist',
                description: 'Business planning, growth strategies, market analysis, and revenue models.',
                emoji: '💼',
                systemPrompt: 'You are a strategic business consultant with expertise in growth, markets, and revenue optimization.'
            },
            {
                id: 'learning-accelerator',
                name: '🧠 Learning Accelerator',
                description: 'Create learning plans, explain complex topics, and design educational content.',
                emoji: '🧠',
                systemPrompt: 'You are an educational expert who breaks down complex topics and creates effective learning paths.'
            }
        ];
        
        function AgentHub() {
            const [selectedAgent, setSelectedAgent] = useState(null);
            const [userInput, setUserInput] = useState('');
            const [output, setOutput] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            
            useEffect(() => {
                // Create particles
                const particlesContainer = document.querySelector('.particles');
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 20 + 's';
                    particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                    particlesContainer.appendChild(particle);
                }
            }, []);
            
            const callGrokAPI = async (agentSystemPrompt, userMessage) => {
                try {
                    const response = await fetch('https://api.x.ai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${GROK_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: 'grok-3',
                            messages: [
                                {
                                    role: 'system',
                                    content: agentSystemPrompt
                                },
                                {
                                    role: 'user',
                                    content: userMessage
                                }
                            ],
                            temperature: 0.7,
                            max_tokens: 2000
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    return data.choices[0].message.content;
                } catch (err) {
                    throw new Error(`Grok API Error: ${err.message}`);
                }
            };
            
            const handleExecute = async () => {
                if (!selectedAgent) {
                    setError('Please select an agent first');
                    return;
                }
                
                if (!userInput.trim()) {
                    setError('Please enter a prompt');
                    return;
                }
                
                setLoading(true);
                setError('');
                setOutput('Processing...');
                
                try {
                    const agent = agents.find(a => a.id === selectedAgent);
                    const result = await callGrokAPI(agent.systemPrompt, userInput);
                    setOutput(result);
                } catch (err) {
                    setError(err.message);
                    setOutput('');
                } finally {
                    setLoading(false);
                }
            };
            
            const handleQuickAction = (action) => {
                const prompts = {
                    'blog': 'Write a blog post about [your topic here]',
                    'email': 'Write a professional email about [topic]',
                    'plan': 'Create a detailed plan for [your goal]',
                    'analyze': 'Analyze this: [paste your content here]'
                };
                setUserInput(prompts[action] || '');
            };
            
            return (
                <div className="app-container">
                    <div className="particles"></div>
                    <div className="content">
                        <div className="header">
                            <h1>⚡ T. LOTT AGENTHUB</h1>
                            <p>6-Agent AI Workforce Powered by Grok</p>
                        </div>
                        
                        <div className="agents-grid">
                            {agents.map(agent => (
                                <div
                                    key={agent.id}
                                    className="agent-card"
                                    onClick={() => setSelectedAgent(agent.id)}
                                    style={{
                                        opacity: selectedAgent === agent.id ? 1 : 0.7,
                                        borderColor: selectedAgent === agent.id ? '#00ffff' : '#00d4ff'
                                    }}
                                >
                                    <div className="emoji">{agent.emoji}</div>
                                    <h3>{agent.name}</h3>
                                    <p>{agent.description}</p>
                                    {selectedAgent === agent.id && (
                                        <div style={{ color: '#51cf66', fontSize: '0.9em', marginTop: '10px' }}>
                                            ✓ Selected
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                        
                        {selectedAgent && (
                            <>
                                <div className="input-section">
                                    <h2>💬 Your Prompt</h2>
                                    <textarea
                                        value={userInput}
                                        onChange={(e) => setUserInput(e.target.value)}
                                        placeholder="Enter your prompt here..."
                                        onKeyDown={(e) => {
                                            if (e.ctrlKey && e.key === 'Enter') handleExecute();
                                        }}
                                    />
                                    <div className="button-group">
                                        <button className="btn" onClick={handleExecute} disabled={loading}>
                                            {loading ? 'Processing...' : 'Execute'}
                                        </button>
                                        <button className="btn" onClick={() => setUserInput('')}>Clear</button>
                                    </div>
                                    <div className="quick-actions">
                                        <button className="quick-action-btn" onClick={() => handleQuickAction('blog')}>📝 Blog Post</button>
                                        <button className="quick-action-btn" onClick={() => handleQuickAction('email')}>✉️ Email</button>
                                        <button className="quick-action-btn" onClick={() => handleQuickAction('plan')}>📋 Plan</button>
                                        <button className="quick-action-btn" onClick={() => handleQuickAction('analyze')}>🔍 Analyze</button>
                                    </div>
                                    {error && <div className="error-message">{error}</div>}
                                </div>
                                
                                <div className="output-section">
                                    <h3>📤 Output</h3>
                                    <div className="output-content">
                                        {output || 'Output will appear here...'}
                                    </div>
                                </div>
                            </>
                        )}
                        
                        {!selectedAgent && (
                            <div className="input-section">
                                <p style={{ textAlign: 'center', color: '#00d4ff' }}>
                                    👈 Select an agent to get started
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<AgentHub />);
    </script>
</body>
</html>
