<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T. Lott AgentHub - 6-Agent AI Workforce</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier Prime', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f0a1a 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .app-container {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f0a1a 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(100, 200, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
        
        .content {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2.5em;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }
        
        .header p {
            color: #00ffff;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .agent-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(100, 50, 200, 0.1));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .agent-card:hover {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .agent-card.selected {
            border-color: #00ffff;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(100, 50, 200, 0.2));
        }
        
        .agent-emoji {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .agent-card h3 {
            color: #00ffff;
            margin-bottom: 8px;
            font-family: 'Orbitron', monospace;
        }
        
        .agent-card p {
            color: #b0b0b0;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .agent-card .selected-indicator {
            color: #51cf66;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .input-section {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.8), rgba(50, 40, 80, 0.8));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .input-section textarea {
            width: 100%;
            height: 150px;
            background: rgba(10, 10, 30, 0.8);
            border: 1px solid #00d4ff;
            color: #e0e0e0;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.95em;
            resize: vertical;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }
        
        .submit-btn {
            background: linear-gradient(90deg, #00d4ff, #00ffff);
            color: #0a0e27;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            transform: scale(1.05);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .output-section {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.8), rgba(50, 40, 80, 0.8));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 25px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .output-section h3 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 15px;
        }
        
        .output-content {
            color: #c0c0c0;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95em;
        }
        
        .loading {
            color: #00d4ff;
            font-style: italic;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-left: 3px solid #ff6b6b;
            border-radius: 4px;
        }
        
        .success-message {
            color: #51cf66;
            margin-top: 10px;
            padding: 10px;
            background: rgba(81, 207, 102, 0.1);
            border-left: 3px solid #51cf66;
            border-radius: 4px;
        }
        
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .quick-action-btn {
            padding: 6px 12px;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s ease;
            font-family: 'Courier Prime', monospace;
        }
        
        .quick-action-btn:hover {
            background: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .agents-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="particles"></div>
        <div class="content">
            <div class="header">
                <h1>⚡ T. LOTT AGENTHUB</h1>
                <p>6-Agent AI Workforce Powered by Grok</p>
            </div>
            
            <div class="agents-grid" id="agentsGrid"></div>
            <div id="inputArea"></div>
            <div id="outputArea"></div>
        </div>
    </div>

    <script>
        const GROK_API_KEY = 'xai-token-yRCYMQuymEdkCjdBwqWBn4v60E9h4DJqKnt6WAWYft3PYzOjvjTQEGfQjv4c9HIi43qKc7u7zZHIie2u';
        
        const agents = [
            {
                id: 'content-creator',
                name: '📝 Content Creator',
                emoji: '📝',
                description: 'Create blog posts, emails, social media content, and more',
                systemPrompt: 'You are a professional content creator. Help users write engaging, high-quality content across all platforms.'
            },
            {
                id: 'researcher',
                name: '🔬 Research Assistant',
                emoji: '🔬',
                description: 'Research topics, analyze information, and provide insights',
                systemPrompt: 'You are a research expert. Help users find, analyze, and understand information on any topic.'
            },
            {
                id: 'ai-builder',
                name: '🤖 AI Employee Builder',
                emoji: '🤖',
                description: 'Design and build AI automation workflows',
                systemPrompt: 'You are an AI automation expert. Help users design efficient AI-powered workflows and automations.'
            },
            {
                id: 'coach',
                name: '🎯 Productivity Coach',
                emoji: '🎯',
                description: 'Get strategies for productivity and time management',
                systemPrompt: 'You are a productivity coach. Help users develop strategies to work smarter and achieve their goals.'
            },
            {
                id: 'strategist',
                name: '💼 Business Strategist',
                emoji: '💼',
                description: 'Develop business strategies and growth plans',
                systemPrompt: 'You are a business strategist. Help users develop effective strategies for business growth and success.'
            },
            {
                id: 'accelerator',
                name: '⚡ Learning Accelerator',
                emoji: '⚡',
                description: 'Fast-track your learning on any subject',
                systemPrompt: 'You are a learning expert. Help users quickly master new skills and knowledge areas.'
            }
        ];
        
        let selectedAgent = null;
        let isLoading = false;
        
        function renderAgents() {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = agents.map(agent => `
                <div class="agent-card ${selectedAgent === agent.id ? 'selected' : ''}" onclick="selectAgent('${agent.id}')">
                    <div class="agent-emoji">${agent.emoji}</div>
                    <h3>${agent.name}</h3>
                    <p>${agent.description}</p>
                    ${selectedAgent === agent.id ? '<div class="selected-indicator">✓ Selected</div>' : ''}
                </div>
            `).join('');
        }
        
        function selectAgent(agentId) {
            selectedAgent = agentId;
            renderAgents();
            renderInputArea();
        }
        
        function renderInputArea() {
            const area = document.getElementById('inputArea');
            if (!selectedAgent) {
                area.innerHTML = '<div class="input-section" style="text-align: center; color: #00d4ff;">👈 Select an agent to get started</div>';
                return;
            }
            
            const agent = agents.find(a => a.id === selectedAgent);
            area.innerHTML = `
                <div class="input-section">
                    <h3 style="color: #00ffff; margin-bottom: 10px;">Talk to ${agent.name}</h3>
                    <textarea id="userInput" placeholder="Enter your request here..."></textarea>
                    <button class="submit-btn" onclick="submitRequest()">Send to Grok 🚀</button>
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="fillTemplate('blog')">Blog Post</button>
                        <button class="quick-action-btn" onclick="fillTemplate('email')">Email</button>
                        <button class="quick-action-btn" onclick="fillTemplate('plan')">Plan</button>
                        <button class="quick-action-btn" onclick="fillTemplate('analyze')">Analyze</button>
                    </div>
                </div>
            `;
        }
        
        function fillTemplate(type) {
            const templates = {
                'blog': 'Write a blog post about [your topic here]',
                'email': 'Write a professional email about [topic]',
                'plan': 'Create a detailed plan for [your goal]',
                'analyze': 'Analyze this: [paste your content here]'
            };
            document.getElementById('userInput').value = templates[type];
        }
        
        async function submitRequest() {
            if (!selectedAgent || isLoading) return;
            
            const userInput = document.getElementById('userInput').value.trim();
            if (!userInput) {
                alert('Please enter a request');
                return;
            }
            
            isLoading = true;
            const agent = agents.find(a => a.id === selectedAgent);
            
            document.getElementById('outputArea').innerHTML = `
                <div class="output-section">
                    <h3>Response from ${agent.name}</h3>
                    <div class="loading">Thinking...</div>
                </div>
            `;
            
            try {
                const response = await fetch('https://api.x.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'grok-3',
                        messages: [
                            {
                                role: 'system',
                                content: agent.systemPrompt
                            },
                            {
                                role: 'user',
                                content: userInput
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                const result = data.choices[0].message.content;
                
                document.getElementById('outputArea').innerHTML = `
                    <div class="output-section">
                        <h3>Response from ${agent.name}</h3>
                        <div class="output-content">${result}</div>
                        <div class="success-message">✓ Generated by Grok</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('outputArea').innerHTML = `
                    <div class="output-section">
                        <h3>Response from ${agent.name}</h3>
                        <div class="error-message">❌ Error: ${error.message}</div>
                    </div>
                `;
            } finally {
                isLoading = false;
            }
        }
        
        // Create particles
        function createParticles() {
            const container = document.querySelector('.particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animation = `float ${15 + Math.random() * 15}s infinite linear`;
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }
        
        // Initialize
        createParticles();
        renderAgents();
        renderInputArea();
    </script>
</body>
</html>
