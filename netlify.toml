# netlify.toml — ARTISY Store + Sacred Cycles API
# Enables serverless functions for lead capture

[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect API calls to functions (clean URLs)
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# SPA fallback (keep existing behavior)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
