<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Previews</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .audiobooks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .audiobook-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .audiobook-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .audiobook-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2em;
            padding: 20px;
            text-align: center;
        }
        .audiobook-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .audiobook-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .audio-player {
            margin: 15px 0;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
        }
        audio {
            width: 100%;
            height: 30px;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn-gumroad {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-gumroad:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .no-audio {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 Audiobook Previews</h1>
        <div class="audiobooks-grid" id="audiobooks"></div>
    </div>

    <script>
        const audiobooks = [
            {
                "title": "Beyond the Ache: Finding Hope When You're Broken",
                "url": "https://shop.artistrystore.com/audiobooks/Beyond_the_Ache_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/ache"
            },
            {
                "title": "Strength Through the Storm",
                "url": "https://shop.artistrystore.com/audiobooks/Strength_Through_the_Storm_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/storm"
            },
            {
                "title": "Fibromyalgia Compass: Your Guide to Wellness",
                "url": "https://shop.artistrystore.com/audiobooks/Fibromyalgia_Compass_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/fibro"
            },
            {
                "title": "Autoimmune Compass",
                "url": "https://shop.artistrystore.com/audiobooks/Autoimmune_Compass_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/autoimmune"
            },
            {
                "title": "The Lucky Swing",
                "url": null,
                "gumroad": "https://gumroad.com/l/luckys wing"
            },
            {
                "title": "Lilly Transformed",
                "url": "https://shop.artistrystore.com/audiobooks/Lilly_Transformed_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/lilly"
            },
            {
                "title": "Become the Bank",
                "url": "https://shop.artistrystore.com/audiobooks/Become_the_Bank_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/btb"
            },
            {
                "title": "First Year of Sleep",
                "url": "https://shop.artistrystore.com/audiobooks/First_Year_of_Sleep_AUDIOBOOK.mp3",
                "gumroad": "https://gumroad.com/l/fys"
            },
            {
                "title": "Clearer: A Sacred Cycles Companion",
                "url": null,
                "gumroad": "https://gumroad.com/l/clearer"
            },
            {
                "title": "Endo Patient's Survival Guide",
                "url": null,
                "gumroad": "https://gumroad.com/l/endoguide"
            },
            {
                "title": "ME/CFS Guide",
                "url": null,
                "gumroad": "https://gumroad.com/l/mecfs"
            },
            {
                "title": "Government Auctions",
                "url": null,
                "gumroad": "https://gumroad.com/l/govauctions"
            },
            {
                "title": "Poems of Wisdom",
                "url": null,
                "gumroad": "https://gumroad.com/l/poems"
            }
        ];

        const container = document.getElementById('audiobooks');
        
        audiobooks.forEach(book => {
            const card = document.createElement('div');
            card.className = 'audiobook-card';
            
            let audioHtml = '';
            if (book.url) {
                audioHtml = `
                    <div class="audio-player">
                        <audio controls>
                            <source src="${book.url}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                `;
            } else {
                audioHtml = '<div class="no-audio">Preview coming soon</div>';
            }
            
            card.innerHTML = `
                <div class="audiobook-image">
                    📚 ${book.title}
                </div>
                <div class="audiobook-content">
                    <div class="audiobook-title">${book.title}</div>
                    ${audioHtml}
                    <div class="button-group">
                        <a href="${book.gumroad}" target="_blank" class="btn btn-gumroad">🛒 Get It</a>
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });
    </script>
</body>
</html>
